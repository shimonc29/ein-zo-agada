<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><title>אין זו אגדה. מה הלאה? | שמעון כהן</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet"><style>

.menu-list button:hover,.menu-list button:focus-visible{background:var(--brand-soft);border-color:var(--brand);transform:translateY(-1px)}
.menu-list button:active{transform:scale(.99)}

<script>const BOOK_DATA=[{"id":"intro","title":"פתח דבר","parts":["בשנת 2048 מדינת ישראל תהיה בת מאה.","ניסיתי לדמיין את ירושלים ביום הזה.","איזה קול נשמע ברחובות.\nאיזה אנשים ילכו בהם.\nמה נראה מהחלון.\nאילו שפות נשמע ברקע.\nעל מה נדבר בארוחת הערב של יום העצמאות המאה.\nומה כבר יהיה מובן מאליו לילדים שיחיו כאן - דבר שהיום עוד נראה לנו כמעט בלתי אפשרי.","ניסיתי לדמיין איזו מדינה תהיה כאן.","חזקה יותר?\nעשירה יותר?\nבטוחה יותר?\nמחוברת יותר?\nאולי מפולגת יותר?\nאולי כל הדברים האלה יחד.","ואז הבנתי שאני מתחיל במקום הלא נכון.","כי לפני ששואלים איך תיראה מדינת ישראל בשנת המאה שלה, צריך לשאול שאלה פשוטה יותר אך גם קשה יותר:","איך אנחנו רוצים שהיא תיראה?","האם בכלל צריך להיות למדינה חזון?","אולי מספיק לנהל אותה היטב, לשמור עליה, לפתח את הכלכלה, לחנך את הילדים ולהגן על הגבולות.","ואם כן צריך חזון- מי קובע אותו?","האם חזון אחד יכול להתאים לחילוני ולדתי, ליהודי ולערבי, לתושב תל אביב ולתושב קריית שמונה, למי שחושב שהמדינה הולכת רחוק מדי בכיוון אחד ולמי שבטוח שהיא הולכת רחוק מדי בכיוון ההפוך?","אולי עצם הניסיון להגדיר חזון משותף הוא נאיבי.","ואולי חברה שלא יודעת לאן היא רוצה ללכת מגלה בסוף שכוחות אחרים כבר בחרו עבורה את הדרך.","בהתחלה חשבתי לנסות לענות על השאלות האלה.","לכתוב איך ישראל צריכה להיראות בשנת 2048.\nלקבוע יעד.\nלשרטט תמונה.","אבל ככל שניסיתי, הבנתי שאולי זו לא הדרך.","כי חזון אינו בהכרח תשובה שמישהו אחד כותב ואחרים צריכים לקבל.","אולי הוא מתחיל דווקא בשאלה.\nבבירור.\nבשיחה.\nבמוכנות לבדוק גם רעיונות שאנחנו אוהבים, ולשנות אותם כשהמציאות דורשת.","וכך נולדה דמותו של דוד.","לא משום שהוא יודע את התשובה.","להפך.","דוד מתחיל את הסיפור עם תחושה, עם שאלה, ועם רעיון שהוא עצמו עוד לא יודע להסביר עד הסוף.","מכאן הוא יוצא למסע.","הוא יפגוש אנשים, רעיונות, מקורות ומציאות. \nלפעמים הם יתחברו למה שהוא חושב. לפעמים יפריעו לו. \nלפעמים יכריחו אותו לשאול את השאלה מחדש.","לאט לאט יתברר שהערך של חזון אינו רק בתמונה שהוא מצייר בסוף הדרך.","אולי הוא נמצא גם בתנועה שהוא מייצר עכשיו.","דוד גם לא יוצא למסע הזה במקרה.","הוא מגיע אליו אחרי מלחמה.","אחרי תקופה שבה שאלת קיומה של מדינת ישראל שוב לא הייתה רעיון מספר היסטוריה.","אחרי רגעים שבהם אנשים היו מוכנים לעזוב הכול כדי להגן על הבית הזה.","וכשהוא חוזר הביתה, מתחילה להציק לו שאלה אחרת:","אם היינו מוכנים לשלם כל כך הרבה כדי שהבית הזה ימשיך להתקיים- מה אנחנו רוצים לעשות בו?","אני לא יודע אם דוד ימצא תשובה.","אני אפילו לא בטוח שצריך למצוא תשובה אחת.","יכול להיות שבסוף המסע יהיו יותר שאלות משהיו בתחילתו.","אבל אולי יהיה גם כיוון.","דרך.","ומעט יותר בהירות לגבי הדבר שאנחנו רוצים להיות כאן.","הרצל כתב:","“אם תרצו- אין זו אגדה.”","רצינו.","והאגדה הפכה למדינה.","אז מה עכשיו?","לאן היא הולכת?","האם אנחנו צריכים לדעת?","האם אנחנו יכולים לבחור?","והאם אפשר לבנות חזון שאינו שייך לאדם אחד, למפלגה אחת או לקבוצה אחת- אלא מזמין חברה שלמה להשתתף בבירור שלו?","בואו נצא יחד עם דוד למסע.","אולי נגלה."],"chars":2618},{"id":"ch1","title":"פרק 1 - כשהכל נראה פשוט מטורף","parts":["בית הקפה התל אביבי הקטן בטיילת ליד הים היה כמעט ריק- כמה שבתל אביב שום מקום ליד הים לא באמת ריק בשעת אחר צהריים. זוג מבוגר ישב ליד המעקה והביט בנוף, שתי בחורות עם מחשבים פתוחים ואוזניות עבדו בריכוז, ורוכב אופניים שסיים בדיוק את הרכיבה עצר לקחת קפה לדרך.","לשולחן הקטן מדי בפינה היה שקט משלו. שבועיים וחצי אחרי השחרור מהמילואים ישבו סביבו שלושה חברים, עם יותר מדי כוסות וצלחות על השולחן- נתן, אורי ודוד.","זו הייתה הפעם השלישית שנפגשו מאז שחזרו הביתה, ובכל פעם אמרו שזה סתם בשביל קפה. אף אחד מהם לא באמת האמין לזה.","הם נפגשו כי רק ביניהם לא היה צריך להסביר את עצמך. לא למה שיחה רגילה נקטעת באמצע. לא למה רעש חזק מהרחוב מקפיץ את הראש. לא למה דווקא עכשיו, כשהכול כביכול מאחוריהם, הם מרגישים לפעמים רחוקים יותר מהחיים שהיו להם קודם.","ובעיקר לא היה צריך להסביר את התחושה המוזרה הזאת: שבמילואים הם חיו בתוך חברה של אנשים שונים לגמרי, שהיו מוכנים למסור הכול זה בשביל זה- וכשחזרו הביתה, המדינה חזרה כמעט מיד לצעוק על עצמה.","״אני אומר לכם,״ אמר נתן והזיז את כוס הקפה הצדה, ״שבועיים. זה מה שלקח לי. שבועיים עד שחזרתי לשנוא את כולם.״","אורי צחק. ״שבועיים? וואלה, החזקת יפה.״","״אני רציני. בחיי.״","״גם אני,״ אמר אורי. ״פשוט אצלי זה לקח ארבעה ימים.״","כולם צחקו.","נתן נשען לאחור. ״אתם מבינים מה מטורף? שם ישבתי עם אנשים שאם הייתי פוגש אותם בפייסבוק לפני המלחמה- הייתי חוסם אותם.״","״כנראה?״ שאל אורי.","״בטוח.״","ושוב צחקו.","״אבל שם זה לא עניין אף אחד,״ המשיך נתן. ״שם זה פשוט לא היה רלוונטי. אתה יודע שהוא בא להחליף אותך בשמירה כשאתה גמור. זהו.״","המלצר הגיע והניח על השולחן קערית קטנה של זיתים. אף אחד לא הזמין אותה, ואף אחד לא שאל.","״ואז חוזרים,״ אמר נתן, ״פותחים חדשות, וכאילו כל הדבר הזה לא היה. תוך חמש דקות שוב כולם בוגדים, כולם אויבים, כולם אשמים בהכול.״","דוד נשא את מבטו לים. הגלים היו נמוכים. כמה גולשים ניסו עדיין לתפוס משהו מגל שלא באמת היה שם.","״אולי זה בגלל ששם הייתה משימה ברורה,״ אמר אורי.","״ופה אין לנו משימה ברורה?״","״לא כזאת.״","״אז זאת הבעיה שלנו.״","״איזו בעיה?״","״שבלי איום אנחנו לא יודעים להיות ביחד.״","השולחן השתתק. זה היה אחד המשפטים האלה שנאמרים כמעט בדרך אגב ונשארים תלויים באוויר.","דוד הביט בנתן. ״אתה באמת חושב שזה כל מה שיש פה?״","נתן משך בכתפיו. ״אני חושב שאני כבר לא יודע.״","״לא. שאלתי אם אתה חושב שאנחנו מסוגלים להיות ביחד רק כשמישהו יורה עלינו.״","״אני חושב שהניסיון שלנו די משכנע.״","אורי התערב. ״נו, אל תגזים.״","״אני לא מגזים. תסתכל סביב.״ נתן הצביע לעבר הטיילת, כאילו המדינה כולה נמצאת בין רוכבי האופניים לרצי הערב.","״אנחנו חוזרים ממלחמה ארוכה. אנשים קברו חברים. משפחות התפרקו. עסקים נפלו. ואתה אומר לעצמך- טוב, אולי עכשיו משהו ישתנה. אולי אחרי כל זה נבין משהו.״","הוא עצר רגע.","״ומה קורה? אותו דבר. אותם ריבים. אותם מחנות. רק יותר עייפים.״","דוד לא ענה מיד. הוא ידע שנתן לא מדבר רק על החדשות.","גם הוא הרגיש את זה. בימים הראשונים אחרי שחזר הייתה לו תחושה כמעט לא הגיונית שהעולם האזרחי קטן מדי- לא בגלל שהמלחמה הייתה גדולה, אלא מפני שהדברים שהטרידו אותו קודם נראו פתאום חסרי משקל.","ואז, לאט לאט, המשקל חזר.","מיילים. חשבונות. פקקים. פוליטיקה. עבודה. ויכוחים.","הכול חזר למקומו.","חוץ מדבר אחד.","הוא לא היה בטוח שהוא בעצמו חזר.","״אז מה אתה מציע?״ שאל דוד.","״אני? אני לא מציע כלום.״","״כלום?״","״כלום. אני לא חייב פתרון לכל דבר. אני רק אומר שהמצב גרוע.״","״זה קל להגיד.״","״נכון. קל וגם מדויק.״","דוד צחק, ונתן חייך. זה היה אחד הדברים שדוד אהב בו: הוא היה פסימי בלי להיות מריר. הוא לא חיפש להרוס תקווה של אחרים- הוא פשוט דרש ממנה לעמוד במבחן.","״אתה יודע מה הבעיה שלך?״ שאל נתן.","״בטח תגיד לי.״","״אתה תמיד חושב שיש מה לעשות.״","״וזה רע?״","״לפעמים כן. לפעמים דברים פשוט דפוקים. לא כל דבר הוא פרויקט.״","״אני לא חושב שהמדינה היא פרויקט.״","״אתה חושב שהחיים הם פרויקט.״","דוד חייך. ״אולי.״","המלצר חזר. ״תרצו להזמין עוד משהו?״","אורי הזמין בירה. נתן ויתר. דוד ביקש עוד קפה.","״אתה שוב שותה?״ שאל נתן.","״כן.״","״תישן הלילה?״","״לא תכננתי.״","כשהמלצר הלך, דוד נשען קדימה.","״אני באמת חושב שאנחנו שואלים את השאלה הלא נכונה.״","נתן הרים גבה. ״הנה זה מתחיל.״","״מה מתחיל?״","״הפרויקט.״","״עזוב, אני רציני.״","״זה בדיוק מה שמדאיג אותי.״","דוד התעלם.","״כל השיח פה הוא על איך שורדים. איך עוברים את המלחמה. איך מונעים את האיום הבא. איך בונים עוד כוח.״","״נשמע לי דווקא חשוב.״","״ברור שזה חשוב.״","״אז מה הבעיה שלך?״","דוד הביט שוב לים. הוא ניסה לנסח משהו שישב אצלו כבר שבועות, אבל בכל פעם שנתן לו מילים הוא נשמע גדול מדי.","״מה קורה אם מצליחים?״","נתן לא הבין. ״מה הכוונה?״","״נגיד שהצלחנו. אנחנו בטוחים. חזקים. הכלכלה טובה. הצבא חזק. אנשים באים לגור פה. המדינה מתפקדת. מה אז?״","נתן חיכה.","״זהו?״ שאל דוד.","״מה זה ‘זהו’?״","״זאת המטרה? להיות מדינה חזקה, בטוחה ומשגשגת?״","״כן.״","נתן הביט בו כאילו בדק אם זו שאלה רצינית. ״זה נשמע לי לא רע בכלל.״","״גם לי. אבל זה יעד- או תנאי בסיס?״","״דוד, רוב העולם ישמח מאוד ל‘תנאי בסיס’ כאלה.״","״אני יודע.״","״אז מה אתה מחפש?״","זו הייתה השאלה.","דוד הביט בכוס שלו.","״אני לא בטוח.״","״יופי. התקדמנו.״","״אני מתכוון...״ הוא עצר. ״אולי מדינה לא אמורה רק לדאוג לעצמה לתנאי חיים טובים.״","נתן מיד נכנס. ״אה. הנה הגענו.״","״לאן?״","״לתקן את העולם.״","״לא אמרתי את זה.״","״עוד לא אמרת.״","דוד צחק. ״אני רק אומר שאולי צריך להיות פה משהו מעבר. אם כל הסיפור הזה הוא שבסוף נהיה עוד מדינה מוצלחת- בשביל זה עברנו את כל מה שעברנו?״","״רגע,״ אמר נתן. ״‘עוד מדינה מוצלחת’ זה עכשיו דבר קטן?״","״לא.״","״מדינה יהודית, בטוחה, חזקה, עם כלכלה טובה ודמוקרטיה מתפקדת- זה לא מספיק לך?״","״אמרתי שזה לא מספיק לי?״","״די, דוד. זה בדיוק מה שאתה אומר.״","דוד שתק. אולי נתן צדק. אולי הוא באמת נשמע כפוי טובה.","״אני לא מזלזל בזה,״ אמר לבסוף. ״להפך. אולי דווקא בגלל זה.״","״בגלל מה?״","״כי אם כבר הצלחנו לבנות דבר כזה... אולי צריך לשאול מה עושים איתו.״","נתן חייך. לא בזלזול. בסקרנות.","״אוקיי. אז מה עושים איתו?״","דוד נשם עמוק. המשפט הבא הסתובב אצלו בראש כבר זמן מה. הוא עוד לא אמר אותו לאף אחד.","״אולי יום אחד אנשים מכל העולם יבואו לפה ללמוד.״","אורי הפסיק לשתות. נתן הביט בדוד. עברו שתיים־שלוש שניות.","ואז זה התחיל.","״ללמוד מה, דוד?״","״לא יודע.״","נתן צחק וגרר אחריו את אורי. דוד צחק איתם, אבל הפעם כבר הרגיש קצת מטופש.","״לא, באמת,״ אמר נתן. ״אני איתך. בוא נפתח את זה. ללמוד מה? פוליטיקה?״","״לא.״","״חינוך? משפט? תחבורה? דיור?״","״נתן.״","״יחסים בין קבוצות בחברה?״ אורי התערב. ״בזה אנחנו בטוח מצטיינים.״","כולם צחקו שוב.","נתן המשיך, הפעם בלי עוקצנות. ״אני לא עושה ממך צחוק. באמת. אני מנסה להבין. למה שמישהו יבוא לפה ללמוד?״","דוד חיפש תשובה. היו לו דוגמאות- טכנולוגיה, רפואה, חקלאות, חירום, מים- אבל ברגע ההוא הכול נשמע קטן לעומת גודל הטענה.","״יש פה דברים שאנחנו כן יודעים לעשות,״ אמר.","״ברור. יש גם ביפן. ובגרמניה. ובסינגפור. בכל מדינה בעולם יש משהו שהיא טובה בו.״","״נכון.״","״אז למה שיבואו לכאן ללמוד? ולמה בכלל ‘יבואו ללמוד מאיתנו’? מה אנחנו, המורים של האנושות?״","״לא לזה התכוונתי.״","״אז למה כן?״","שוב נהיה שקט בשולחן.","הרעש מהטיילת חזר להיכנס- מוזיקה מרחוק, פעמון של רוכב אופניים, ילד שבכה כי הגלידה שלו נפלה.","דוד ניסה שוב.","״אני לא חושב שאנחנו יותר טובים מאחרים.״","״אז?״","״אולי זה לא ‘ללמוד מאיתנו’. אולי...״","הוא עצר.","המחשבה עוד לא הייתה מוכנה.","״עזוב.״","״לא, תמשיך,״ אמר נתן.","״אין לי עדיין תשובה.״","״אז אולי אין לך רעיון בכלל.״","המשפט נאמר בשקט, וזה בדיוק למה הוא פגע.","לא היה בו לעג. רק אפשרות פשוטה: שאולי באמת אין פה רעיון. שאולי דוד לקח תחושה גדולה שנולדה אחרי חודשי מלחמה וניסה להפוך אותה למשהו שהיא בעצם לא. שאולי כל הצורך למצוא משמעות רחבה יותר הוא בסך הכול דרך לא לחזור לשגרה.","נתן לקח את הכוס שלו.","״אני אגיד לך מה אני חושב.״","דוד הנהן.","״אני חושב שאנחנו צריכים להיות קצת פחות גרועים לפני שאנחנו מתחילים לדמיין איך אנחנו מתקנים אחרים.״","דוד לא ענה.","״תראה אותנו,״ המשיך נתן. ״שלושה אנשים שחזרו ממילואים ולא מצליחים להבין איך אותה מדינה שהצליחה לייצר בינינו אחווה כזאת חוזרת תוך שבועיים לאכול את עצמה. אולי קודם נלמד איך לא לשנוא אחד את השני.״","אורי הנהן בהסכמה.","דוד רצה להתווכח, אבל לא מצא עם מה.","תכל׳ס- נתן צדק. לא רק קצת. כמעט בכל דבר.","השמש ירדה נמוך יותר, ואור כתום התחיל להישפך על המים. אורי הסתכל בשעון וקם ראשון. לאט לאט אספו את הדברים.","נתן ודוד נשארו לעוד דקה.","״אל תיקח אותי קשה,״ אמר נתן.","״אני לא.״","״יש לך נטייה לקחת רעיון ולהתאהב בו.״","״ואתה נהנה להרוס לי אותם.״","״בשביל זה יש חברים, לא?״","הם חייכו.","״נתראה?״","״ברור.״","התחבקו. נתן פנה לכיוון הרחוב. דוד נשאר ליד הים, לא ממהר, והלך כמה דקות לאורך הטיילת בלי יעד.","נתן צדק, חשב לעצמו.","המצב לא נראה טוב- אולי אפילו גרוע יותר משדוד הרשה לעצמו להודות. אנשים שחזרו ממלחמה גילו שהאחדות שחוו שם לא עברה איתם בשלמותה לחיים האזרחיים.","הוא חשב שוב על המשפט שאמר ליד השולחן- שיום אחד אנשים מכל העולם יבואו לפה ללמוד.","עכשיו זה נשמע לו כמעט מגוחך.","הוא אפילו לא ידע להסביר מה בדיוק אמורים ללמוד. או למה דווקא כאן. או למה שמישהו ירצה לבוא.","הוא הגיע עד קו המים ועצר. הגלים הקטנים נשברו על החול וחזרו.","אולי נתן באמת צדק. אולי כל הסיפור הזה היה סתם ניסיון למצוא משמעות במקום שאין בו כזאת.","ובכל זאת, מול השקיעה, שאלה אחת סירבה להשתתק אצלו:","אם כל כך הרבה אנשים היו מוכנים לתת כל כך הרבה כדי שהמדינה הזאת תמשיך להתקיים- \nמה אנחנו רוצים לעשות איתה?","לא הייתה לו תשובה.","לא הייתה לו תוכנית.","אפילו לא הייתה לו טענה מסודרת.","רק שאלה.","והיא לא נתנה לו מנוח.","דוד נשאר עוד כמה דקות מול הים, ואז הסתובב והתחיל ללכת הביתה.","נתן כנראה צדק.","אבל משום מה, דוד עדיין האמין שהוא לא צודק עד הסוף.","הוא פשוט עוד לא ידע למה."],"chars":8716},{"id":"ch2","title":"פרק 2 - איזו מדינה, איזו מדינה","parts":["הפקק בכביש 6 לכיוון צפון היה בלתי נסבל. דוד עמד בו כבר עשרים וחמש דקות, מביט בשורת המכוניות שנמתחה לפניו עד קו ההרים. הוא היה אמור להגיע לבית הספר בעמק בעוד שעה ורבע. לפי המפה, הנסיעה הייתה אמורה לקחת ארבעים ושמונה דקות.","הוא צחק לעצמו. גם אחרי כל השנים, אפליקציות ניווט עדיין הבטיחו דברים שאף ישראלי לא באמת האמין להם.","הוא לחץ שוב על הפליי והמשיך להאזין לפודקאסט מהמקום שבו עצר. המנחה דיבר עם מנכ״ל לשעבר של אחת מחברות הטכנולוגיה הביטחונית הגדולות בישראל- על גידול ביצוא, ביקוש עצום באירופה ובאסיה, ומדינות שביקשו ללמוד מהניסיון הישראלי.","דוד הקשיב בחצי אוזן. הוא אהב פודקאסטים כאלה לנסיעות- כלכלה, היסטוריה, לפעמים ביטחון.","הנסיעות ברחבי הארץ היו מהדברים שאהב בעבודה שלו. הוא עדיין היה איש חינוך, אבל כבר לא היה כלוא בין ארבעה קירות של כיתה. אחרי כמה שנים שבהן לימד היסטוריה ואזרחות בתיכון במרכז הארץ, הוא הצטרף לתוכנית ארצית שעבדה עם בתי ספר ורשויות מקומיות על מנהיגות אזרחית וחינוך לחברה משותפת.","בפועל זה אומר שהוא עדיין דיבר עם בני נוער כמעט בכל שבוע, אבל גם נסע הרבה- למנהלים, לצוותי חינוך, לראשי מחלקות נוער ולפעמים לראשי רשויות.","הנסיעה היום הייתה לבית ספר בצפון שהשתתף בתוכנית. המנהל התקשר אליו בעצמו וביקש שיגיע.","״אנחנו צריכים לחשוב מחדש על השנה הבאה,״ אמר לו בטלפון. ״הילדים חזרו, אבל הם לא באמת חזרו.״","דוד לא היה צריך הסבר. הוא הכיר את המשפט הזה מכל כך הרבה כיוונים.","בפודקאסט שאל המנחה:","״אז למה בעצם מדינות מגיעות אלינו? למה הן לא קונות מערכת וזהו?״","״כי מערכת היא רק חלק קטן מהעניין,״ ענה האורח. ״הן רוצות להבין את דרך החשיבה. איך פועלים תחת לחץ. הן באות ללמוד מהניסיון הישראלי.״","דוד הזדקף מעט.","הן באות ללמוד.","המחשבה החזירה אותו מיד לשולחן הקטן מול הים, לנתן ששאל אותו:","״ללמוד מה?״","הנה, נתן. יש תשובה. הן כבר באות.","החיוך נעלם כמעט מיד.","ללמוד להתגונן. לזהות איום. ליירט. להחזיק מערכת כשמישהו בצד השני מנסה להרוס אותה.","זה לא היה מה שנתן שאל. וזה גם לא היה מה שדוד באמת התכוון אליו כשהמשפט ההוא יצא לו ליד הים.","לא שהיה בזה משהו רע. להפך. הוא הכיר מספיק אנשים שחייהם ניצלו בזכות היכולת הזאת. גם הוא עצמו היה חי בזכות אנשים ומערכות שנבנו במשך שנים מתוך ניסיון קשה.","הייתה בו גאווה אמיתית על זה.","אבל יחד איתה עלתה שוב השאלה:","איזו מדינה אנחנו רוצים להיות?","הפודקאסט המשיך. האורח תיאר עסקה חדשה עם מדינה אירופית- סכומים גדולים, אלפי עובדים.","״יש פה תעשייה שנבנתה מתוך הכרח,״ הוא אמר. ״ישראל לא בחרה את סביבת האיומים שלה. היא נאלצה ללמוד להתמודד איתה, והידע הזה הפך עם השנים לנכס עולמי.״","נבנתה מתוך הכרח.","דוד הוריד את הווליום.","המשפט נשאר אצלו.","מבעד לחלון נמתח שדה פתוח, ומרחוק כבר היה אפשר לראות את קו ההרים.","אולי היה בזה משהו רחב יותר. לא רק בתעשיות הביטחוניות.","מלחמה הכריחה לבנות מערכות הגנה. מחסור במים הכריח לחשוב אחרת על חקלאות. גלי עלייה הכריחו מדינה צעירה לקלוט אוכלוסיות בקצב שמעט מדינות הכירו.","שוב ושוב המציאות הציבה בעיה, ולא נשארה ברירה אלא ללמוד מהר.","לנסות. לטעות. לשנות.","דוד כמעט שמע את קולו של נתן בראש:","יש גם ביפן. ובגרמניה. ובכל מקום בעולם.","נכון.","אז מה בעצם מיוחד פה?","הפקק התקדם כמה מטרים ונעצר שוב.","דוד לא היה בטוח שיש לו תשובה.","וטוב שכך, חשב. לפחות הפעם הוא לא ממהר להמציא אחת.","הוא לחץ שוב על הפליי.","עכשיו דיברו על התחזית לשנים הקרובות, והמנחה השתמש בביטוי ״תור הזהב של התעשיות הביטחוניות״.","דוד לא אהב אותו.","תור זהב- לדבר שנולד מכך שעוד ועוד מדינות בעולם חוששות ממלחמה.","הוא כיבה את הפודקאסט לגמרי ונסע את שאר הדרך בשקט.","* * *","הוא הגיע לבית הספר באיחור של תשע דקות. המנהל חיכה לו ליד השער.","״אמרתי לך לא להאמין לאפליקציה,״ אמר עוד לפני שאמר שלום.","״אני מאמין בבני אדם.״","״זו בדיוק הטעות שלך.״","דוד צחק, והם נכנסו פנימה.","בית הספר נראה רגיל- מסדרונות, לוחות מודעות, ילדים שיצאו מהכיתות למרות שהצלצול עדיין לא נשמע.","אבל כמעט בכל פינה היו סימנים לכך שהשנה הזאת לא הייתה רגילה.","על אחד הקירות הייתה תלויה תמונה גדולה של בוגר בית הספר שנהרג במלחמה, ולידה מכתבים שתלמידים כתבו.","במסדרון אחר היה לוח של משפחות שפונו מהיישובים באזור וחזרו רק בחודשים האחרונים.","המנהל הוביל אותו לחדר המורים.","״אני אגיד לך מה הבעיה שלי,״ אמר.","״חשבתי שבשביל זה הזמנת אותי.״","״יש לי מורים שמדברים על חוסן. יש לי תלמידים שלא רוצים לשמוע את המילה חוסן יותר בחיים.״","דוד חייך. ״מבין אותם.״","״יש לי תוכניות מנהיגות, תוכניות ערכים, תוכניות שייכות. הכול טוב. אבל הילדים מסתכלים על המבוגרים ואומרים- אתם רוצים ללמד אותנו איך לחיות ביחד?״","הוא עצר ליד הדלת.","״ואין לי תשובה טובה.״","דוד הביט בו.","המילים התחברו מיד לנתן:","אולי קודם נלמד איך לא לשנוא אחד את השני.","הם נכנסו לחדר. שמונה מורים כבר חיכו להם.","בשעתיים הבאות דיברו על השנה הבאה.","לא על חזון לאומי.","על דברים קטנים.","איך מחזירים תלמידים שהפסיקו להגיע. איך יוצרים מפגש בין קבוצות שלא רוצות לדבר. איך מלמדים אזרחות בלי שהשיעור יהפוך למלחמה פוליטית. איך נותנים למורה כלים להתמודד עם תלמיד שאיבד אב. איך מחזירים אמון.","דוד הקשיב הרבה יותר מכפי שדיבר.","באמצע הישיבה אחת המורות אמרה:","״כל הזמן אומרים לנו לחזור לשגרה. אני כבר לא בטוחה שאני רוצה לחזור לשגרה שהייתה.״","אף אחד לא ענה מיד.","דוד כתב את המשפט במחברת.","בלי להוסיף לידו כלום.","* * *","בדרך חזרה הוא לא שם פודקאסט.","כבר החשיך, והכביש היה פתוח הפעם.","הוא חשב על המורה. על נתן. על המנכ״ל מהפודקאסט.","שלושה אנשים שלא הכירו זה את זה, ובכל זאת כל אחד מהם דחף אותו לאותה שאלה מכיוון אחר.","המציאות ידעה להכריח אנשים ללמוד.","אבל האם אפשר ללמוד גם בלי שהמציאות תכריח?","הוא חשב על המילואים. על כמה דברים נבנו שם מתוך צורך מיידי. לא כי ועדה תכננה אותם מראש, אלא כי הייתה בעיה והיה צריך לפתור אותה עכשיו.","אנשים ניסו. טעו. שינו. העבירו הלאה.","לא גאונות.","לא איזה סוד ישראלי מסתורי.","ניסיון.","למידה.","התאמה.","אבל אם מדינה יודעת לעשות את זה היטב כשהיא תחת אש- למה כל כך קשה לעשות את אותו הדבר בחיים הרגילים?","בחינוך.","ברפואה.","ביחסים בין קבוצות.","במערכות גדולות שנועדו לעבוד גם כשאין סכנה מיידית.","דוד נזכר שוב במורה:","אני כבר לא בטוחה שאני רוצה לחזור לשגרה שהייתה.","אולי זאת הייתה השאלה.","לא איך חוזרים למה שהיה.","אלא מה לומדים ממה שהיה- כדי שהדבר הבא יהיה קצת אחר.","הוא עדיין לא ידע מה הקשר בין זה לבין המשפט המטופש שאמר לנתן ליד הים על אנשים שיבואו לכאן מכל העולם.","יכול להיות שלא היה קשר בכלל.","ויכול להיות שהיה.","אבל בפעם הראשונה נדמה לו שהשאלה החשובה אינה:","מה יש לנו ללמד אחרים?","אלא:","מה אנחנו עצמנו צריכים ללמוד כדי להפוך למדינה שאנחנו רוצים להיות?"],"chars":5881},{"id":"ch3","title":"פרק 3 -מי אנחנו בכלל?","parts":["הישיבה התחילה באיחור של עשרים ושלוש דקות.","אף אחד לא התנצל.","דוד ישב בקצה השולחן, מול מסך שכבר הציג שלוש פעמים את אותה שקופית, והביט באנשים שנכנסו אחד אחרי השני לחדר.","מנהלת אגף חינוך ברשות מקומית. מפקחת. שני מנהלי בתי ספר. נציגת תוכנית ארצית. איש תקציבים. מישהי מהמשרד שאף אחד לא היה בטוח בדיוק מה תפקידה, אבל כולם ידעו שבלעדיה אי אפשר יהיה להתקדם.","הישיבה הייתה אמורה לעסוק בתוכנית חדשה לחיזוק תחושת השייכות והחוסן בקרב תלמידים שחזרו לשגרה אחרי שנות המלחמה.","המושג ״חוסן״ הופיע בכותרת המסמך שש פעמים.","דוד ספר.","אחרי הפעם הרביעית כבר הפסיק.","״אז קודם כול,״ אמרה נציגת המשרד, ״חשוב לנו להדגיש שהשנה אנחנו רוצים לייצר שפה אחידה.״","המנהלת שישבה ליד דוד הסתכלה עליו.","לא היה צריך לומר כלום.","הוא כבר הכיר את המבט הזה.","שפה אחידה הייתה בדרך כלל הסימן לכך שבתוך חודשיים לכל בית ספר תהיה שפה אחרת.","״יש פה מתווה מאוד ברור,״ המשיכה הנציגה, ״עם שלושה צירי פעולה, חמישה מדדי הצלחה ושאלון הערכה ארצי שנרצה שכל מוסד ימלא בתחילת השנה ובסופה.״","אחד המנהלים הרים יד.","״סליחה, רק כדי להבין- זה במקום התוכנית של שנה שעברה או בנוסף?״","הנציגה הסתכלה בדפים.","״זו תוכנית חדשה.״","״כן, את זה הבנתי. אני שואל אם הישנה מסתיימת.״","״היא לא בדיוק מסתיימת.״","״אז היא ממשיכה?״","״בחלק מהמרכיבים.״","״איזה חלק?״","״זה עדיין בדיון.״","המנהל הנהן.","״אז אני צריך להמשיך תוכנית אחת, להתחיל תוכנית שנייה ולהגיש דיווח על שתיהן?״","״כרגע כן.״","הוא חייך.","לא חיוך של שמחה.","״יופי.״","דוד הוריד את העיניים למחברת.","הוא כבר שמע שיחות כאלה בעבר. לא בדיוק אותן מילים, אבל אותה מוזיקה.","תוכנית חדשה. מונחים חדשים. טפסים חדשים. מטרה טובה. אנשים רציניים.","ובכל זאת, משהו בחדר הרגיש כאילו אף אחד לא באמת מאמין שהדבר יחזיק מספיק זמן כדי להפוך לשיטה.","המפקחת ביקשה לדבר.","״אני רוצה להגיד משהו מהשטח. יש לי בית ספר באזור שכבר שנתיים עובד עם מודל מאוד מוצלח לחיבור בין תלמידים שחזרו מפינוי לבין תלמידים שלא פונו. הם עשו שם עבודה מצוינת. למה שלא ניקח את זה ונרחיב אותו?״","הנציגה מהמשרד הנהנה.","״מעולה. תשלחו לנו חומר.״","המפקחת הסתכלה עליה.","״שלחנו.״","״מתי?״","״בנובמבר.״","״למי?״","המפקחת פתחה את הטלפון.","״לצוות שהיה אחראי אז על התחום.״","״הצוות הזה כבר לא קיים.״","אף אחד לא אמר כלום.","דוד הרים את הראש.","״מה זאת אומרת לא קיים?״ שאל מנהל אחר.", אתה רוצה את הגרסה הפסימית?״","״מתי עצרת את עצמך בגלל שלא ביקשתי?״","״אנחנו מעולים בלהציל מצב. פחות טובים בלבנות מערכת שלא תצטרך שיצילו אותה.״","דוד הסתכל על הקיר מולו.","המשפט היה חריף.","אבל הוא פגע במקום הנכון.","״אז מה עושים?״ שאל.","״אין לי מושג.״","״חשבתי שאתה יודע הכול.״","״אני רק יודע להגיד למה דברים לא יעבדו. פתרונות זה המחלקה שלך.״","הם צחקו.","* * *","בימים הבאים דוד התחיל לשים לב לדברים שקודם עברו לידו.","תוכנית שפעלה כמה שנים ונעלמה כשהתקציב הסתיים.","שיטה שרשות אחת פיתחה ואף רשות אחרת לא שמעה עליה.","אבל השיחה שנשארה איתו הכי הרבה הייתה עם מורה ותיק בבית ספר בדרום.","הם עמדו בחדר המורים אחרי השיעורים, והמורה ליווה אותו עד הדלת.","״אתה יודע כמה רפורמות עברתי?״ שאל, בלי לצפות באמת לתשובה.","״כמה?״","״ארבע. כל אחת הבטיחה לשנות את מקצוע ההוראה מהיסוד. חוסן. מצוינות. מיומנויות המאה העשרים ואחת. עכשיו שוב חוסן, רק בגרסה חדשה.״","דוד חייך.","״ומה נשאר מכולן?״","המורה חשב רגע.","״אני. אני נשארתי. השמות השתנו.״","הוא אמר את זה כמעט בלי מרירות.","כמו עובדה על מזג האוויר.","בדרך לרכב דוד חשב שאולי הוא עושה לעצמו בדיוק את מה שנתן ומתן עוד יאשימו אותו בו בעתיד: מחפש הוכחות למה שכבר התחיל לחשוב.","גם זו הייתה אפשרות.","אבל דבר אחד כבר היה קשה לו לא לראות.","הפער בין האנשים למערכת.","הוא פגש אנשי חינוך מעולים. רופאים מעולים. מפקדים מעולים. ראשי רשויות מעולים. יזמים מעולים.","אנשים עם רעיונות, ניסיון ויכולת.","ואיכשהו, ההצטיינות שלהם נשארה פעמים רבות מקומית.","אצל האדם.","בארגון.","בעיר.","ביחידה.","בבית הספר.","כאילו המדינה ידעה לייצר הרבה נקודות אור- אבל פחות ידעה לחבר ביניהן.","* * *","שבוע אחר כך נכנסה לתיבת הדואר שלו הודעה ממנהל בית הספר שבו ביקר בצפון.","הנושא היה:","אמרת שאתה רוצה לראות משהו שעובד.","בתוך ההודעה היו שלוש שורות.","יש פה מועצה אזורית שבנתה בשנה האחרונה מודל מעניין מאוד לחזרה של בני נוער מפונים למסגרות.","בלי תוכנית ארצית ובלי הרבה תקציב.","אם מעניין אותך, אחבר אותך למי שהוביל את זה.","דוד קרא את ההודעה פעמיים.","בלי תוכנית ארצית.","בלי הרבה תקציב.","משהו שעובד.","הוא חשב על הישיבה.","על המנהלת שאמרה שהמערכת אינה יודעת לזכור.","על נתן שאמר שהם טובים בלהציל מצב ופחות טובים בלבנות מערכת שלא צריך להציל.","ואולי הוא שוב שאל שאלה גדולה מדי.","אולי לא צריך עדיין לחשוב על מדינה חכמה.","אולי צריך להתחיל במקום פשוט יותר.","אם במקום אחד מישהו למד לפתור בעיה- איך הידע הזה מגיע למקום הבא?","ואם הוא לא מגיע- למה?","דוד לחץ על ״השב״.","אשמח. תחבר בינינו.","אחרי ששלח, נשען לאחור.","הוא עדיין לא ידע אם כל המחשבה שלו על ישראל ועל העתיד שלה הייתה חזון, אשליה או פשוט ניסיון לתת שם לתחושה שאחרי המלחמה.","אבל שאלה אחת התחילה להתבהר:","אולי לא חסרה כאן חכמה.","אולי היא פשוט מפוזרת.","ואם כך-","איך הופכים ניסיון של אנשים לחכמה של מדינה?"],"chars":8478},{"id":"ch4","title":"פרק 4 -האיש שלא הסתפק במדינה","parts":["הספר היה מונח על המדף כבר שנים. דוד ידע שהוא שם. פעם אפילו התחיל לקרוא אותו- ולא הגיע רחוק.","כמו הרבה אנשים, הוא הכיר את הרצל דרך כמה תמונות קבועות: הזקן השחור, המרפסת בבאזל, ״אם תרצו- אין זו אגדה״, הקונגרס הציוני, החלום על מדינה ליהודים.","הרצל היה מבחינתו האיש שראה משהו שאחרים לא העזו לראות.","מדינה.","זה הספיק.","אבל עכשיו, כמה שבועות אחרי הישיבה ההיא במשרד החינוך, דוד מצא את עצמו חוזר אליו.","לא בגלל נוסטלגיה.","בגלל שאלה.","איך אדם מדמיין משהו שאינו קיים- בלי להפוך את הדמיון לבריחה מהמציאות?","הוא שלף את אלטנוילנד מהמדף. הכריכה הייתה מאובקת. דוד ניגב אותה בשרוול והתיישב.","הפעם ניסה לקרוא אחרת.","לא את הרצל כסמל.","את הרצל כאדם שניסה לתאר מציאות שעוד לא הייתה קיימת.","ומהר מאוד תפס אותו משהו שלא חשב עליו קודם.","הרצל לא הסתפק באמירה שצריך להקים מדינה יהודית.","הוא שאל:","איזו מדינה?","דוד עצר.","השאלה הרגישה לו מוכרת מאוד.","הרצל כתב על רחובות. על תחבורה. על עבודה. על מוסדות. על יחסים בין קבוצות. על חברה. על תרבות.","חלק מהדברים נראו היום מיושנים. אחרים נאיביים. אבל זה כמעט לא היה חשוב.","מה שתפס את דוד היה עצם המעשה.","לתאר איך נראים החיים ביום שאחרי הגשמת החלום.","לא רק איך מגיעים למדינה- אלא מה עושים כשהיא כבר קיימת.","דוד פתח את המחברת וכתב:","מה קורה אחרי שהחזון מצליח?","הוא הסתכל על המשפט.","זה היה כמעט אותו הדבר ששאל את נתן ליד הים.","נגיד שהצלחנו.","אנחנו חזקים. בטוחים. משגשגים.","מה אז?","* * *","ככל שהתקדם בקריאה, דוד התחיל לראות דבר נוסף.","הרצל לא פחד מפרטים.","דוד תמיד חשב על חזון כעל משהו גבוה- משפט גדול, רעיון, יעד, כיוון.","אבל כאן היה אדם שכתב על מוסדות של מדינה שעדיין לא קיימת כאילו מישהו כבר צריך לחשוב איך ייראה בה יום שלישי בבוקר.","דוד חייך.","אולי בזה היה משהו שחסר לו.","במשך שבועות הוא הסתובב עם שאלות גדולות:","איזו מדינה אנחנו רוצים להיות?","איך מדינה לומדת?","איך הופכים ניסיון של אנשים לחכמה של מערכת?","אבל אולי חזון מתחיל להיות רציני רק כשהוא נאלץ לפגוש פרטים.","אנשים.","מקומות.","מוסדות.","אחריות.","הוא כתב במחברת:","חזון בלי מוסדות נשאר—","עצר.","מחק.","ניסה שוב.","חזון בלי מוסדות נשאר סיסמה.","גם זה נשמע לו חגיגי מדי.","הוא סגר את המחברת.","* * *","ואז הגיע להיכל השלום.","דוד קרא את הקטע פעם אחת.","חזר להתחלה.","קרא שוב, לאט יותר.","הרצל תיאר מקום שפועל לא רק למען הארץ היהודית ויושביה, אלא גם למען ארצות ועמים אחרים.","מקום שאליו פונים מלומדים, ממציאים ואמנים.","מקום שעוסק בסיוע בעת אסונות- שרפות, שיטפונות, רעב ומגפות.","דוד נשען לאחור.","משהו בקטע הרגיש לו כמעט זר לתמונה הפשוטה שהחזיק כל השנים על הרצל.","הוא חזר למשפט שסימן:","״אין פועלים פה בגלל ארץ היהודים ויושביה, כי אם בגלל כל הארצות והעמים.״","הוא קרא אותו שוב.","בלי לכתוב.","בלי לסמן.","בלי לנסות להסביר.","פשוט קרא.","דוד הרגיש התרגשות שהוא לא לגמרי סמך עליה.","לא מפני שמצא הוכחה לרעיון שלו.","לפחות כך ניסה לומר לעצמו.","גם לא משום שהרצל כבר חשב בדיוק את מה שהוא חושב עכשיו.","ברור שלא.","אבל פתאום ראה אצל הרצל משהו שלא שם לב אליו קודם:","האפשרות שמדינה יהודית לא תחשוב רק על עצם קיומה.","שהיא תשאל גם מה היא בונה כאן, ומה מתוך הדבר הזה יכול להיות בעל ערך מעבר לעצמה.","דוד המשיך לקרוא.","על שער היכל השלום, כך תיאר הרצל, מופיע המשפט:","״אין דבר אנושי זר לי.״","הוא קרא אותו בקול.","הפעם המשפט עצר אותו מסיבה אחרת.","השנים האחרונות לימדו אותו כמה קל לחלק את העולם למחנות.","אנחנו והם.","ידידים ואויבים.","שייכים וזרים.","והנה בתוך החזון של הרצל הופיע מוסד בירושלים שעל שערו נכתב כמעט ההפך:","אין בעיה אנושית שאני יכול לפטור את עצמי ממנה רק מפני שהיא אינה שלי.","דוד סגר את הספר.","בחדר היה שקט.","* * *","למחרת הוא לקח את הספר איתו לעבודה.","לא הייתה לזה סיבה מיוחדת. הוא פשוט הניח אותו בתיק.","בצהריים ישב בחדר קטן ליד משרד המנהלת וחיכה לפגישה שהתעכבה. הוא הוציא את הספר וחזר לקטע שסימן.","״אתה קורא הרצל?״","דוד הרים את הראש.","אחת המורות עמדה בדלת עם כוס תה.","״מסתבר.״","״מרצון?״","״גם אני מופתע.״","היא חייכה.","״מה גילית?״","דוד חשב רגע.","״שהוא חשב גם על מה שקורה אחרי שיש מדינה.״","״אחרי שיש מדינה?״","״כן. אנחנו תמיד מדברים עליו כאילו כל מה שהוא רצה זה שתהיה מדינה.״","״זה היה די הישג.״","״ברור.״","דוד סגר את הספר על האצבע.","״אבל הוא לא עצר שם. הוא ניסה לדמיין מה בונים בתוכה.״","המורה התקרבה.","״נו, ומה בונים?״","״הרבה דברים.״","״תשובה של מורה.״","״כבר לא מורה.״","״זה לא עובר.״","דוד צחק.","הוא פתח את הספר והראה לה את הקטע על היכל השלום.","היא קראה.","״יפה.״","״זה הכול?״","״מה רצית, שאני אקים היכל שלום? יש לי שעה שישית עוד שלוש דקות.״","היא החזירה לו את הספר.","״אבל כן. זה יפה.״","כשהיא כבר פנתה לצאת, נעצרה.","״מצחיק.״","״מה?״","״הוא היה צריך לדמיין מדינה כי לא הייתה לו אחת. אנחנו כבר בתוך המדינה, אז אנחנו עסוקים בעיקר בלריב עליה.״","היא יצאה.","דוד נשאר עם הספר פתוח ביד.","* * *","המשפט הזה ליווה אותו כל היום.","אולי באמת היה להרצל יתרון מוזר.","לא מפני שהמציאות שלו הייתה פשוטה יותר- בוודאי שלא.","אלא מפני שלא הייתה לפניו מערכת קיימת שאמרה לו בכל בוקר:","ככה הדברים עובדים.","זה התקציב.","זו הרגולציה.","אין סמכות.","אין תקן.","צריך ועדה.","צריך מכרז.","אי אפשר.","אנחנו כבר קיבלנו את הדבר שהרצל היה מוכן להקדיש את חייו כדי לראות.","מדינה.","ואולי דווקא משום שהיא קיימת, קל לשכוח שגם אותה אפשר עדיין לדמיין.","דוד ידע שהמחשבה הזאת קצת לא הוגנת.","אנשים דמיינו כל הזמן.","יזמים.","מורים.","ראשי ערים.","אנשי ציבור.","חוקרים.","קהילות.","הוא פגש אותם בעצמו.","אבל השיח הציבורי הגדול הרגיש לו אחרת.","הרבה ממנו עסק במה צריך לעצור.","מה לתקן.","ממה להיזהר.","איזו קבוצה מסכנת איזו קבוצה.","איזו ממשלה צריך להחליף.","איזה חוק צריך להעביר.","אלה היו שאלות אמיתיות.","חשובות.","אבל הן כמעט תמיד התחילו מההווה.","הרצל עשה משהו אחר.","הוא הסתכל קדימה.","* * *","בערב שלח לנתן צילום של הקטע על היכל השלום.","כעבור דקה הופיעו שני סימני וי.","אחרי עוד דקה:","מה אני אמור להבין מזה?","דוד כתב:","תקרא.","נתן:","קראתי. אני יודע לקרוא.","דוד:","הרצל מדמיין בירושלים מוסד שפועל בשביל כל הארצות והעמים.","שלוש הנקודות הופיעו.","נעלמו.","חזרו.","ואתה עכשיו אומר שהרצל תומך בפרויקט שלך?","דוד חייך.","לא.","חבל. כבר כמעט השתכנעתי.","דוד כתב:","אני אומר רק דבר אחד: הבחור ביקש מדינה ולא הפסיק לחשוב ביום שהיא קמה.","הפעם נתן לא ענה מיד.","אחרי כמה דקות הגיעה הודעה:","זה דווקא מעניין.","דוד הסתכל על המסך.","מחמאה מנתן הייתה אירוע נדיר מספיק כדי לשמור צילום מסך.","הוא כתב:","אני חושב שאנחנו מדברים הרבה על איך להציל את המדינה ופחות על מה נעשה איתה אם נצליח.","נתן:","אל תתרגש. אמרתי שזה מעניין, לא שאתה צודק.","דוד:","ברור. לרגע נבהלתי.","* * *","מאוחר יותר באותו לילה דוד חזר למחברת.","הפעם לא ניסה לנסח תוכנית.","רק שאלות.","מה הרצל רצה שהמדינה היהודית תהיה?","למה היכל השלום נמצא דווקא בירושלים?","איך הופכים רעיון למוסד?","האם אפשר לתכנן חברה טובה יותר בלי ליפול לאוטופיה?","ואז כתב:","מהו השלב הבא?","הוא נעצר.","בהתחלה חשב לכתוב שהדור הקודם הסתפק בחזון של הקמת המדינה ושעכשיו צריך חזון חדש.","אבל זה פשוט לא היה נכון.","הדור ההוא לא רק הקים מדינה.","הוא בנה ערים. בתי ספר. אוניברסיטאות. מערכת בריאות. חקלאות. תעשייה. צבא. מוסדות.","הוא לא הסתפק בריבונות.","אז אולי השאלה לא הייתה אם החזון ההוא נגמר.","אולי השאלה הייתה מה ממשיך אותו.","דוד הסתכל שוב על אלטנוילנד הפתוח על השולחן.","עד עכשיו הוא ניסה להבין אם הרעיון שמסתובב לו בראש בכלל אפשרי.","הרצל לא נתן לו תשובה.","וטוב שכך.","אבל הוא כן השאיר לו שאלה:","אם אדם היה מסוגל לדמיין מדינה כשעוד לא הייתה מדינה- למה אנחנו כל כך מתקשים לדמיין מה המדינה הזאת עוד יכולה להיות?"],"chars":6757},{"id":"ch5","title":"פרק 5 -אמרו את זה קודם לפני","parts":["יום העיון נגמר באיחור, כרגיל. הכיסאות כבר החלו להיערם בקצה האולם, המקרן נכבה, ועל אחד השולחנות נשארו כמה עוגיות יבשות וקנקן קפה שכבר מזמן היה צריך לוותר עליו.","דוד אסף את המחברת שלו ואת הספר שהביא איתו.","מתן הבחין בו.","״זה אלטנוילנד?״","דוד הסתכל על הכריכה. ״כן.״","״מה קרה לך?״","״למה?״","״סתם. לא ידעתי שאתה בתקופה ציונית־ספרותית.״","דוד חייך.","הוא הכיר את מתן כבר כמה שנים. לא חבר קרוב, אבל בהחלט אחד מאותם אנשים שקל לדבר איתם.","מתן היה איש של תנ״ך והיסטוריה. לימד שנים, כתב חומרי לימוד, ליווה צוותי חינוך, והיה מסוג האנשים שידעו לקחת מקור עתיק ולדבר עליו בלי להפוך את השיחה לדרשה.","הוא גם היה חשדן מטבעו כלפי אנשים שמצאו בפסוק עתיק תשובה מדויקת לשאלה שעלתה להם בבוקר.","זה היה אחד הדברים שדוד אהב בו.","״אני קורא אותו מחדש,״ אמר דוד.","״למה?״","דוד היסס לרגע.","״אני מסתובב כבר כמה זמן עם איזה רעיון.״","מתן הרים גבה.","״משפט שמתחיל ככה כמעט תמיד עולה כסף.״","״לא, הפעם עוד לא.״","״אז זה באמת בשלב מוקדם.״","דוד צחק.","שניהם יצאו מהאולם. בחוץ כבר התחיל להחשיך. חלק מהמשתתפים עדיין עמדו ליד המכוניות ודיברו.","מתן הצביע על הספר.","״נו, מה גילית אצל הרצל?״","דוד הניח אותו על השולחן הקטן במסדרון.","״שכל השנים חשבתי עליו בעיקר בתור האיש שחלם על מדינה.״","״זו התחלה לא רעה.״","״כן. אבל פתאום קלטתי שהוא לא עצר שם. הוא ניסה לדמיין מה קורה בתוך המדינה. איזה מוסדות. איזה חברה. איזה חיים.״","מתן הנהן.","״ברור.״","״לי זה לא היה ברור.״","״כי לימדו אותנו את הרצל כמו לוגו. זקן, מרפסת, באזל, אם תרצו.״","״בדיוק.״","דוד פתח את הספר במקום שסימן.","״ואז הגעתי להיכל השלום.״","מתן חייך.","״אה.״","״מה אה?״","״עכשיו אני מבין למה אתה מסתובב עם הספר.״","דוד קרא לו את הקטע שסימן- על מקום בירושלים שפועל לא רק למען הארץ היהודית ותושביה, אלא למען ארצות ועמים אחרים; מקום שפונים אליו מלומדים, ממציאים ואמנים, ומקום שעוסק גם בסיוע בעת אסונות.","מתן הקשיב.","״יפה, לא?״ שאל דוד.","״יפה.״","״זה הכול?״","״מה אתה רוצה שאגיד?״","״לא יודע. שזה מדהים.״","״מדהים.״","״אתה עושה לי טובה.״","מתן צחק.","דוד סגר את הספר.","״אני חושב שמה שמעניין אותי הוא לא אם הרצל כבר חשב בדיוק את מה שאני חושב. ברור שלא.״","מתן הרים גבה, כאילו בדק אם דוד באמת מתכוון לזה.","״אבל כן תפס אותי שהוא לא הסתפק בעצם קיומה של המדינה. הוא שאל מה בונים בה, ומה יכול לצאת ממנה.״","מתן הנהן.","״זה כבר ניסוח יותר זהיר.״","״תודה.״","״אל תתרגל.״","דוד חייך.","״אני חושב על זה שאולי מדינה לא צריכה רק להיות חזקה, בטוחה ומשגשגת. אולי היא צריכה עושה גם לעצמך וגם לישעיהו עוול.״","״אני לא חושב שזה מה שאני אומר.״","״יופי.״","״אבל אני כן אומר שכשאני קורא את זה עכשיו, אני רואה משהו שלא ראיתי קודם.״","״זה לגיטימי.״","״אז מה ההבדל?״","מתן חשב לרגע.","״ההבדל הוא בין מקור שמוכיח לך שאתה צודק לבין מקור שנותן לך אופק.״","דוד הסתכל עליו.","״תסביר.״","״אם אתה אומר: ישעיהו כתב בדיוק את התוכנית שאני חושב עליה- בעיניי זה לא רציני. אבל אם אתה אומר: יש פה חזון עתיק מאוד של ירושלים כמקום שאליו עמים רוצים להגיע כדי ללמוד דרך, משפט, משהו על אופן החיים- ואתה שואל מה החזון הזה יכול לומר למדינה יהודית מודרנית- זו כבר שאלה מעניינת.״","דוד לא ענה.","הוא אהב את המילה.","אופק.","לא תוכנית.","לא הוכחה.","אופק.","״אבל יש עוד משהו,״ אמר מתן.","״ידעתי שזה לא נגמר פה.״","״אתה מאוד אוהב עכשיו את החלק של ‘ונהרו אליו כל הגויים’.״","״נכון.״","״ברור. זה החלק הנעים.״","״והחלק הלא נעים?״","מתן לקח ממנו את הטלפון וחיפש.","״ישעיהו מדבר הרבה מאוד על איך נראית החברה עצמה. משפט. צדק. היחס לחלש. שחיתות. מנהיגות.״","הוא הסתכל על דוד.","״אתה לא יכול לקחת את ירושלים שהעולם בא אליה ולדלג על השאלה איזו ירושלים יש פה כשהעולם מגיע.״","דוד נשען לאחור.","זה כבר היה פחות נוח.","״כלומר?״","״כלומר שאם אתה רוצה לקרוא את הנבואה הזאת כאופק, היא לא נותנת לך רק תפקיד כלפי העולם. היא דורשת משהו ממך קודם.״","דוד הביט במחברת.","באים.\nלומדים.\nמשפט.\nשלום.","פתאום התרשים נראה לו פשוט מדי.","״אז בעצם חזרנו לנתן.״","״מי זה נתן?״","״חבר מהמילואים. הפסימיסט הרשמי שלי.״","״כל אדם צריך אחד.״","״הוא אמר לי בערך: לפני שאתה מדמיין מה העולם ילמד פה, אולי תלמד לנהל את המדינה שלך.״","מתן חייך.","״נשמע בחור חכם.״","״אל תגיד לו.״","* * *","כשדוד חזר הביתה, יעל הייתה במטבח.","המחשב שלה היה פתוח על האי, לידו כוס מים, שתי רשימות כתובות ביד והטלפון שלה, שהמשיך להבהב בהודעות גם בשעה שבה דוד כבר היה מזמן מפסיק לענות לאנשים.","״איך היה?״ שאלה בלי להרים את הראש.","״מעניין.״","״זה נשמע מסוכן.״","דוד הניח את התיק.","״למה כולם אומרים לי את זה?״","יעל סגרה את המחשב.","״כי כשאתה אומר ‘מעניין’ בטון הזה, תוך שבוע יש לך פרויקט חדש.״","״אין פרויקט.״","״עוד יותר מסוכן.״","הוא חייך וניגש למטבח.","יעל עבדה בתפקיד ניהולי בחברה גדולה. דוד אף פעם לא הצליח להסביר לאחרים בדיוק מה היא עושה בלי להשתמש ביותר מדי מילים, אבל הוא ידע מה זה אומר בפועל: אנשים, תקציבים, לוחות זמנים, בעיות שלא חיכו שמישהו יקבל עליהן השראה.","היא הייתה מסוגלת לשמוע רעיון של דוד, לאהוב אותו באמת, ואז לשאול בתוך שלושים שניות כמה אנשים צריך כדי להפעיל אותו ומה קורה כשהאדם שהקים אותו יוצא לחופשה.","זה הרגיז אותו לפעמים.","וזה היה אחד הדברים שאהב בה.","״זוכרת שסיפרתי לך על הרצל?״ שאל.","״לא שכחת לתת לי הרבה פרטים.״","״אז היום דיברתי עם מתן.״","״ההיסטוריה־תנ״ך?״","״כן.״","דוד התחיל לספר.","על ישעיהו. על ״והלכו עמים רבים״. על העובדה שהם באים מרצונם. על זה שהשלום מופיע רק אחרי לימוד ומשפט.","יעל הקשיבה. בהתחלה בעמידה, אחר כך התיישבה מולו.","דוד כבר הכיר את עצמו מספיק כדי לדעת שהוא מדבר מהר מדי.","״ואז מתן אומר לי שלא להפוך את זה למסמך מדיניות, ואני מסכים איתו, אבל תחשבי על זה- האנשים שם אומרים ‘לכו ונעלה’. הם רוצים להגיע.״","יעל הנהנה.","״זה יפה.״","״נכון?״","״מאוד.״","דוד חיכה.","הוא ידע שיש המשך.","״אבל?״","״אבל כלום.״","״יעל.״","היא חייכה.","״טוב. יש לי שאלה.״","״ברור שיש.״","״אתה עכשיו מגלה את הרצל, ואז את ישעיהו, ושניהם במקרה נוגעים בדיוק בדבר שאתה כבר מסתובב איתו כמה חודשים?״","דוד שתק.","״מה?״","״אני שואלת באמת.״","״גם מתן אמר משהו דומה.״","״אז מתן בחור חכם.״","״אל תתחילי גם את.״","יעל צחקה.","״אני לא אומרת שאין קשר. אני שואלת משהו אחר.״","״מה?״","היא נשענה קדימה.","״אתה מחפש מקורות לרעיון שכבר החלטת עליו, או שאתה באמת נותן למה שאתה קורא לשנות את הרעיון?״","דוד לא ענה מיד.","יעל הסתכלה עליו.","״אני מכירה אותך. אתה נדלק על משהו, ואז כל חלק בפאזל שאתה מוצא הופך לעוד הוכחה.״","״זה נשמע נורא כשאת אומרת את זה.״","״זה דווקא אחד הדברים שאני אוהבת בך.״","״הנה מגיע העלבון עטוף במחמאה.״","״אתה באמת יודע לחלום. יש לך יכולת לראות משהו לפני שהוא קיים.״","היא עצרה.","״אבל אם אתה רוצה שהרעיון הזה יהיה רציני, אתה צריך גם לתת לו להישבר קצת.״","דוד הביט בה.","״להישבר?״","״כן. אם משהו שאתה קורא לא מסתדר עם מה שאתה חושב- אל תזרוק אותו. תן לו לשנות אותך.״","דוד חייך.","״את ומתן תיאמתם עמדות?״","״לא. אבל אפשר לפתוח קבוצה.״","הוא קם להכין לעצמו משהו לשתות.","״אז מה את חושבת על הרעיון עצמו?״","״איזה מהם? הוא משתנה כל שבוע.״","״בדיוק.״","״אני חושבת שאני עדיין לא מבינה אותו עד הסוף.״","״גם אני לא.״","״יופי. לפחות אנחנו מסכימים על משהו.״","דוד מזג מים.","יעל פתחה שוב את המחשב.","״אבל אני אוהבת את השאלה.״","דוד הסתובב.","״איזו?״","״איזו מדינה אנחנו רוצים להיות.״","היא הרימה כתף.","״אני עובדת כל היום במקום שכל שאלה בו חייבת להפוך ליעד, מדד ותוכנית עבודה. אולי יש ערך גם בזה שמישהו שואל שאלה שאין עליה עדיין אקסל.״","דוד חייך.","״זה אחד הדברים הכי רומנטיים שאמרת לי.״","״אל תתרגל.״","* * *","מאוחר יותר הבית היה שקט.","יעל כבר הלכה לישון.","דוד נשאר בסלון ופתח שוב את הפסוקים.","הפעם בלי מתן.","בלי להסביר אותם למישהו.","בלי לחפש את הרצל בתוכם.","רק לקרוא.","והלכו עמים רבים ואמרו לכו ונעלה.","הוא נעצר.","הם באים.","לא מזמינים אותם.","לא משווקים להם.","לא מוכרים להם ידע.","הם רואים משהו ורוצים להתקרב אליו.","ויורנו מדרכיו ונלכה באורחותיו.","לא רק ידע.","דרך.","כי מציון תצא תורה.","דוד לא היה בטוח בכלל איך לתרגם את המילה הזאת לעולם שעליו חשב.","חכמה?","דרך חיים?","משפט?","לימוד?","אולי אין טעם לתרגם אותה מהר מדי.","הוא המשיך.","ושפט בין הגויים והוכיח לעמים רבים.","ואז:","וכתתו חרבותם לאתים.","דוד פתח את המחברת.","התרשים מהצהריים עדיין היה שם.","הוא לא הוסיף לו חצים.","במקום זה עבר לעמוד חדש וכתב:","לא להזמין.\nלא להטיף.\nלא לשאוף להיות המורים.","ומתחת:","לבנות מקום ששווה לבוא אליו.","הוא הסתכל על המשפט.","משהו בו עדיין הפריע לו.","מקום?","האם זו ירושלים?","המדינה?","מוסד?","רעיון?","הוא עדיין לא ידע.","ואז נזכר במתן.","במשפט.","בצדק.","בדרישה כלפי החברה עצמה.","ונזכר ביעל:","אם כל דבר רק מוכיח לך שאתה צודק, אתה לא לומד.","דוד הוסיף שורה אחרונה:","ולהיות ראויים לזה.","הוא הניח את העט.","זה כבר היה פחות נעים.","וזה בדיוק מה שגרם לו לחשוב שאולי יש בזה משהו.","בהתחלה הרעיון נשמע לו כמו שאיפה כלפי העולם.","עכשיו הוא התחיל להבין שאולי הוא קודם כול דרישה כלפי עצמנו.","אם יום אחד אנשים באמת ירצו לבוא לכאן כדי ללמוד משהו- לא בגלל קמפיין, לא בגלל כוח, ולא בגלל שאנחנו הכרזנו שיש לנו מה ללמד-","איזו מדינה נצ ך הכול, היה החיים שלנו.״","״נכון.״","דוד עצר.","הוא לא רצה להפוך את הערב הזה לעוד נאום.","״אבל אם משהו כזה קורה לנו, אם אנחנו עוברים דבר כזה- קשה לי לקבל שהמטרה היחידה היא פשוט לחזור לאותה נקודה.״","נתן נשען לאחור.","״פה אני נזהר איתך.״","״למה?״","״כי אתה לא יודע בשביל מה הם מתו.״","דוד השתתק.","נתן המשיך.","״ואני גם לא. כל אחד מהם היה בן אדם אחר. אחד רצה לחזור הביתה לילדים. אחד בכלל שנא פוליטיקה. אחד חלם לעזוב עבודה ולפתוח מסעדה. אני לא אוהב שאנחנו לוקחים אנשים שמתו ומעמיסים עליהם את החזונות שלנו.״","דוד הנהן.","״אתה צודק.״","נתן נראה מופתע.","״זהו?״","״כן. אני לא רוצה לדבר בשמם.״","״יפה.״","דוד שתק לרגע.","״אבל זה לא אומר שהמוות שלהם לא שואל ממני משהו.״","נתן לא ענה.","״הם לא ציוו עליי איזו מדינה לבנות. הם לא השאירו תוכנית. אבל כשאתה רואה אנשים נותנים כל כך הרבה כדי שהחיים פה יימשכו- זה גורם לך לשאול מה אתה עושה עם החיים שנשארו לך.״","אורי הנהן.","דוד הסתכל שוב על המדבקה בטלפון.","״אולי זה מה שהמשפט הזה עושה לי. לא אומר לי מה לחשוב. רק לא נותן לי לקחת את החיים כמובן מאליו.״","נתן לקח שלוק.","״אולי פשוט צריך לחיות.״","״מה זה פשוט לחיות?״","״להיות עם הילדים. לעבוד. לצחוק. לנסוע לחו״ל. לשתות קפה. לא כל דבר צריך להיות משימה היסטורית.״","דוד חייך.","״אני מסכים.״","״באמת?״","״כן. חיים רגילים זה לא דבר קטן.״","נתן הנהן, כמעט מרוצה.","דוד המשיך.","״אבל גם לחיים רגילים יש כיוון.״","נתן נשף.","״הנה הגענו.״","״תקשיב רגע. אני לא אומר שכל אחד צריך לקום בבוקר ולהגשים את חזון הנביאים.״","״תודה. כבר פחדתי.״","״אני אומר משהו הרבה יותר פשוט. ברמה של חברה. של מדינה.״","דוד הצביע ביד לעבר הרחוב.","״אנחנו נלחמים כל כך קשה כדי שהמקום הזה יתקיים. ברור למה- בית, ביטחון, משפחה, העם שלנו. הכול נכון. אבל אחרי ששומרים עליו, עדיין נשארת שאלה: איזה מקום אנחנו רוצים שיהיה פה?״","נתן הביט בו.","״אני חושב שאתה כל הזמן מחפש משמעות במקום שבו אנשים אחרים פשוט רוצים לחיות בשקט.״","״יכול להיות.״","״וזה בסדר. אבל אל תהפוך את הצורך שלך במשמעות לחובה לאומית.״","המשפט פגע.","דוד לא מיהר לענות.","אורי הסתכל בין שניהם.","״אפשר להגיד משהו בלי ששניכם תהפכו אותו לתזה?״","״לא,״ אמר נתן.","״דבר,״ אמר דוד.","אורי חשב רגע.","״אני לא צריך מדינה מושלמת.״","אף אחד לא אמר כלום.","״באמת. אני לא מצפה שכולם יאהבו אחד את השני. אני לא מצפה שלא יהיו פוליטיקאים מטומטמים. ולא נראה לי שיום אחד נקום בבוקר וכל הבעיות ייפתרו.״","נתן הנהן.","״סוף סוף קול שפוי.״","אורי הסתכל עליו.","״אבל כן הייתי רוצה להרגיש שאנחנו הולכים לאנשהו.״","נתן הפסיק לחייך.","אורי המשיך.","״לא יודע להסביר. שכל מה שעברנו לא נגמר בזה שחזרנו לאותו מקום. שיש איזה כיוון. שאנחנו מנסים להיות משהו.״","דוד הסתכל עליו.","זה היה מדויק יותר מכל הניסוחים הגדולים שהסתובב איתם בחודשים האחרונים.","לא יעד.","לא תוכנית.","כיוון.","שאנחנו הולכים לאנשהו.","* * *","השיחה המשיכה עוד זמן.","הם לא הגיעו למסקנה.","נתן התעקש שחיים רגילים אינם דבר קטן.","דוד הסכים.","נתן טען שחזונות גדולים הופכים מסוכנים כשהם נעשים חשובים יותר מבני האדם עצמם.","גם עם זה דוד הסכים.","אורי טען ששניהם מסוגלים להסכים כמעט על הכול ועדיין לריב עליו.","גם בזה הייתה הסכמה.","אבל דבר אחד נשאר.","השאלה.","איזה חיים?","לא בשם מי שנהרגו.","לא כאילו השאירו אחריהם הוראות.","אלא כשאלה למי שנשאר.","* * *","כשהם קמו ללכת, אורי נפרד ראשון.","נתן ודוד הלכו יחד לכיוון החניה.","״אני עדיין חושב שאתה נסחף,״ אמר נתן.","״ברור.״","״באמת. אתה מחפש למדינה ייעוד. זה עסק מסוכן.״","״יכול להיות.״","״מדינה היא כלי. היא צריכה להגן על האזרחים שלה ולתת להם לחיות.״","״זה הכול?״","״זה הרבה.״","דוד הנהן.","״נכון. זה הרבה.״","הם הגיעו לרכב של נתן.","נתן פתח את הדלת.","״אבל?״","דוד חייך.","״אבל אני לא מצליח להשתחרר מהמחשבה שזה לא הכול.״","נתן הניד בראש.","״לילה טוב, הרצל.״","דוד צחק.","״לילה טוב, נתן.״","* * *","בדרך הביתה דוד לא שם מוזיקה.","הכביש היה כמעט ריק.","הוא חשב על הערב.","על התמונות שעל המסך.","על הפצועים שעלו לבמה.","על השמות.","והוא נזכר במשפט של נתן:","אתה לא יודע בשביל מה הם מתו.","נכון.","והיה חשוב לשמור על זה.","אף אדם לא צריך להפוך את המתים לדוברים של הרעיונות שלו.","דוד לא ידע איזו מדינה כל אחד מהם היה רוצה.","הוא לא ידע איך היו מצביעים, על מה היו מתווכחים, איזה חזון היה מדבר אליהם.","הוא ידע רק שהם רצו לחיות.","ושהם רצו שאחרים יחיו.","אולי זה מספיק.","אבל אז חזר אליו המשפט של אורי:","הייתי רוצה להרגיש שאנחנו הולכים לאנשהו.","דוד אחז בהגה.","אולי זאת הייתה השאלה שהוא חיפש.","לא אם קיימת למדינה שליחות סודית שנכתבה מראש.","לא אם אפשר למצוא תשובה אחת אצל ישעיהו, הרצל או מישהו אחר.","אלא האם האנשים שחיים כאן עכשיו מוכנים לבחור כיוון.","לאן אנחנו רוצים ללכת?","איזו חברה אנחנו רוצים לבנות?","איזה מקום אנחנו רוצים להשאיר לילדים?","ומה פירוש לחיות חיים ראויים במקום שכל כך הרבה אנשים נלחמו כדי שנוכל להמשיך לחיות בו?","דוד לא ידע.","אבל בפעם הראשונה השאלה הזאת לא נשמעה לו כמו פילוסופיה.","היא נשמעה אישית."],"chars":8582},{"id":"ch8","title":"פרק 8 -מה קורה פה?","parts":["ההודעה ממתן הגיעה ביום שלישי בבוקר.","יש לי משהו בשבילך.","דוד היה באמצע פגישה. הוא הציץ במסך והמשיך להקשיב למנהלת שישבה מולו.","כעבור דקה הגיעה הודעה נוספת.","ולא, זה לא פסוק.","דוד חייך וכתב מתחת לשולחן:","אז אני פחות מתרגש.","מתן:","תחכה.","אחרי הפגישה דוד חזר אליו.","״נו?״","״זוכר את כל הדיבורים שלך על איך הופכים ניסיון של אנשים לחכמה של מערכת?״","״כן.״","״אני רוצה שתיסע לראות בית ספר.״","דוד נשען לאחור.","״זה פחות דרמטי ממה שציפיתי.״","״בדיוק בגלל זה.״","״מה יש שם?״","״לפני שנתיים הייתה להם בעיה רצינית של נשירה סמויה. ילדים מגיעים לבית ספר אבל בפועל כבר לא באמת נמצאים בו. אחרי הפינוי זה החמיר.״","״מכיר.״","״במקום לקנות עוד תוכנית מבחוץ, הם לקחו צוות של מורים, יועצת, שני תלמידים וכמה הורים ובנו משהו משלהם.״","״מה?״","״תיסע ותראה.״","״אתה לא יכול פשוט לספר לי?״","״יכול. אבל אז תחזור לעשות מזה תרשים.״","דוד צחק.","״יפה שאתה לומד אותי.״","״אני איש חינוך.״","* * *","בית הספר היה קטן מכפי שדוד דמיין.","שני מבנים ישנים, חצר גדולה מדי ומגרש כדורסל שהקווים עליו כמעט נמחקו.","המנהל קיבל אותו ליד השער.","״מתן אמר שאתה בא לחפש אצלנו את עתיד מדינת ישראל.״","דוד נעצר.","״הוא אמר את זה?״","״לא. אבל הוא אמר שאתה בתקופה.״","דוד חייך.","״אני מתחיל להצטער שיש לי חברים.״","״בוא.״","הם נכנסו פנימה.","לא היה במקום שום דבר שנראה כמו חדשנות.","לא מסכים גדולים.","לא מעבדות.","לא שלטים עם מילים באנגלית.","על אחד הקירות היה לוח פשוט, ועליו עשרות שמות תלמידים מסודרים לפי צבעים.","דוד הסתכל.","״מה זה?״","״זה התחיל מזה.״","המנהל ניגש ללוח.","״לפני שנתיים הבנו שאנחנו מודדים את הדברים הלא נכונים.״","״מה זאת אומרת?״","״נוכחות, ציונים, אירועי משמעת. כל מה שמערכת יודעת למדוד. אבל היו לנו ילדים שהגיעו כל יום ובפועל נעלמו לנו מול העיניים.״","הוא הצביע על אחד השמות.","״ילד כזה יכול לשבת בכיתה חצי שנה ואף אחד לא יגיד עליו ‘נושר’. אבל הוא כבר לא מאמין שיש לו פה מקום.״","״אז מה עשיתם?״","״בהתחלה? ישבנו.״","״זה הפתרון?״","״הלוואי.״","המנהל חייך.","״אספנו עשרה ילדים. שאלנו אותם מה גורם להם להישאר ומה גורם להם לרצות ללכת.״","״ומה הם אמרו?״","״דברים שאנחנו כמבוגרים היינו יכולים לדבר עליהם שנה ולא לגלות.״","הם המשיכו במסדרון.","המנהל סיפר איך הצוות בנה שיטה שבה כל תלמיד שהתחיל להיעלם קיבל אדם אחד שמכיר אותו באמת.","לא עוד ״אחריות של הצוות״.","שם.","אדם.","מישהו ששם לב.","במקביל הם התחילו לחפש סימנים מוקדמים- לא רק ציונים, אלא שינוי בהתנהגות, היעדרויות קטנות, ניתוק חברתי, מורה שמרגיש שמשהו השתנה.","״בהתחלה עשינו הכול באקסל,״ אמר המנהל.","דוד חייך.","״יעל הייתה אוהבת אותך.״","״מי זאת יעל?״","״אשתי. עזוב.״","אחרי כמה חודשים הם התחילו לבדוק מה עובד.","חלק מהדברים שהיו בטוחים שיעזרו לא עזרו.","חונכות מסוימת נכשלה.","מפגשים קבוצתיים דווקא הצליחו.","חלק מהתלמידים לא רצו עוד מבוגר שידבר איתם, אבל כן הסכימו לעבוד עם תלמיד בוגר יותר.","הם שינו.","בדקו.","שינו שוב.","״כמה זמן לקח לכם לבנות את זה?״ שאל דוד.","המנהל צחק.","״לבנות? עוד לא בנינו.״","״אבל אתם מפעילים את זה שנתיים.״","״בדיוק. אנחנו עדיין משנים.״","דוד הסתכל עליו.","המשפט מצא חן בעיניו.","* * *","בחדר המורים חיכתה להם היועצת.","על השולחן היו קלסרים.","הרבה פחות רומנטי מהלוח במסדרון.","דוד שאל:","״מי הביא לכם את המודל?״","היועצת והמנהל הסתכלו זה על זה.","״אף אחד,״ אמרה.","״כלומר המצאתם הכול?״","״גם לא.״","דוד חייך.","״אז?״","״לקחנו מכל מיני מקומות.״","היא פתחה אחד הקלסרים.","״משהו מתוכנית שהייתה פה לפני שנים. משהו שמנהלת אחרת סיפרה לנו. קראנו מחקר מחו״ל. אחד המורים הביא רעיון מהצבא. התלמידים שינו חצי ממנו.״","המנהל הוסיף:","״הטעות הכי גדולה תהיה להגיד שהמצאנו מודל ישראלי חדש.״","דוד הרגיש כאילו מישהו קרא את המחשבות שלו.","״למה?״","״כי לא המצאנו. למדנו.״","הוא הצביע לעבר החצר.","״היינו צריכים לפתור בעיה אמיתית. חיפשנו מה אחרים יודעים, ניסינו אצלנו, זרקנו מה שלא עבד ושמרנו מה שכן.״","דוד שתק.","לא המצאנו. למדנו.","הוא כתב את המשפט.","״מי עוד משתמש בזה היום?״","״שישה בתי ספר באזור.״","״איך זה הגיע אליהם?״","המנהל משך בכתפיו.","״שמועה.״","״שמועה?״","״מנהלת אחת ראתה. סיפרה למנהלת אחרת. אחר כך ביקשו שנציג את זה ביום מחוזי.״","״משרד החינוך לקח את זה?״","היועצת חייכה.","״הם מאוד התעניינו.״","דוד כבר הכיר את הניסוח.","״מה זה אומר?״","״שהם מאוד התעניינו.״","שלושתם צחקו.","* * *","בדרך חזרה דוד התקשר למתן.","״טוב.״","״טוב מה?״","״זה מעניין.״","״ידעתי.״","״אבל לא בגלל מה שאתה חושב.״","״מה אני חושב?״","״שמצאתי משהו ישראלי גאוני.״","״ממש לא.״","״הם בעצמם אומרים שחצי מהרעיונות הגיעו ממקומות אחרים.״","״יפה.״","״הם לא ניסו להיות חדשניים. הם ניסו לפתור בעיה.״","״כן.״","״והם למדו מכל מי שיכלו.״","״כן.״","״ואז התאימו את זה למציאות שלהם.״","״כן.״","דוד חייך.","״אתה עושה לי בכוונה את ה‘כן’ הזה?״","״כן.״","דוד צחק.","״אבל יש שם משהו.״","״מה?״","דוד חשב רגע.","״הם לא התחילו מהשאלה ‘מה המודל שלנו’. הם התחילו מהשאלה ‘מה הבעיה’.״","מתן שתק רגע.","״זה כבר מעניין.״","* * *","בערב דוד סיפר ליעל.","היא חתכה ירקות ליד השיש בזמן שהוא דיבר.","״אז מה המסקנה?״ שאלה.","״אין מסקנה.״","יעל הסתכלה עליו.","״יפה. אתה מתקדם.״","״יש משהו אחר.״","״מה?״","״אני חושב שאני כל הזמן מחפש משהו גדול מדי. מוסדות, מדינה, ירושלים, העולם. ובסוף אני מגיע לבית ספר קטן והם עושים משהו הרבה יותר פשוט.״","״מה?״","״לומדים.״","יעל המשיכה לחתוך.","״זה נשמע מהפכני מאוד.״","״אני רציני. לא אומרים ‘יש לנו שיטה’. לוקחים בעיה, בודקים מה אחרים עשו, מנסים, משנים.״","״זה מה שאמורים לעשות בכל ארגון נורמלי.״","דוד הסתכל עליה.","״נכון.״","״אז למה אתה נשמע מופתע?״","הוא שתק.","יעל חייכה.","״זאת שאלה בשבילך, לא בשבילי.״","דוד התיישב.","״אולי כי זה לא קורה מספיק.״","״או כי כשזה כן קורה, אתה לא שומע על זה.״","היא העבירה את הירקות לקערה.","״אגב, זה מזכיר לי משהו.״","״מה?״","״יש חברה שאנחנו עובדים איתה.״","״באיזה תחום?״","״חקלאות. בערך.״","דוד הרים גבה.","״‘בערך חקלאות’ זה תחום?״","״הם בונים מערכת לניהול מים ודישון לחוות. חיישנים, נתונים, כל הסיפור שאתה תעמיד פנים שאתה מבין.״","״אני מבין חיישנים.״","״ברור.״","״ומה איתם?״","״המנכ״לית סיפרה לי לפני כמה חודשים שהעבודה שלהם באפריקה שינתה לגמרי את המוצר.״","דוד התיישר.","״איך?״","״לא יודעת בדיוק. משהו עם גידולים אחרים, אינטרנט לא יציב, חקלאים קטנים. היא אמרה שהם הגיעו עם מערכת שהם היו בטוחים שהיא מעולה וגילו שחצי ממנה לא רלוונטית.״","״אפשר לדבר איתה?״","יעל הסתכלה עליו.","״ידעתי.״","״מה?״","״כל פעם שאני מספרת לך משהו, אתה הופך אותו לפגישה.״","״אז אפשר?״","״אני אשאל.״","* * *","הפגישה עם ד״ר אלון רז נולדה דווקא מהביקור בבית הספר.","דוד יצא משם עם תחושה שהוא רוצה לבדוק אם אותו דפוס קיים גם במקום שאין לו שום קשר לחינוך.","הוא נזכר באלון.","הם נפגשו פעם בכנס שעסק בקבלת החלטות תחת לחץ. אלון היה מנתח בכיר בבית חולים גדול במרכז הארץ, איש מסוג האנשים שדוד תמיד הרגיש לידם שהוא צריך להפסיק להתלונן על עומס.","הוא שלח לו הודעה.","יש לך חצי שעה לקפה? אני רוצה לשמוע על משהו שאתם עושים בבית החולים.","אלון ענה:","חצי שעה אין. 18 דקות כן.","דוד:","מתאים.","* * *","בית החולים היה עמוס.","דוד חיכה ליד הקפטריה כשאלון הגיע בחלוק ירוק, הטלפון בידו.","״יש לנו שבע־עשרה דקות,״ אמר.","״ירדה דקה בדרך?״","״מעלית.״","הם לקחו קפה.","״מה אתה רוצה לדעת?״","״אני מחפש מקומות שבהם למדו לפתור בעיה טוב.״","אלון הסתכל עליו.","״זו הגדרה מאוד רחבה לבית חולים.״","״אמרו לי שאתם עובדים על טכנולוגיה חדשה בניתוחים.״","אלון הנהן.","הוא הסביר שבשלב מסוים של ניתוח מורכב המנתח נדרש לקבל החלטה על בסיס מידע חלקי. ניסיון היה קריטי- מנתח שעשה מאות ניתוחים ראה דברים שמנתח צעיר עדיין לא למד לראות.","הצוות של אלון עבד עם מהנדסים וחוקרים על מערכת שמנתחת בזמן אמת מידע שמגיע במהלך הניתוח, משווה אותו למקרים קודמים ומתריעה כשהיא מזהה דפוס מסוכן.","״כלומר בינה מלאכותית?״ שאל דוד.","אלון עשה פרצוף.","״אם אתה רוצה כותרת לעיתון, כן.״","״ואם אני רוצה להבין?״","״אז זו מערכת שעוזרת למנתח לראות משהו שעין אנושית יכולה לפספס. היא לא מחליטה במקום הרופא.״","״וזה עובד?״","אלון עצר.","״זו בדיוק השאלה שאנחנו מנסים לענות עליה.״","דוד חייך.","״ציפיתי שתשווק לי את זה יותר טוב.״","״אני רופא, לא משקיע.״","אלון סיפר על ניסויים.","על טעויות.","על גרסה ראשונה שהייתה רגישה מדי והתריעה כמעט על כל דבר.","על מנתחים שהתעצבנו והפסיקו להסתכל.","על מהנדסים שהיו בטוחים שהבעיה היא אצל הרופאים, ורופאים שהיו בטוחים שהבעיה היא אצל המהנדסים.","״ומה עשיתם?״","״שמנו אותם באותו חדר.״","״זה הכול?״","״זה לקח שנה.״","דוד צחק.","אלון המשיך.","״הפריצה לא הייתה באלגוריתם. היא הייתה ברגע שהמהנדסים התחילו להבין איך מנתח חושב, והמנתחים התחילו להבין מה המערכת באמת יודעת לראות.״","דוד חשב על בית הספר.","לא פתרון אחד.","מפגש.","התאמה.","למידה בין אנשים שרואים אותה בעיה אחרת.","״משתמשים בזה גם בחו״ל?״ שאל.","״עדיין בניסויים בכמה מרכזים.״","״אתם עובדים עם צוותים אחרים?״","״כל הזמן.״","אלון הביט בו.","״ואם זה מה שאתה מחפש- אנחנו לא פיתחנו את זה לבד. יש צוותים בארצות הברית, גרמניה, דרום קוריאה שעושים דברים דומים. אנחנו לומדים מהם כל הזמן.״","״אבל יש לכם משהו ייחודי.״","״יכול להיות.״","״אז?״","אלון הסתכל בשעון.","״הדבר המעניין במדע הוא שאם משהו באמת עובד, לא אכפת לי מאיזה דגל הוא הגיע.״","דוד שתק.","״אם רופא בקנדה ימצא מחר דרך טובה יותר, אני רוצה ללמוד ממנו. אם אנחנו נמצא משהו טוב יותר, אני רוצה שהוא ילמד מאיתנו. המטופל לא מתעניין בכבוד הלאומי שלנו.״","הטלפון של אלון רטט.","הוא קם.","״נגמרו לך שבע־עשרה הדקות.״","דוד נשאר לשבת.","״אלון.״","הרופא הסתובב.","״כן?״","״זה בדיוק מה שרציתי לשמוע.״","אלון חייך.","״אז בפעם הבאה תחסוך לי את הקפה.״","דוד כתב בטלפון:","אם משהו באמת עובד, לא אכפת מאיזה דגל הוא הגיע.","* * *","יעל חיברה אותו לנועה לביא שבוע לאחר מכן.","״תעשה לי טובה,״ אמרה לפני הפגישה.","״מה?״","״אל תגיד לה שהיא חלק ממסע רוחני לאומי. היא לקוחה.״","״אני יודע לדבר עם אנשים.״","״זה בדיוק מה שמדאיג אותי.״","נועה הייתה מנכ״לית של חברה ישראלית שפיתחה מערכת לניהול השקיה ודישון.","הם נפגשו במשרד שלה באזור התעשייה.","על הקיר הייתה מפה גדולה של העולם עם נקודות קטנות באפריקה, אירופה ודרום אמריקה.","דוד הצביע.","״אלה לקוחות?״","״חלק. חלק פיילוטים. חלק שותפים.״","״יעל סיפרה שהעבודה באפריקה שינתה לכם את המוצר.״","נועה צחקה.","״שינתה? כמעט זרקנו אותו לפח.״","״למה?״","״כי עשינו טעות מאוד ם ניסו לפתור בעיה אמיתית, והיו מוכנים לשנות את מה שחשבו כשהמציאות התנגדה.","דוד השאיר את הכותרת מחוקה.","הוא חזר לשאלה שכתב כמה שבועות קודם:","בשביל מה המרכז היהודי הזה קיים?","אולי הוא עדיין לא היה קרוב לתשובה.","אבל משהו אחר התחיל להתבהר.","לא להיות המקום שיודע.","אולי להיות מקום שיודע ללמוד.","דוד כמעט כתב את המשפט.","ועצר שוב.","בית ספר אחד אינו מערכת חינוך.","צוות רפואי אחד אינו מערכת בריאות.","חברה אחת אינה חקלאות ישראלית.","שלושה סיפורים אינם מדינה.","יכול להיות שהוא שוב רואה את מה שהוא רוצה לראות.","הוא חייך.","מתן היה גאה בו.","בסוף כתב רק שאלה:","אם הדברים האלה כבר קורים במקומות שונים- מה היה קורה אילו היינו יודעים לחבר ביניהם?","הוא הניח את העט.","הפעם הרעיון היה קטן יותר.","אבל הרבה פחות מופשט.","כבר היו לו פנים."],"chars":11767},{"id":"ch9","title":"פרק 9 -הו אה מי זה בא","parts":["דוד לא תכנן את השבוע הזה.","הוא התחיל אותו עם שתי פגישות עבודה רגילות, ביקור בבית ספר וישיבת צוות.","ביום שלישי כבר היו לו שלוש שיחות עם אנשים מחו״ל, פגישה עם בכיר לשעבר בממשלה, ותחושה שהרעיון שלו שוב משנה צורה לפני שהספיק להבין את הגרסה הקודמת.","הכול התחיל ממתן.","כמובן.","ההודעה הגיעה בשעת ערב.","יש פה מישהו שאתה צריך לדבר איתו.","דוד כתב:","עוד נביא?","מתן:","גרמני. כמעט אותו דבר.","דוד חייך.","מי?","יוהנס קליין. מנהל תוכנית חינוכית בברלין. היה בארץ לפני כמה חודשים עם משלחת. שאל אותי היום על משהו שראה פה.","מה הוא ראה?","תשאל אותו.","דוד כבר הכיר את השיטה.","* * *","יוהנס עלה לשיחת הווידאו בדיוק בזמן.","החדר שלו היה מסודר מדי- מדפים, תיקיות, כוס קפה בצד ימין של המחשב.","דוד חשב שאפשר לזהות אירופאי גם דרך זום.","״מתן סיפר לי שאתה עובד עם בתי ספר,״ אמר יוהנס באנגלית.","״כן. בערך.״","״‘בערך’ זו הגדרה מקצועית בישראל?״","דוד צחק.","״בהחלט.״","אחרי כמה דקות של היכרות דוד שאל:","״מתן אמר שביקרת כאן בגלל תוכנית חינוכית.״","יוהנס הנהן.","״כן. הגענו לראות כמה דברים.״","״מה עניין אתכם?״","יוהנס חשב.","״לא מערכת החינוך הישראלית.״","דוד חייך.","״טוב שהבהרת.״","״אני רציני. אני לא חושב שיש דבר כזה מערכת חינוך שאפשר להעתיק. רצינו להבין איך כמה בתי ספר כאן הצליחו להחזיר תלמידים למסגרות אח
