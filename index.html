מצולם.","שולחן אחד.","כמה בקבוקי מים.","קפה.","עוגיות.","לוח לבן.","עמית פתח.","״אני רוצה להתחיל מזה שאין לנו הצעה.״","גדי, ראש עיר לשעבר, חייך.","״כבר שיפור ביחס לרוב הפגישות שהייתי בהן.״","צחוק קטן עבר בחדר.","עמית הצביע לעבר דוד.","״בחודשים האחרונים דוד מסתובב בין אנשים ומערכות. הוא התחיל מחינוך, הגיע לבריאות, חקלאות ושיתופי פעולה עם גורמים מחו״ל. הוא שם לב שיש הרבה ידע, הרבה ניסיון והרבה יוזמות- אבל לא תמיד ברור איך הם עוברים ממקום למקום. הוא ביקש לבדוק אם זו באמת בעיה או רק תחושה שלו.״","רונית, לשעבר מנכ״לית משרד ממשלתי, נשענה לאחור.","״אני יכולה כבר להזהיר מפני המסקנה המתבקשת.״","דוד חייך.","״איזו?״","״שצריך להקים גוף חדש.״","״לא הגעתי לשם.״","״יופי. אל תגיע מהר.״","היא המשיכה:","״יש בישראל המון חיבורים. משרדי ממשלה עובדים עם רשויות. אוניברסיטאות עם בתי חולים. חברות עם הממשלה. עמותות עם כולם. כל פעם שמישהו מרגיש שהמערכת לא מחוברת, הוא מציע להקים עוד מערכת שתנהל את החיבורים. ואז תוך כמה שנים יש עוד גוף שצריך לחבר לאחרים.״","גדי הנהן.","״ועד אז כבר כולם שכחו למה הקימו אותו.״","דוד כתב במחברת:","לא עוד גוף.","גדי נשען קדימה.","״אבל כן יש בעיה. הייתי ראש עיר עשר שנים. היו דברים שעשינו ממש טוב. הגיעו אלינו משלחות מהארץ ומחו״ל. ראו, שאלו, לקחו רעיונות. שנתיים אחר כך אף אחד כבר לא ידע מי הגיע ומה יצא מזה.״","״מי היה אמור לדעת?״ שאל פרופסור אמיר לביא.","גדי משך בכתפיים.","״לא יודע. זו בדיוק הנקודה.״","עידו, רופא שהיה מעורב בניהול מערכות חירום, אמר:","״בבריאות אני רואה אותו דבר. בית חולים אחד בונה תהליך מצוין. בית חולים אחר יכול להתמודד עם אותה בעיה ולא לדעת שהפתרון כבר נמצא.״","״למה?״ שאל דוד.","עידו הסתכל עליו.","״כי אנשים עובדים. אין להם זמן לעצור ולהפוך את הניסיון שלהם לידע של מערכת.״","אמיר נשען קדימה.","״אני חושב שאנחנו משתמשים במילה הלא נכונה.״","״איזו?״ שאל עמית.","״חיבור.״","״ומה המילה הנכונה?״","אמיר חשב רגע.","״זיכרון.״","דוד הרים את הראש.","המילה הזאת שוב.","המנהלת מהישיבה בחינוך.","המערכת לא יודעת לזכור.","אמיר המשיך.","״מדינה יכולה להיות מלאה באנשים חכמים ובכל זאת להיות בעלת זיכרון חלש. אדם מסיים תפקיד- הרבה ידע הולך איתו. תוכנית נסגרת- חלק מהניסיון נעלם. הנהלה מתחלפת- וכולם מתחילים שוב.״","דפנה, שניהלה במשך שנים תוכניות חברתיות בשותפות עם הממשלה, הוסיפה:","״ויש גם בעיה של שפה.״","״מה זאת אומרת?״ שאל דוד.","״אקדמיה מייצרת ידע בשפה אחת. ממשלה בשפה אחרת. שטח בשלישית. ראש עיר רוצה לדעת מה אפשר לעשות מחר בבוקר. חוקר רוצה לדעת אם יש מובהקות. מנהל בית ספר רוצה לדעת כמה שעות זה דורש.״","דוד הנהן.","״כלומר לא מספיק שהידע קיים. מישהו צריך להפוך אותו לשימושי למי שנמצא במקום אחר.״","״בדיוק.״","דוד כתב ליד המילה זיכרון:","תרגום.","* * *","ככל שהשיחה התקדמה, דוד הבין שהמילה ״חיבור״ הסתירה הרבה מאוד דברים.","זיכרון.","שפה.","זמן.","תמריצים.","אגו ארגוני.","תקציבים.","קרדיט.","תחרות.","ובעיקר את ההבדל בין אדם שיודע לבין מערכת שיודעת.","אבל בתוך השיחה התחיל לעלות גם משהו אחר.","לא בעיה.","תכונה.","גדי סיפר איך בתקופה קשה בעיר שלו הם בנו פתרון בתוך ימים.","עידו תיאר איך בבית החולים שינו תהליך שלם בתוך לילה בזמן חירום.","דפנה סיפרה על קהילה שהקימה מערך סיוע עוד לפני שהמדינה הצליחה להבין מי אחראי על מה.","רונית חייכה.","״אנחנו מצוינים כשאין זמן.״","״זו מחמאה?״ שאל דוד.","״גם וגם.״","עידו הנהן.","״כשאין ברירה, אנשים פה מסוגלים לעשות דברים מדהימים. הם לוקחים אחריות גם כשלא כתוב להם שזה התפקיד שלהם.״","גדי הוסיף:","״עד שהם פוגשים את היועץ המשפטי.״","החדר צחק.","אבל דוד נשאר עם המשפט הראשון.","כשאין ברירה.","הוא שמע אותו כבר קודם.","בתעשיות הביטחוניות.","בבית הספר.","בחקלאות.","בחירום.","״אולי יש כאן עוד שאלה,״ אמר דוד.","החדר הסתכל עליו.","״איזו?״ שאל עמית.","״למה אנחנו כל כך טובים בזה דווקא כשאין ברירה?״","״במה?״","״לאלתר. לקחת אחריות. לנסות לפני שהכול מסודר.״","רונית חייכה.","״לפעמים יותר מדי לפני שהכול מסודר.״","״נכון.״","אמיר חשב רגע.","״רק תיזהר לא להפוך את זה לתכונה גנטית של העם היהודי.״","דוד צחק.","״מתן כבר אימן אותי.״","״אבל כן אפשר לשאול אם התנאים ההיסטוריים שלנו חיזקו תכונות מסוימות.״","״כמו?״","״חוסר ודאות. הסתגלות. הצורך להתחיל מחדש. קהילות שחיו הרבה שנים בלי כוח מדינתי.״","גדי הוסיף:","״והאמונה שאם נחכה שמישהו יפתור לנו את הבעיה, נמות קודם.״","החדר השתתק לרגע.","דוד חייך.","״קצת קיצוני.״","״אבל אתה מבין למה אני מתכוון.״","דוד הבין.","ועל אף שניסה להיזהר, התחילו לעלות בו תמונות.","רבן יוחנן בן זכאי שמבקש את יבנה וחכמיה כשירושלים נחרבת.","הרצל שמארגן קונגרס למדינה שאינה קיימת.","חלוצים שבונים במקום שאין בו כמעט דבר.","עולים שמתחילים מחדש.","יזמים שמקימים חברה סביב משהו שאף אחד לא יודע אם יעבוד.","חיילים שמוצאים פתרון בשטח כי אי אפשר לחכות.","הוא ידע כמה קל להפוך את כל הדברים האלה לסיפור אחד יפה מדי.","מתן היה שונא את זה.","אבל משהו בכל זאת חזר.","לא אותה תקופה.","לא אותה אמונה.","לא אותה מטרה.","אלא נכונות להתחיל לפעול לפני שיש ודאות מלאה.","דוד כתב:","היכולת לפעול לפני שיודעים.","חשב רגע והוסיף:","לא כי אנחנו בטוחים שנצליח- אלא כי לפעמים אין לנו אפשרות לא לנסות.","הוא הסתכל על המשפט.","לידו הוסיף סימן שאלה.","* * *","בהפסקה דוד יצא למסדרון.","על אחד המסכים רץ סרטון ישן מכנס מנהיגות.","אחרי כמה שניות הופיע סטיב ג׳ובס בנאום המפורסם שלו בסטנפורד.","דוד הכיר אותו.","הוא לא עצר בגלל ג׳ובס.","הוא עצר בגלל שתי המילים:","Connecting the dots.","לחבר את הנקודות.","עמית יצא אחריו.","״זה מסוכן לך.״","״מה?״","״עוד משפט יפה.״","דוד חייך.","״אני לא הולך להפוך את ג׳ובס לפרק הבא אחרי ישעיהו.״","״טוב לשמוע.״","״אבל יש משהו במטאפורה.״","עמית הסתכל במסך.","״ברור שיש.״","דוד חשב על החודשים האחרונים.","בית ספר קטן בצפון.","רופא בחדר ניתוח.","חברת חקלאות באפריקה.","רופאה מהולנד.","אגרונום מקניה.","הרצל.","ישעיהו.","מיכה.","זכריה.","אחד העם.","הערב הגדודי.","נתן.","מתן.","יעל.","עמית.","ועכשיו האנשים שישבו בחדר.","בהתחלה הוא ניסה לחבר הכול בכוח.","לצייר קו.","למצוא סיפור אחד.","עכשיו התחיל לחשוב שאולי עצם הרצון לחבר את הכול לסיפור אחד הוא חלק מהבעיה.","״אולי אני לא צריך לחבר את כל הנקודות,״ אמר.","עמית הנהן.","״כנראה שלא.״","״אולי צריך פשוט ליצור מצב שבו נקודות שיש להן מה לתת זו לזו מצליחות להיפגש.״","עמית הסתכל עליו.","״עכשיו זה כבר פחות פילוסופיה.״","״זה טוב או רע?״","״אם אתה רוצה לעשות משהו- טוב.״","* * *","כשחזרו לחדר, עמית כתב על הלוח:","אז מה צריך?","הפעם התשובות היו זהירות יותר.","מיפוי- דרך לדעת מי עושה מה.","זיכרון- ניסיון שלא נעלם יחד עם האדם.","תרגום- להפוך ידע מקצועי לדבר שמישהו מעולם אחר יכול להשתמש בו.","קהילות- לא כנס חד־פעמי, אלא אנשים שחוזרים ונפגשים.","למידה מהעולם- לא רק מה יש לנו לתת, אלא גם מה אנחנו צריכים ללמוד.","דוד הסתכל על המילים.","פעם היה רואה בהן תוכנית.","עכשיו ראה בהן רק כיוון.","״רשת,״ אמר.","רונית חייכה.","״רשת זו מילה.״","״נכון.״","״מה היא עושה?״","דוד שתק.","״הוגן.״","* * *","בדרך הביתה התקשר ליעל.","״נו?״","״אני חושב שעכשיו באמת התחיל הפרויקט.״","״יפה. מה עשיתם?״","דוד סיפר.","על הזיכרון.","על השפה.","על הידע שנעלם.","על האלתור.","על היכולת לפעול בלי ודאות.","על המחשבה שאולי לא צריך עוד גוף שמרכז הכול, אלא דרך טובה יותר לגרום לדברים להתחבר.","יעל הקשיבה.","״אני אוהבת את החלק הזה יותר.״","״איזה?״","״שאתה לא רק שואל מה צריך להקים. אתה מנסה להבין איך המקום הזה עובד- גם כשהוא עובד טוב וגם כשהוא עובד רע.״","״כן.״","״אבל תיזהר.״","דוד חייך.","״גם את?״","״אתה מאוד קרוב להפוך את הישראלים לעם־על.״","״לא. ממש לא.״","״אני יודעת. אבל אותם דברים שאתה מתאר כיתרון הם גם החסרונות שלנו. אלתור הוא נפלא כשצריך להציל חיים. הוא פחות נפלא כשצריך מערכת שתעבוד עשרים שנה.״","דוד שתק.","״נכון.״","״אז אולי השאלה היא לא איך הופכים את המדינה לעוד יותר טובה באלתור.״","״אלא?״","״איך לוקחים את מה שטוב בזה- בלי להזדקק כל פעם למשבר כדי שזה יקרה.״","דוד חייך.","״את צריכה לבוא לפגישות האלה.״","״לא. מישהו בבית צריך לזכור לשלם חשמל.״","* * *","בלילה דוד פתח שוב את המסמך.","כתב:","מה גיליתי עד עכשיו?","הוא התחיל לאט.","יש בישראל הרבה ידע וניסיון.","הם אינם מרוכזים במקום אחד.","כנראה גם לא צריכים להיות.","חיבור אינו אומר לרכז הכול.","לפעמים מה שחסר הוא פשוט היכולת של אדם עם בעיה למצוא אדם שכבר למד משהו רלוונטי.","הוא עצר.","הוסיף כותרת נוספת:","ומה מייצר כאן כל כך הרבה ניסיון?","חוסר ודאות.","צורך.","נכונות לקחת אחריות.","אלתור.","העזה לנסות.","היכולת להתחיל מחדש.","דוד הסתכל ברשימה.","חלק ממנה נשמע ישראלי מאוד.","חלק אולי יהודי.","אולי.","הוא שם ליד המילה סימן שאלה.","אחר כך כתב:","האם אפשר לקחת יכולת שנולדה שוב ושוב מתוך חוסר ברירה- ולהפוך אותה לדרך שבה מדינה לומדת גם כשאין משבר?","הוא נשען לאחור.","זו כבר הייתה שאלה אחרת.","פחות על מה ישראל יודעת.","יותר על איך היא לומדת.","ואז חזר אליו דבר נוסף.","ירושלים.","היא המשיכה להופיע בכל פעם שחשב על הרעיון.","אבל למה?","אם מדובר ברשת, אולי לא צריך עיר.","אם מדובר בלמידה, אולי לא צריך מרכז.","אם מדובר באנשים שמתחברים סביב בעיות, אפשר לעשות את זה כמעט בכל מקום.","אז למה בכל פעם שהוא ניסה לדמיין את הדבר הזה-","הוא ראה ירושלים?","דוד עבר לעמוד חדש וכתב:","למה דווקא פה?","הפעם לא ניסה לענות.","הוא כבר למד שהשלב הבא אינו למצוא עוד סיבה לכך שהוא צודק.","אלא לבדוק אם הוא צודק בכלל."],"chars":11761},{"id":"ch11","title":"פרק 11 -למה דווקא פה?","parts":["דוד התקשר למתן יומיים אחרי הפגישה בירושלים.","״יש לך זמן השבוע?״","״תלוי למה.״","״אני רוצה להציע לך תפקיד.״","מתן שתק לשנייה.","״אני כבר לא אוהב את זה.״","דוד צחק.","״אין שכר.״","״עכשיו אני ממש רגוע.״","״אני רציני.״","״גם אני. מה התפקיד?״","דוד קם מהכיסא והתחיל ללכת בסלון תוך כדי השיחה.","״אני לוקח את הדבר הזה כפרויקט. לא עוד רק לקרוא, לחשוב ולדבר. אני רוצה לבדוק אותו באמת. להבין מה כבר קיים, מה חסר, מה סתם נשמע יפה, ואיפה אני מספר לעצמי סיפורים.״","״עד כאן נשמע סביר.״","״ואני רוצה שתהיה חלק מזה.״","מתן שתק שוב.","״למה אני?״","״כי אתה מעצבן.״","״זו כנראה המחמאה הכי אמינה שקיבלתי השנה.״","״אני צריך מישהו שלא ייתן לי לברוח. כל פעם שאני מתחיל להתאהב ברעיון, אתה מוצא את החור. כל פעם שאני לוקח מקור ומנסה לגרום לו להגיד בדיוק את מה שאני רוצה, אתה עוצר אותי. אני צריך את זה גם עכשיו.״","״כלומר אתה רוצה שאני אהיה האדם שמקלקל לך.״","״בדיוק.״","״זה דווקא נשמע כמו תפקיד שמתאים לי.״","דוד עצר ליד החלון.","״אני רציני, מתן. אם הדבר הזה שווה משהו, הוא צריך לשרוד שאלות קשות.״","״ואם הוא לא שורד?״","״אז הוא לא שורד.״","מתן שתק לרגע ארוך יותר.","״טוב.״","״טוב מה?״","״אני בפנים.״","דוד חייך.","״באמת?״","״בתנאי אחד.״","״ידעתי.״","״אתה לא מגייס אותי בשביל לתת לרעיון שלך עומק יהודי.״","דוד צחק.","״מה?״","״אני לא אהיה האיש שאתה מתקשר אליו בכל פעם שאתה צריך פסוק יפה.״","״סיכמנו.״","״ואני לא אמור להוכיח לך שמה שאתה חושב היום זה בדיוק מה שישעיהו התכוון אליו.״","״סיכמנו את זה כבר.״","״אני מזכיר.״","דוד חייך.","״אז מה אתה כן?״","מתן חשב רגע.","״אם אתה רוצה- אני האיש ששואל אותך כל פעם אם אתה רואה את מה שיש, או את מה שאתה רוצה לראות.״","דוד הנהן.","״זה בדיוק התפקיד.״","״אז מתי מתחילים?״","דוד הסתכל על הדף שהיה פתוח לפניו.","בראשו הייתה כתובה שאלה אחת:","למה ירושלים?","״עכשיו.״","* * *","הם נפגשו ביום שישי בבוקר בירושלים.","דוד הציע בית קפה במרכז העיר.","מתן אמר לא.","״אם השאלה היא ירושלים, אנחנו לא נשב בבית קפה ונדבר עליה.״","״אז מה אתה מציע?״","״ללכת.״","״לאן?״","״עוד לא החלטתי.״","דוד חייך.","״יפה. פרויקט רציני.״","״תתרגל.״","הם התחילו ללכת מאזור מרכז העיר לכיוון העיר העתיקה.","ירושלים של יום שישי כבר הייתה בתנועה אחרת.","אנשים ממהרים הביתה.","תיירים שעוצרים באמצע המדרכה.","ילדים חרדים עם שקיות.","משפחות ערביות.","חיילים.","נהגי מוניות.","קבוצות של צליינים.","הרכבת הקלה חלפה לידם.","דוד הסתכל סביב.","מתן שאל:","״אז למה ירושלים?״","״אתה שואל אותי?״","״אתה זה שרוצה לשים פה את כל החזון שלך.״","״אני עדיין לא רוצה לשים פה כלום.״","״יפה. אתה לומד. אז למה היא ממשיכה להופיע אצלך?״","דוד חשב.","״כי ישעיהו שם אותה. הרצל שם אותה. כי היא הבירה. כי היא המרכז ההיסטורי שלנו.״","מתן הסתכל עליו.","״זו תשובה טובה לספר היסטוריה. לא לפרויקט.״","״ידעתי שתעשה את זה.״","״בשביל זה גייסת אותי.״","דוד חייך.","״טוב. אז אולי בגלל שהיא עיר שיש לה משמעות לעולם.״","״עכשיו אנחנו מתחילים להתקרב למשהו. למה?״","דוד הצביע קדימה.","״בגלל כל מה שיש כאן.״","״‘כל מה שיש כאן’ זו לא תשובה.״","״מתן.״","״אני עובד.״","* * *","כשהגיעו לשער יפו, דוד עצר.","העיר העתיקה נפתחה לפניהם כמו תמיד- קטנה יותר ממה שהזיכרון מחזיק, צפופה יותר, רועשת יותר, ופחות מסודרת מכל תמונה שלה.","מתן אמר:","״תסתכל.״","״אני מסתכל.״","״לא על האבנים. על האנשים.״","הם נכנסו פנימה.","בתוך דקות עברו ליד חנות עם צלבים מעץ, חנות שמכרה כאפיות, דוכן חנוכיות, נזיר שחלף במהירות, בחור חרדי עם עגלה, משפחה מוסלמית, קבוצת נוצרים ששרו בשקט ושני שוטרים שעמדו בצד ודיברו ביניהם.","״כמה עולמות יש פה?״ שאל מתן.","״יותר מדי בשביל מקום כל כך קטן.״","״בדיוק.״","דוד חייך.","״זו כבר תשובה?״","״לא. זו עובדה. אל תמהר להפוך כל עובדה לתשובה.״","הם המשיכו.","מתן הצביע על שלט לרובע הנוצרי.","״רובע נוצרי.״","אחר כך עברו בסמוך לרובע המוסלמי.","״רובע מוסלמי.״","בהמשך דיברו על הרובע הארמני ועל הרובע היהודי.","״אפילו בתוך החומות אין ירושלים אחת,״ אמר מתן. ״יש כמה ירושלים שחיות צמודות זו לזו.״","דוד חשב על זה.","גם מחוץ לחומות היה אותו דבר.","שכונות חרדיות.","שכונות ערביות.","מרכזי ממשלה.","אוניברסיטה.","בתי משפט.","מוזיאונים.","ישיבות.","כנסיות.","מסגדים.","שכונות חדשות.","שכונות עתיקות.","ובתוך כל אחד מהעולמות האלה- עוד מחלוקות.","״אולי זו דווקא הבעיה של ירושלים,״ אמר דוד.","״מה?״","״שיש בה יותר מדי סיפורים.״","מתן הסתכל עליו.","״או שזו הסיבה שהיא מעניינת.״","* * *","הם המשיכו לנקודת תצפית שממנה היה אפשר לראות את הר הבית.","דוד נעצר.","גם אחרי כל הפעמים שהיה שם, משהו במקום הזה תמיד גרם לו להאט.","מתן עמד לידו.","״הנה דוגמה טובה,״ אמר.","״למה?״","״למקום קטן שיכול להדליק חצי עולם.״","דוד הנהן.","לא היה צריך להסביר.","הר הבית היה אולי המקום המוחשי ביותר בעולם שבו כמה סיפורים היסטוריים ודתיים חיים זה על זה, לצד זה, ולפעמים ממש בתוך אותו שטח.","עבור המסורת היהודית- המקום שבו עמדו בתי המקדש.","עבור המוסלמים- אל־חרם א־שריף, מקום קדוש שקשור במסורת למסע הלילה של מוחמד ולעלייתו לשמים.","עבור הנצרות- ירושלים כולה קשורה לסיפור חייו, צליבתו ותחייתו של ישו, דרך המקומות הקדושים הסמוכים בעיר העתיקה.","שלוש מסורות עצומות.","שלוש תודעות היסטוריות שונות.","עיר אחת.","״זה מטורף,״ אמר דוד.","״מה?״","״שהעולם כולו מתווכח על כמה קילומטרים.״","״הוא לא מתווכח רק על קילומטרים.״","״אני יודע.״","״הוא מתווכח על מי אנחנו. מאיפה באנו. מה קדוש. למי שייך העבר. ולפעמים גם למי שייך העתיד.״","דוד הסתכל שוב לעבר ההר.","״וזה בדיוק מה שהופך את ירושלים למקום הכי גרוע בעולם לבנות בו משהו שמדבר על שלום.״","מתן חייך.","״יפה. סוף סוף טיעון רציני נגד עצמך.״","״אני רציני. אם אתה רוצה מקום שבו אנשים מכל העולם יבואו לעבוד יחד, למה לבחור במקום שבו כל אבן יכולה להפוך למשבר בינלאומי?״","״שאלה טובה.״","״תל אביב הרבה יותר פשוטה.״","״נכון.״","״הרצליה.״","״אפילו יותר.״","״אפשר לעשות הכול אונליין.״","״גם נכון.״","דוד הסתובב אליו.","״אז למה אתה מחייך?״","״כי עכשיו השאלה שלך אמיתית.״","* * *","הם המשיכו ללכת.","בשלב מסוים מתן אמר:","״אתה זוכר את המשנה בפרקי אבות על מחלוקת?״","דוד חייך.","״נו, הנה הגיע הפסוק.״","״משנה. ואתה ביקשת אותי.״","״קדימה.״","״כל מחלוקת שהיא לשם שמים, סופה להתקיים.״","דוד הנהן.","״בית שמאי ובית הלל.״","״נכון.״","הם המשיכו כמה צעדים בשתיקה.","ואז דוד עצר.","״רגע.״","מתן הסתכל עליו.","״מה?״","״סופה להתקיים.״","״כן.״","״לא להיפתר.״","מתן חייך קלות.","״יפה.״","״המחלוקת נשארת.״","״זו אחת הדרכים לקרוא את זה.״","דוד המשיך לחשוב בקול.","״אולי אנחנו רגילים לחשוב ששלום הוא מצב שבו כולם מסכימים.״","מתן לא ענה מיד.","״ומי אמר שזה שלום?״ שאל לבסוף.","דוד הסתכל סביב.","מוסלמים.","נוצרים.","יהודים.","ארמנים.","חילונים.","חרדים.","תיירים.","חיילים.","שוטרים.","אותה עיר.","לא אותו סיפור.","לא אותה אמונה.","לא אותה אמת.","ולפעמים גם לא אותה גרסה של מה שקרה באותו מקום.","״אולי שלום הוא לא סוף המחלוקת,״ אמר דוד.","״אולי.״","״אולי הוא היכולת להחזיק מחלוקת בלי למחוק את הצד השני.״","מתן הסתכל עליו.","״זה כבר משפט יותר מעניין מ‘העולם יבוא ללמוד מאיתנו’.״","דוד חייך.","״עברנו דרך.״","* * *","הם עצרו לאכול משהו.","דוד פתח את המחברת.","מתן הסתכל עליו.","״ידעתי שזה יגיע.״","דוד כתב:","שלום שבו לכל חלק יש מקום- בלי שהחלק האחר חייב להיעלם.","הוא הראה למתן.","מתן קרא.","״אני אוהב את הכיוון.״","דוד הרים גבה.","״אבל?״","״אבל אתה קרוב מאוד להפוך את ירושלים לסמל יפה מדי.״","דוד סגר מעט את המחברת.","מתן המשיך.","״אתה ואני מסתובבים כאן ביום שישי ואומרים: תראה כמה קבוצות חיות יחד. אבל יש פה גם פחד. אפליה. אלימות. טרור. לאומנות. קהילות שכמעט לא מדברות זו עם זו. אנשים שכל החלום שלהם הוא שהצד השני ייעלם.״","דוד הנהן.","״נכון.״","״אם ירושלים תהיה חלק מהחזון שלך, אתה לא יכול להשתמש רק בירושלים הסמלית. אתה צריך לקחת גם את ירושלים האמיתית.״","דוד הסתכל על הרחוב.","אנשים עברו לידם בלי שום קשר לשיחה הגדולה שלו.","זה היה חשוב.","העיר לא הייתה תפאורה לרעיון שלו.","אנשים חיו בה.","״אולי דווקא זה העניין,״ אמר.","״מה?״","״לא שהיא כבר יודעת איך לחיות עם כל הניגודים האלה. ברור שלא. אולי היא המקום שבו אי אפשר לברוח מהם.״","מתן שתק.","״תמשיך.״","״אם אתה רוצה מקום שבו אנשים עם ניסיון שונה, תרבויות שונות ואינטרסים שונים עובדים יחד על בעיות- אי אפשר לבנות אותו כאילו בני אדם מגיעים בלי מטען.״","״נכון.״","״אנשים מגיעים עם זהות. דת. היסטוריה. אינטרסים. זיכרונות. פחדים.״","״נכון.״","דוד הסתכל סביב.","״וירושלים היא כל זה בצפיפות מטורפת.״","מתן חייך.","״עכשיו אנחנו מתקרבים לתשובה.״","* * *","אחרי האוכל הם המשיכו ללכת.","דוד חשב שוב על הרצל.","״היכל השלום,״ אמר פתאום.","״מה איתו?״","״אולי גם אותו קראתי פשוט מדי.״","מתן חייך.","״איזה כיף לראות אותך עובד.״","״שתוק. אני רציני.״","״גם אני.״","״כשקראתי ‘היכל השלום’, דמיינתי מקום שקט. אנשים מכל העולם מגיעים, יושבים סביב שולחן, מדברים יפה ויוצאים עם פתרון.״","״והיום?״","דוד הביט בסמטה צרה שבה שני זרמי אנשים ניסו לעבור זה מול זה.","״היום אני חושב שאם דבר כזה יקום כאן אי פעם, הוא יצטרך לדעת לעבוד דווקא עם מחלוקת.״","מתן הנהן.","״זה הבדל גדול.״","״לא להביא אנשים כדי שיהפכו דומים. להביא אותם עם ההבדלים שלהם.״","״כן.״","״ולא לצפות שתצא תשובה אחת שמתאימה לכולם.״","״כן.״","דוד עצר.","״אולי מקום כזה לא צריך להיות המקום שמוציא ממנו אמת אחת לעולם.״","מתן הסתכל עליו.","״זה כבר יהיה ויכוח מעניין מאוד עם ישעיהו.״","דוד צחק.","״ידעתי שתפריע.״","״בשביל זה אני פה.״","״אבל תחשוב. אולי מבחינתי ‘כי מציון תצא תורה’ לא צריך להפוך לזה שכולם יקבלו תשובה אחידה. אולי אפשר לראות בירושלים מקום שבו בני אדם באים לברר, ללמוד, להתווכח- ולצאת עם פתרונות שונים שמתאימים למציאות שלהם.״","מתן לא מיהר לענות.","״זה פירוש שלך.״","״ברור.״","״לא פירוש מוכרח של הפסוק.״","״ברור.״","מתן חייך.","״יפה. אפשר להמשיך.״","* * *","לקראת ערב הם הגיעו לנקודת תצפית גבוהה יותר.","ירושלים נפרשה מתחתיהם.","לא ירושלים של גלויה.","מנופים.","בנייני אבן חדשים.","כבישים.","פקקים.","כיפות.","מגדלים.","מסגדים.","כנסיות.","שכונות יהודיות וערביות.","העיר שינתה קצב ככל שהשבת התקרבה בחלקים מסוימים שלה, בזמן שבחלקים אחרים החיים המשיכו במסלול אחר לגמרי.","״אתה יודע מה מוזר?״ אמר דוד.","״מה?״","״כל הזמן חיפשתי סיבה לבחור בירושלים.״","״ועכשיו?״","״אני מתחיל לחשוב שאולי השאלה הפוכה.״","״איזו?״","דוד נשען על המעקה.","״אם רוצים מקום שמחבר בני אדם שונים סביב בעיות משותפות- למה לבחור במקום קל?״","מתן הביט בעיר.","דוד המשיך.","״אולי כל הערך של ירושלים הוא שאין בה שום אפשרות להעמיד פנים שהבדלים לא קיימים.״","מתן הנהן לאט.","״זה כבר יותר חזק.״","דוד הסתכל למטה.","הוא חשב על ישעיהו.","על הרצל.","על היכל השלום.","ועל כל האנשים בעיר שמתחתיו שלא קראו אף אחד מהם ולא ביקשו להשתתף בחזון שלו.","זה היה חשוב.","ירושלים לא הייתה דף ריק.","אי אפשר היה לצייר עליה רעיון ולצפות שהעיר תתאים את עצמה אליו.","היא כבר הייתה מלאה.","באנשים.","בסיפורים.","באמונות.","בפחדים.","בתקוות.","בזיכרונות.","במחלוקות שלא ייעלמו.","ופתאום דוד הבין שאם החזון שלו דורש שהמחלוקות ייעלמו כדי לעבוד- הוא לא יכול להתחיל בירושלים.","ואולי דווקא משום כך היא הייתה מבחן טוב.","״מתן.״","״כן?״","״אולי שלום הוא לא מצב שבו אין יותר צדדים.״","״כנראה שלא.״","״אולי הוא מצב שבו אף צד לא צריך להיעלם כדי שיהיה מקום לאחר.״","מתן הביט בו.","״את זה הייתי כותב.״","דוד הוציא את המחברת.","״ידעתי שבסוף תעודד אותי לכתוב משפט.״","״אל תתרגל.״","דוד כתב:","ירושלים אינה מעניינת מפני שאין בה מחלוקת.","ומתחת:","היא מעניינת מפני שאי אפשר לברוח בה מהמחלוקת.","הוא עצר.","ואז הוסיף:","אולי היכל השלום אינו המקום שבו המחלוקת מסתיימת.\nאולי הוא המקום שבו לומדים לעבוד בתוכה בלי להשמיד זה את זה.","מתן קרא מעל כתפו.","״זה כבר רעיון ששווה להסתבך איתו.״","דוד סגר את המחברת.","למטה העיר המשיכה לחיות.","אף אחד לא פתר אותה.","אף אחד גם לא עמד לפתור אותה.","ובפעם הראשונה דוד הבין שאולי ירושלים לא צריכה להיות ההוכחה לכך שהחזון שלו אפשרי.","אולי היא צריכה להיות המקום שמעמיד אותו במבחן."],"chars":10477},{"id":"ch12","title":"פרק 12 -אם אתה רוצה לעשות -תעשה. אל תדבר.","parts":["דוד יצא מהסיור בירושלים עם יותר מחשבות משהיו לו כשנכנס אליו.","בחודשים האחרונים הוא כבר התרגל לזה.","כמעט כל פגישה פתחה עוד דלת.","כל תשובה הולידה שתי שאלות.","וכל פעם שנדמה היה לו שהרעיון מתחיל לקבל צורה, הגיע מתן, יעל או נתן והוציאו ממנו בדיוק את החלק שכבר היה בטוח בו.","פעם זה היה מתסכל אותו.","עכשיו הוא התחיל להבין שאולי ככה נראה בירור אמיתי.","ובכל זאת, בדרך הביתה מירושלים, משהו הציק לו.","הוא חשב על כל מה שעשה מאז אותה שיחה בבית הקפה.","קרא.","נפגש.","שאל.","נסע.","כתב.","הרצל.","ישעיהו.","בתי ספר.","רופאים.","חקלאים.","אנשים מחו״ל.","אנשי ממשלה.","ירושלים.","עשרות עמודים במחברת.","הרבה מאוד מילים.","הטלפון צלצל.","נתן.","״מה קורה, הרצל?״","דוד חייך.","״בסדר.״","״מתן סיפר לי שאתה מקים שלום עולמי בירושלים.״","״מתן מדבר יותר מדי.״","״אז?״","״אז מה?״","״מה אתה עושה עכשיו עם כל הדבר הזה?״","דוד הסתכל על הכביש.","״בודק.״","״מה?״","״את הרעיון.״","״איך?״","דוד שתק.","נתן צחק.","״זה מה שחשבתי.״","״מה?״","״אתה עדיין מדבר עליו.״","״אני נפגש עם אנשים.״","״זה לדבר.״","״אני לומד.״","״גם זה סוג יפה של לדבר.״","דוד הרגיש שהוא מתחיל להתעצבן.","״אז מה אתה מציע?״","נתן ענה מיד.","״שום דבר גדול.״","״נו.״","״אם אתה רוצה לעשות- תעשה. אל תדבר.״","דוד שתק.","נתן המשיך:","״קח בעיה אחת. קטנה. אמיתית. תנסה לראות אם כל החיבורים האלה שאתה מדבר עליהם באמת שווים משהו.״","״זה לא כזה פשוט.״","״ברור שלא. בגלל זה עד עכשיו דיברת.״","דוד חייך בעל כורחו.","״אתה ממש נהנה מזה.״","״מאוד.״","הם סיימו את השיחה כמה דקות אחר כך.","אבל המשפט נשאר.","אם אתה רוצה לעשות- תעשה. אל תדבר.","* * *","באותו ערב דוד פתח את המחברת.","לא את המסמך על ישראל 2048.","לא את הרשימה על ירושלים.","עמוד חדש.","למעלה כתב:","בעיה אחת.","ומתחת:","מה כואב מספיק כדי שאנשים שונים באמת יצטרכו זה את זה?","הוא פסל מיד כמה רעיונות.","חדשנות בחינוך- רחב מדי.","שיפור מערכת הבריאות- מגוחך.","חיבור ישראל לעולם- בכלל לא בעיה.","הוא חזר למפגש הראשון בבית הספר.","לילדים שנמצאים בכיתה אבל כבר נעלמו ממנה.","למנהלים.","ליועצים.","לנוער.","ואז נזכר בשיחה שהייתה לו כמה חודשים קודם עם מנהלת אגף נוער באחת הרשויות.","היא אמרה משהו שלא יצא לו מהראש:","״אנחנו כמעט תמיד מגיעים אליהם מאוחר מדי.״","הוא כתב:","איך מזהים נער שמתחיל להידרדר- לפני שהוא כבר עמוק בתוך נשירה, אלימות וסמים?","הסתכל על המשפט.","זו לא הייתה שאלה על חזון.","וזה בדיוק מה שאהב בה.","* * *","עמית היה הראשון שהתקשר אליו.","״קיבלתי את ההודעה שלך.״","״מה אתה חושב?״","״שזו בעיה אמיתית.״","״אז?״","״אז עכשיו תיזהר לא להרוס אותה עם פתרון.״","דוד צחק.","״אין לי פתרון.״","״יופי. מי צריך להיות בחדר?״","״חינוך. רווחה. נוער. משטרה. אולי פסיכולוג.״","״עוד.״","דוד חשב.","״מישהו מטכנולוגיה?״","״למה?״","״כי אולי יש מידע שקיים במקומות שונים ואפשר לזהות איתו דפוסים.״","עמית עצר אותו.","״אולי. אבל אם אתה מכניס טכנולוגיה לפני שהבנת את הבעיה, תוך חצי שעה יש לך מערכת במקום פתרון.״","״נקודה.״","״ומישהו מחו״ל?״","דוד חשב על יוהנס.","״כן. לא כי הוא יודע יותר. כי אולי הוא ראה דרך אחרת להתמודד עם אותה בעיה.״","״עכשיו אתה כבר מדבר יותר טוב.״","* * *","שבועיים אחר כך דוד הגיע מוקדם לחדר הישיבות.","על הקיר היה לוח מחיק.","עליו כתב:","איך מזהים נער שמתחיל להידרדר- לפני שהוא כבר עמוק בתוך נשירה, אלימות וסמים?","הוא עמד מול המשפט כמה דקות.","זו הייתה הפעם הראשונה שהפרויקט שלו עמד מול בעיה שאי אפשר לפתור במשפט יפה.","ראשון הגיע אבי, מנהל בית הספר שמתן הכיר לו.","אחריו מיכל, מנהלת אגף נוער ברשות מקומית.","ליאת, עובדת סוציאלית שעבדה עם בני נוער בסיכון.","רועי, קצין שהיה אחראי על תחום נוער וקהילה.","שרון, פסיכולוגית.","ערן, יזם טכנולוגיה שפיתח מערכות מידע עבור רשויות.","יוהנס הצטרף על מסך מברלין.","מתן הגיע אחרון.","הוא הסתכל סביב.","״מה התפקיד שלי?״","דוד הצביע על כיסא.","״להפריע.״","״יופי. לפחות יש המשכיות.״","* * *","דוד פתח.","פחות מחמש דקות.","לא ישעיהו.","לא הרצל.","לא ירושלים.","נער אחד.","שם בדוי.","בן חמש־עשרה.","בהתחלה איחר.","אחר כך התחיל להיעדר.","הציונים ירדו.","אמא שלו התקשרה לבית הספר כמה פעמים.","ברווחה ידעו שיש משבר בבית.","מדריך נוער ראה אותו מסתובב בלילות עם נערים מבוגרים יותר.","כעבור כמה חודשים המשטרה כבר הכירה אותו מאירועי אלימות.","מאוחר יותר נכנסו גם סמים.","דוד הסתכל סביב השולחן.","״אני לא רוצה לדבר היום על הילד הזה.״","מיכל הרימה גבה.","״אז למה סיפרת עליו?״","״כי אני רוצה לדבר על כל הרגעים שבהם כל אחד ידע משהו- אבל אף אחד לא ראה את כל התמונה.״","מיכל הייתה הראשונה להגיב.","״אני כבר לא אוהבת את ההנחה.״","דוד חייך.","״מעולה.״","״מה מעולה?״","״בשביל זה את פה.״","״לא כל מידע צריך להגיע לכולם.״","״ברור.״","״לא, לא ברור. כי כל פעם שמדברים על ‘לחבר מערכות’, בסוף מישהו מציע מאגר ענק עם כל החיים של הילד בפנים.״","ערן זז בכיסא.","״לא אמרתי מאגר.״","מיכל הסתכלה עליו.","״עוד לא.״","מתן חייך.","״אני כבר אוהב את המפגש.״","* * *","ליאת נכנסה.","״אני אגיד יותר מזה. לפעמים הסיבה שילד מספר לי משהו היא בדיוק מפני שהוא יודע שזה לא יגיע לבית הספר או למשטרה.״","רועי הנהן.","״ומצד שני, לפעמים אנחנו פוגשים נער ברחוב ורק בדיעבד מגלים שכבר חצי שנה כולם יודעים שהוא בירידה.״","״‘כולם’ זו מילה מסוכנת,״ אמרה שרון.","״למה?״","״כי אחרי שמשהו קורה, תמיד נדמה שהיה ברור. בדיעבד הכול מתחבר. בזמן אמת ילד שמאחר לבית ספר הוא לפעמים פשוט ילד שמאחר לבית ספר.״","אבי הנהן.","״יש לי מאות תלמידים. אני לא יכול להפוך כל איחור לאירוע רווחה.״","ערן נשען קדימה.","״אבל אולי לא צריך סימן אחד. אולי צריך לחפש כמה סימנים שמצטברים.״","שרון הסתכלה עליו.","״ומי מחליט מה זה ‘מצטברים’? האלגוריתם שלך?״","״לא אמרתי אלגוריתם שמחליט.״","״עוד לא,״ אמר מתן.","החדר צחק.","המתח ירד מעט.","דוד לא ניסה לעצור אותו.","להפך.","לראשונה הוא שם לב שהוויכוח עצמו מייצר דברים שלא היו שם לפניו.","* * *","יוהנס ביקש לדבר.","״אפשר להגיד משהו מהניסיון שלנו?״","דוד הנהן.","״אצלנו ניסינו פעם לבנות מערכת מאוד מסודרת של סימני סיכון.״","״עבד?״ שאל אבי.","״חלקית.״","״מה הבעיה?״","״אנשים התחילו לעבוד בשביל הרשימה.״","דוד הסתכל עליו.","יוהנס המשיך.","״אם ילד עמד בשלושה קריטריונים- כולם הרגישו שצריך לעשות משהו. אם עמד רק בשניים- לפעמים התעלמו. אבל בני אדם לא יודעים לקרוא את הנהלים.״","אבי חייך.","״גם בישראל.״","״אז מה עשיתם?״ שאל דוד.","״עברנו ממודל של ציון סיכון למודל של אחריות.״","״מה זאת אומרת?״","״פחות חשוב אם יש לילד חמש נקודות או שבע. חשוב שמישהו אחד יידע שיש שינוי, ישאל שאלות, ויוודא שמישהו ממשיך לראות אותו.״","ליאת הזדקפה.","״זה כבר מעניין.״","מיכל הנהנה.","״כלומר לא מערכת שמכריזה ‘ילד בסיכון’.״","״לא. אדם שמחזיק את הרצף.״","דוד כתב על הלוח:","רצף.","* * *","משהו בשיחה השתנה.","עד עכשיו כל אחד הגן על התחום שלו.","חינוך הזהיר מפני עומס.","רווחה מפני חשיפת מידע.","הפסיכולוגיה מפני תיוג.","המשטרה מפני מצב שבו כולם יודעים ואף אחד לא פועל.","הטכנולוגיה מפני החמצת מידע שכבר קיים.","עכשיו התחילו לשאול שאלה אחרת:","מה אפשר לבנות בלי למחוק את הסיבות שבגללן כל אחד התנגד?","רועי אמר שלפעמים דווקא אירוע קטן ברחוב הוא הסימן הראשון שמשהו גדול יותר קורה.","שרון חזרה והזהירה מפני הפיכת כל התנהגות חריגה לפתולוגיה.","יוהנס דיבר על רצף אחריות.","ערן התחיל לחשוב בקול על דרך לחבר סימנים בלי לבנות מאגר שמישהו אחד רואה בו הכול.","ליאת אמרה:","״אני רוצה שאם הילד סיפר לי משהו בסוד, הוא יישאר בסוד. אבל אני כן רוצה לדעת שמישהו בבית הספר רואה אותו.״","אבי הסתכל עליה.","״ואני רוצה לדעת שיש מישהו שאפשר להתקשר אליו לפני שאני פותח אירוע רשמי.״","מיכל כתבה משהו על דף.","״אז אולי אנחנו בכלל לא צריכים ‘מערכת’.״","ערן חייך.","״אמרתי את זה ראשון.״","״לא אמרת.״","״חשבתי.״","מתן התערב.","״מדהים כמה דברים אנשים חשבו אחרי שמישהו אחר אמר אותם.״","* * *","אחרי כמעט שעתיים עמית הצטרף.","הוא נכנס בשקט, התיישב מאחור והקשיב.","דוד עמד ליד הלוח.","עליו כבר לא הייתה רק שאלה.","היו מילים.","אדם אחד.","רצף.","סימנים מוקדמים.","פרטיות.","פגישה קצרה.","אחריות.","לאט לאט, בלי שאף אחד הכריז על כך, התחיל להיווצר משהו.","לא פתרון.","שלד.","שלושה בתי ספר.","רשות מקומית אחת.","צוות קטן.","בכל בית ספר ייבחרו כמה אנשי צוות שיודעים לזהות סימני התרחקות מוקדמים.","לא ציון.","לא רשימת ילדים מסומנים.","סימן שמישהו צריך להסתכל שוב.","לכל נער שיעלה חשש לגביו יהיה אדם אחד שמחזיק את הרצף.","לא בהכרח מטפל.","לא האדם שיודע הכול.","פשוט מבוגר שיודע מי כבר בתמונה ומה נעשה.","פעם בשבועיים תתקיים שיחה קצרה בין הגורמים הרלוונטיים.","רק מי שצריך.","רק המידע שצריך.","תחת כללים ברורים לגבי מה מותר ומה אסור לשתף.","לא מאגר ענק.","לא אלגוריתם שמחליט מי מסוכן.","ניסיון לראות מוקדם יותר את מה שכיום מתגלה מאוחר מדי.","עמית הצביע על הלוח.","״כמה זמן?״","״חצי שנה,״ אמרה מיכל.","אבי הניד בראש.","״יותר מדי.״","״למה?״","״כי אם צריך חצי שנה כדי לדעת אם הדבר בכלל חי, הוא ימות קודם.״","״ארבעה חודשים?״","ליאת אמרה:","״חמישה. צריך זמן לראות משהו אמיתי.״","כולם הסתכלו על עמית.","״למה אתם מסתכלים עליי?״","״כי היית מנכ״ל.״","״זו בדיוק הסיבה לא להקשיב לי.״","צחוק עבר בחדר.","בסוף כתבו:","חמישה חודשים.","* * *","״ומה מודדים?״ שאל עמית.","החדר שוב השתתק.","ערן אמר:","״מספר הילדים שמזוהים מוקדם.״","שרון מיד התנגדה.","״לא. אם תמדוד כמה ילדים זוהו, תעודד אותם לזהות יותר ילדים.״","״צודקת.״","מיכל אמרה:","״אולי כמה זמן עובר מרגע שמתחיל חשש ועד שמישהו לוקח אחריות.״","אבי הוסיף:","״נוכחות.״","ליאת:","״קשר עם מבוגר משמעותי.״","שרון:","״וגם לשאול את הנערים עצמם. לא רק למדוד אותם מבחוץ.״","דוד הסתכל על כולם.","לפני כמה חודשים הוא היה מנסה לסכם.","עכשיו הוא פשוט נתן להם לעבוד.","עמית הסתכל עליו מהצד.","חייך.","דוד הבין למה.","* * *","כשכבר התחילו לקום, מתן נשאר לשבת.","״מה?״ שאל דוד.","״יש לי בעיה עם משהו שאמרת קודם.״","״כמובן.״","״אמרת שהמטרה היא לחבר את כל המידע.״","״כבר ירדנו מזה.״","״אני יודע. וזה חשוב. כי לפעמים החיבור עצמו יכול להיות מסוכן.״","דוד הנהן.","״נכון.״","״וגם עם כל ההתלהבות שלך מהמחלוקת.״","״מה איתה?״","״אל תתחיל עכשיו לחשוב שכל ויכוח מייצר חכמה.״","דוד חייך.","״לא התכוונתי.״","״לפעמים מישהו פשוט טועה. לפעמים רעיון רע הוא רעיון רע. לפעמים מחלוקת לא מבררת שום דבר. היא פשוט הורסת.״","דוד הנהן.","״נכון.״","״אז מה אתה כן אומר?״","דוד הסתכל על הלוח.","״שאם אני מנסה להבין בעיה מורכבת, כדאי לי לחשוד מאוד בתשובה שבה רק צד אחד רואה הכול.״","מתן חייך.","״עם זה אני יכול לחיות.״","״ואולי שהחיכוך הוא לא תמיד תקלה.״","״גם עם זה.״","דוד חשב.","״לפעמים משהו חדש נוצר דווקא במקום שבו שני אנשים מגיעים עם ידע שלא מסתדר אחד עם השני.״","מתן פתח את הדלת.","״זה כבר פחות פוסטר מהניסוח הקודם שלך.״","״תודה.״","״אל תתרגש.״","* * *","באותו ערב יעל מצאה את דוד שוב מול המחשב.","״נו, עשית או דיברת?״","דוד הסתובב אליה.","״עשיתי.״","״באמת?״","״יש פיילוט.״","יעל הצרה עיניים.","״יש פיילוט או שיש מסמך שכתוב עליו ‘פיילוט’?״","דוד צחק.","״למה כולם בחיים שלי כאלה?״","״כי אתה בחרת אותנו.״","הוא סיפר לה.","על הנער.","על הוויכוח.","על בית הספר, הרווחה, המשטרה, הפסיכולוגית, הטכנולוגיה.","על יוהנס.","על הרגע שבו כולם הפסיקו להגן רק על המערכת שלהם והתחילו לבנות משהו בין המערכות.","ועל ההחלטה לנסות במשך חמישה חודשים לזהות הידרדרות מוקדם יותר ולבנות סביב נער רצף אנושי אחד.","יעל הקשיבה.","״נשמע טוב.״","דוד הסתכל עליה.","״באמת?״","״כן.״","״בלי אבל?״","״ברור שיש אבל.״","דוד חייך.","״ידעתי.״","״זה נשמע טוב על הלוח. נדע אם זה טוב אחרי שתראה מה קורה לילדים.״","דוד הנהן.","״זה גם מה שמתן ועמית אמרו.״","״אנשים חכמים.״","״כולם חכמים חוץ ממני בבית הזה.״","״נכון.״","היא חייכה ופנתה ללכת.","ואז הסתובבה.","״ומה אתה כותב עכשיו?״","״משהו שחשבתי עליו.״","״אוי.״","״די.״","היא צחקה והלכה.","דוד פתח את המחברת.","למעלה כתב:","מה היה בחדר שלא היה אצל אף אחד בנפרד?","הוא נשען לאחור.","ניסה לענות.","מחק.","ניסה שוב.","בסוף כתב:","אולי הידע החשוב ביותר לא נמצא אצל אף אחד מהאנשים בחדר.","ומתחת:","אולי הוא נוצר ביניהם.","דוד הסתכל על שתי השורות הרבה זמן.","בית הספר ידע לראות דברים שאיש הרווחה לא ראה.","ליאת ידעה דברים שבית הספר לא יכול היה לדעת.","המשטרה פגשה רגעים שאף אחד מהם לא ראה.","שרון ידעה להזהיר את כולם מפני הדבר שהם עלולים לעשות מתוך כוונה טובה.","ערן ראה אפשרויות שאחרים בכלל לא חשבו עליהן.","יוהנס הביא ניסיון שנוצר במקום אחר.","אף אחד מהם לא החזיק את התשובה.","וגם כשהם נכנסו לחדר- התשובה עדיין לא הייתה שם.","היא התחילה להופיע רק כשנאלצו להתווכח.","לוותר.","לתרגם.","להסביר.","לשנות.","דוד חזר לשתי השורות.","בפעם הראשונה מאז התחיל את כל המסע הזה, הוא הרגיש שהוא לא רק מדמיין את הדבר שהוא מחפש.","למשך שלוש שעות, בחדר ישיבות קטן עם קפה בינוני, חשדנות, ויכוחים והרבה יותר מדי דעות-","הוא ראה ממנו חתיכה קטנה.","והיא לא נראתה בכלל כמו היכל.","היא נראתה כמו שולחן."],"chars":11204},{"id":"ch13","title":"פרק 13 -יום ראשון","parts":["בישיבת ההכנה הכול נראה די פשוט.","שלושה בתי ספר.","רשות מקומית אחת.","בכל בית ספר צוות קטן שיזהה סימנים מוקדמים של התרחקות.","לכל נער שיעלה חשש לגביו יהיה מבוגר אחד שיחזיק את הרצף- לא מטפל, לא מנהל־על, פשוט אדם שיודע מי כבר בתמונה ומוודא שהילד לא עובר בין המערכות בלי שמישהו רואה אותו.","אחת לשבועיים תתקיים שיחה קצרה בין הגורמים הרלוונטיים.","לא כולם על כולם.","רק מי שצריך.","רק מה שצריך.","כללים ברורים לגבי שיתוף מידע.","חמישה חודשים.","על הנייר זה היה כמעט אלגנטי.","ביום ראשון, בשעה תשע ועשרים בבוקר, התקשרה מיכל מהרשות.","״יש בעיה.״","דוד הסתכל על השעון.","״לקח לנו שעה ועשרים דקות. יפה.״","״אני רצינית.״","״מה קרה?״","״אחד מבתי הספר אומר שהוא לא יכול להעביר שמות לפני שהיועצת המשפטית מאשרת את הנוהל.״","דוד נשען לאחור.","״אבל כבר עברנו על זה.״","״עברנו עם האנשים שישבו בחדר. עכשיו נכנסו האנשים שלא ישבו בחדר.״","דוד חייך בלי שמחה.","״ברור.״","״ועוד משהו. ליאת אומרת שהיא לא יכולה להתחייב לישיבה פעם בשבועיים.״","״למה?״","״כי יש לה ארבעים ושבעה תיקים פתוחים.״","דוד הסתכל על המסמך שהיה פתוח מולו.","פיילוט- רצף מוקדם לנוער בסיכון.","פתאום הכותרת נראתה לו הרבה יותר בטוחה בעצמה מהדבר שמתחתיה.","״אז מה עושים?״","שאל.","״משנים.״","דוד חייך.","״מה?״","״אמרתם שזה פיילוט, לא?״","״כן.״","״אז בוא נראה אם אתם באמת מתכוונים לזה.״","* * *","הישיבה הראשונה של הצוות המקומי התקיימה שלושה ימים אחר כך.","פחות אנשים הגיעו ממה שתוכנן.","ליאת הייתה בזום מהאוטו.","רועי מהמשטרה הודיע שלא יוכל להשתתף באופן קבוע.","ערן כלל לא היה בחדר.","היועצת המשפטית של הרשות הצטרפה לעשרים דקות והבהירה שכמה מהדברים שכולם חשבו שהם יכולים לעשות- הם לא יכולים לעשות.","לפחות לא בצורה שבה חשבו.","דוד ישב והקשיב.","פעם היה מרגיש שהפרויקט מתחיל להתפרק.","עכשיו ניסה להסתכל על זה אחרת.","זה לא היה הפרויקט מתפרק.","זה היה הפרויקט מתחיל לפגוש את העולם.","הם שינו את המודל.","אין רשימה משותפת של שמות.","אין מאגר מרכזי.","מי שמעלה חשש לגבי נער הוא גם האדם שאחראי לוודא שמישהו ניגש אליו.","שיחת הצוות לא מתקיימת בכל שבועיים באופן אוטומטי, אלא רק כשיש צורך אמיתי.","הגורמים השונים משתפים רק את המידע שנדרש כדי להחליט על פעולה- לא את כל מה שהם יודעים.","אבי, מנהל בית הספר, הסתכל על הלוח.","״זה הרבה פחות מסודר ממה שתכננו.״","מיכל ענתה:","״נכון.״","״זה טוב?״","״לא יודעת.״","דוד חייך.","״נראה.״","מתן, שישב בפינה, הרים את הראש.","״התקדמות יפה. לפני חודש כבר היית מסביר לנו למה זה טוב.״","דוד התעלם.","* * *","הנער הראשון עלה פחות משבוע אחר כך.","נועם.","בן שש־עשרה.","הוא דווקא כן היה מסוג הילדים שמבחינים בהם.","כשנכח בבית הספר, הרגישו אותו.","מצחיק.","חכם.","מתווכח.","לפעמים יותר מדי.","בחודשים האחרונים התחיל לאחר.","אחר כך להחסיר.","היו כמה עימותים עם מורים.","המחנכת ידעה שאבא שלו כמעט לא בבית.","מדריך נוער סיפר שראה אותו כמה פעמים עם חבורה מבוגרת יותר.","לא היה שום דבר אחד שאמר:","זה ילד בסיכון.","היו הרבה דברים קטנים.","בדיוק בשביל זה הקימו את הפיילוט.","״אז הנה,״ אמר דוד כששמע עליו.","מיכל הסתכלה עליו.","״הנה מה?״","״זה בדיוק מה שחיפשנו. רואים מוקדם.״","היא לא ענתה.","רק מאוחר יותר דוד הבין כמה מהר הוא כבר הפך ילד להוכחה.","הם ניסו להתקרב לנועם.","אבי נפגש איתו.","מדריך הנוער לקח אותו לשיחה.","ליאת ניסתה לחבר אותו למסגרת טיפולית.","הציעו לו עבודה אחר הצהריים במוסך של אדם שהכיר את המשפחה.","פעם אחת הוא הגיע.","בפעם השנייה איחר.","בפעם השלישית לא הגיע בכלל.","שבוע אחר כך הפסיק להגיע כמעט לחלוטין לבית הספר.","ואחרי עוד שבועיים נתפס עם כמה חברים כשברשותם חומר החשוד כסם.","דוד קיבל את ההודעה בערב.","הוא קרא אותה פעם אחת.","ואז שוב.","התיישב במטבח.","יעל הייתה עדיין בעבודה.","הבית היה שקט.","אחרי כמה דקות התקשר למתן.","״זה לא עבד.״","״מה לא עבד?״","״הפיילוט.״","״בגלל נועם?״","״כן.״","מתן שתק.","״דוד, באמת חשבת שאם תשים כמה אנשים בחדר אף נער יותר לא ייפול?״","״לא.״","״אז למה אתה מדבר כאילו הבטחת את זה?״","דוד נשען על השיש.","״כי ראינו אותו. ידענו. ובכל זאת לא הצלחנו לעצור את זה.״","״נכון.״","״אז מה עשינו?״","מתן נשם.","״אולי ראיתם אותו מאוחר מדי. אולי עשיתם טעויות. אולי הוא לא רצה עזרה. אולי היו דברים שלא ידעתם. ואולי יש דברים שאי אפשר לשלוט בהם.״","״זה לא מאוד מעודד.״","״אני לא עובד אצלך במחלקת עידוד.״","דוד חייך למרות עצמו.","מתן המשיך:","״אתה לא בונה מערכת שמבטיחה שאף ילד לא ייפול. אם זו המטרה שלך, תעצור עכשיו.״","״אז מה המטרה?״","״לבנות מערכת שרואה מוקדם יותר, מגיבה טוב יותר ומגדילה את הסיכוי שילד לא ייעלם.״","״מגדילה את הסיכוי.״","״כן.״","״זה נשמע הרבה פחות מרשים.״","״המציאות בדרך כלל פחות מרשימה מחזון.״","מתן עצר.","״היא גם יותר חשובה.״","* * *","איתי היה בן חמש־עשרה ושלושה חודשים.","דוד הכיר את שמו כשבועיים אחר כך.","בניגוד לנועם, הוא לא היה ילד שמשך תשומת לב.","נמוך יחסית.","רזה.","חיוך שהופיע בעיקר כשמישהו אחר אמר משהו מצחיק.","הוא לא הפריע בשיעורים.","לא קילל מורים.","לא היה תלמיד טוב במיוחד, אבל גם לא נכשל באופן חריג.","דווקא משום כך כמעט לא שמו לב אליו.","המחנכת שלו, ענת, הייתה זו שהעלתה אותו.","״משהו השתנה,״ אמרה בשיחת הצוות.","אבי שאל:","״מה?״","״אני לא יודעת להסביר.״","״נוכחות?״","״כן, אבל לא רק. הוא תמיד הגיע. עכשיו הוא מחסיר יום פה, שעתיים שם. וגם כשהוא נמצא- הוא לא באמת כאן.״","ליאת שאלה:","״יש משהו בבית?״","״לא שאני יודעת.״","מיכל הסתכלה ברשימות שלה.","״רגע. איתי כהן?״","ענת הנהנה.","״האח שלו היה אצלנו במועדון נוער.״","״זה טוב או רע?״ שאל דוד.","״מורכב.״","אחד ממדריכי הנוער, שלא השתתף במפגש המקורי אבל צורף לצוות המקומי, הכיר את איתי.","״אני רואה אותו לפעמים עם חבר׳ה יותר גדולים.״","״איזה חבר׳ה?״","המדריך עשה פרצוף.","״לא חבר׳ה שהייתי בוחר לו.״","דוד הסתכל סביב.","כמה חודשים קודם התמונה הזאת הייתה נשארת מפוזרת.","מחנכת עם תחושת בטן.","אגף נוער עם היכרות משפחתית.","מדריך שמכיר את החבורה.","אף אחד מהם לא ידע משהו דרמטי.","אבל יחד הופיעה תמונה.","הפעם אף אחד לא אמר:","ילד בסיכון.","הם למדו משהו מנועם.","ענת פשוט ביקשה מאיתי להישאר אחרי השיעור.","היא לא שאלה אותו אם הוא משתמש בסמים.","לא דיברה על סימני סיכון.","לא אמרה שהמערכת מודאגת ממנו.","רק:","״אתה בסדר?״","איתי אמר שכן.","ענת הנהנה.","״טוב. אז אני שואלת שוב.״","הוא חייך.","אחרי עשר דקות התחיל לדבר.","לא הכול.","רק מספיק.","אמא שלו הייתה בתקופה קשה.","אחיו הגדול הסתבך בחובות.","איתי התחיל לבלות יותר מחוץ לבית.","והחבורה המבוגרת נתנה לו מקום.","בערב, מדריך הנוער פגש אותו במקרה שתוכנן היטב.","לא כטיפול.","במגרש.","כדורסל.","כעבור כמה ימים הציע לו להצטרף לעבודה זמנית בפרויקט עירוני אחר הצהריים.","איתי סירב.","המדריך הציע שוב.","איתי סירב שוב.","בפעם השלישית הגיע.","* * *","אחרי חודש וחצי ענת התקשרה לדוד.","״אני לא יודעת אם זה מעניין אותך.״","״מה?״","״איתי.״","דוד התיישר.","״מה איתו?״","״הנוכחות השתפרה.״","״באמת?״","״רגע. לא להשתגע.״","דוד חייך.","״לא משתגע.״","״הוא עדיין מאחר. יש ימים שהוא מחסיר. הוא לא הפך פתאום לתלמיד מצטיין.״","״אבל?״","ענת חשבה רגע.","״הוא נראה שוב.״","דוד חזר על המילים.","״הוא נראה שוב?״","״כן.״","״מה זאת אומרת?״","״שהוא לא עובר לידנו כמו רוח. יש מישהו בבית הספר שמחכה לו. יש לו מדריך אחר הצהריים. כשמשהו משתנה, מישהו שואל.״","״והחבורה?״","״הוא עדיין מכיר אותם.״","דוד שתק.","״אז לא פתרנו.״","ענת נשפה.","״דוד, אתה חייב להפסיק לדבר ככה.״","״איך?״","״כאילו או שהילד ניצל או שנכשלנו.״","הוא שתק.","״הוא בן חמש־עשרה. אין לו סוף פרק.״","דוד הסתכל על המחברת.","אין לו סוף פרק.","הוא כמעט כתב את המשפט.","בסוף לא.","* * *","ישיבת הסיכום הראשונה התקיימה כמעט ארבעה חודשים אחרי תחילת הפיילוט.","הפעם לא היו עוגיות.","מישהו שכח להזמין.","עמית אמר שזה כנראה הסימן הראשון לכך שהתוכנית הפכה אמיתית.","על הלוח כתב דוד שלוש כותרות:","מה עבד.","מה לא עבד.","מה משנים.","הם עברו מקרה־מקרה.","שמונה־עשר נערים ונערות עלו לאורך התקופה.","בחלק מהמקרים התברר שאין צורך בהתערבות מיוחדת.","בחלקם נפתח טיפול מסודר.","שניים סירבו לכל קשר.","במקרה אחד נאלצו להפסיק שיתוף מידע אחרי שהורה התנגד.","בשלושה מקרים הצוות המקומי זיהה שהמידע הגיע מאוחר מדי.","איתי היה אחד מארבעה מקרים שבהם כולם הסכימו שהחיבור המוקדם בין האנשים שינה את התגובה.","נועם הופיע בטבלה אחרת.","דוד הסתכל על השם שלו.","״אנחנו צריכים להשאיר אותו פה?״","ליאת הסתכלה עליו.","״ברור.״","״גם אם זה לא הצליח?״","״בעיקר אם זה לא הצליח.״","הם עברו שוב על מה שקרה.","לא כדי למצוא אשמים.","כדי להבין.","החשש עלה מאוחר יחסית.","לא היה אדם אחד שהיה ברור שהוא מחזיק את הרצף.","הם הציעו לנועם כמה דברים מהר מדי.","לא שאלו מספיק מה הוא עצמו רוצה.","ומצד שני- גם אחרי כל הניתוח, איש לא יכול היה להגיד בביטחון שאילו היו פועלים אחרת, הסוף היה משתנה.","דוד לא אהב את זה.","הוא רצה לקח.","משפט.","דבר שאפשר לקחת למקרה הבא.","עמית הבחין בו.","״מה מפריע לך?״","״שאני לא יודע מה הלקח.״","״יש כמה.״","״אבל אין אחד.״","עמית חייך.","״אתה עדיין מחפש אחד?״","דוד צחק.","״כנראה.״","* * *","אחרי שעתיים הלוח כבר היה מלא.","מה עבד:","מבוגר אחד שמחזיק רצף.","שיחות קצרות ולא פורמליות.","אנשי נוער שמכירים את הילד מחוץ לבית הספר.","תחושת בטן של מורה שלא נפסלת רק כי אין עדיין נתון.","מה לא עבד:","ישיבות קבועות גם כשאין צורך.","ניסיון לרכז יותר מדי מידע.","העברה מאוחרת של חשש.","הצעות פתרון לפני ששואלים את הנער.","ומה משנים:","פחות מנגנון.","יותר אחריות.","פחות מידע.","יותר קשר.","פחות ניסיון לקבוע מי ״בסיכון״.","יותר תשומת לב לשינוי.","דוד הסתכל על הרשימה.","ערן אמר:","״שמת לב שהמערכת שאנחנו מסיימים איתה הרבה יותר קטנה מזו שתכננו?״","״כן.״","״וזה אחרי ארבעה חודשים עבודה.״","מיכל חייכה.","״אולי הצלחנו.״","כולם צחקו.","* * *","אחרי הישיבה דוד נשאר עם עמית.","הם התחילו למחוק את הלוח.","״אז מה אתה חושב?״ שאל דוד.", ם כל עוד אתה לא הופך אותי ליועץ מבוגר שיושב בפינה ואומר 'מניסיוני'.״","״מה אתה רוצה להיות?״","״האיש שמזכיר לכם שיש ממשלה, תקציב, חוק, אנשים עם אגו, ומערכות שלא זזות כי ביקשת יפה.״","״מתאים.״","״ואני לא עובד אצלך.״","״ברור.״","״אני רוצה את זה בפרוטוקול.״","מיכל הייתה פשוטה יותר.","״כן,״ אמרה.","דוד הופתע.","״זהו?״","״מה רצית, משא ומתן?״","״אני פשוט רגיל שמתן ועמית מקשים.״","״גם אני אקשה. פשוט אחר כך.״","״למה כן?״","מיכל חשבה.","״כי בפיילוט קרה משהו שאני כמעט לא רואה. אנשים הפסיקו להגן על המערכת שלהם והתחילו לדבר על הילד.״","דוד שתק.","״זה לא קרה כל הזמן,״ היא הוסיפה. ״אבל כשהוא קרה, זה היה שווה.״","״אז את חושבת שאפשר לעשות את זה בעוד מקומות?״","״אני חושבת שצריך לבדוק.״","דוד חייך.","״את כבר מדברת כמו עמית.״","״אל תגיד לו.״","ערן לקח יותר זמן.","״אני רוצה להיות ברור,״ אמר.","״תהיה.״","״אני לא רוצה להיות איש הטכנולוגיה שלכם.״","״מה זאת אומרת?״","״שכל פעם שמישהו אומר 'צריך מערכת', מסתכלים עליי.״","דוד צחק.","״זה די טבעי.״","״לא. זה עצלני. לפעמים לא צריך מערכת. בפיילוט למדנו את זה.״","״אז למה אתה כן רוצה להצטרף?״","״כי אני חושב שאפשר לבנות דרך עבודה. לפעמים טכנולוגיה תעזור. לפעמים לא. אבל מישהו צריך לשאול מה אפשר למדוד, מה אפשר לזכור, ומה הולך לאיבוד.״","דוד הנהן.","״בדיוק.״","״ואם אתה רוצה שאבנה אפליקציה לפני שיש בעיה ברורה, אני בחוץ.״","״סיכמנו.״","האדם החמישי היה חדש. עמית חיבר ביניהם. שמו היה ניר.","בן ארבעים וארבע, בעבר מנהל תפעול בפרויקט ציבורי גדול, אחר כך ניהל תוכניות מורכבות שחיברו בין רשויות, ממשלה וגופים פרטיים.","עמית תיאר אותו במשפט אחד:","אם אתה רוצה שמישהו יהפוך רעיון לטבלת משימות שאנשים באמת עושים -דבר איתו.","דוד קצת חשש מהפגישה.","ניר לא נראה כמו אדם שמתלהב מחזונות.","הוא הגיע בזמן, הניח מחברת קטנה על השולחן ושאל:","״מה אתה רוצה לבנות?״","דוד התחיל להסביר.","אחרי שתי דקות ניר עצר אותו.","״לאן אתה רוצה להגיע בשנה הקרובה?״","דוד שתק.","״אני עדיין בודק.״","״בסדר. אז מה אתה רוצה לדעת בעוד שנה שאתה לא יודע היום?״","דוד חייך.","״זו שאלה טובה.״","״אני יודע.״","״אני רוצה לדעת אם הדרך שעבדנו בה עם הנוער יכולה לעבוד גם בתחומים אחרים.״","״כמה?״","״שניים נוספים.״","״איזה?״","״עוד לא החלטנו.״","ניר כתב.","״מי מחליט?״","דוד שתק שוב. ניר הרים אליו מבט.","״אני מבין למה עמית שלח אותי.״","״למה?״","״כי אין לכם עדיין מי ששואל שאלות מעצבנות על אחריות.״","״יש לנו מתן.״","״לא אותו סוג.״","דוד צחק. ניר המשיך.","״אני לא איש חזון. אם אתה רוצה מישהו שיתרגש מ־2048, אני כנראה לא הבן אדם. אבל אם תחליטו מה עושים בחודש הקרוב, אני יכול לעזור לכם לגרום לזה לקרות.״","דוד ידע מיד שהוא רוצה אותו בצוות.","דווקא משום שהיה כל כך שונה ממנו.","הפגישה הראשונה של הצוות התקיימה בערב, בחדר ישיבות קטן שעמית השיג.","שישה אנשים. דוד. מתן. עמית. מיכל. ערן. ניר. לא היה לוגו. לא היה שם. לא הייתה מצגת. דוד הכין דף אחד. בראשו כתב:","לאן אנחנו הולכים?","ומתחת:","לבנות דרך שמאפשרת לאנשים ממערכות שונות ללמוד יחד סביב בעיות אמיתיות -לנסות, למדוד, לתקן ולשתף את מה שנלמד.","ניר קרא.","״ארוך.״","מתן חייך.","״אני כבר אוהב אותו.״","דוד התעלם.","״לא מדובר עדיין בארגון. לא במרכז. לא במוסד בירושלים. אנחנו בודקים אם יש כאן דרך עבודה שאפשר לחזור עליה.״","ערן שאל:","״ומה אנחנו לא עושים?״","דוד הסתכל עליו.","״זו שאלה טובה.״","עמית אמר:","״תכתוב. זה חשוב יותר ממה כן.״","דוד ניגש ללוח.","״לא מקימים גוף חדש.״","מיכל הוסיפה:","״לא בונים מערכת טכנולוגית לפני שיש צורך.״","מתן:","״לא מוכיחים בכוח שהרעיון עובד.״","עמית:","״לא עושים כנס רק כדי להגיד שעשינו משהו.״","ניר:","״ולא פותחים יותר משני ניסויים במקביל.״","דוד כתב.","״למה?״ שאל ערן.","״כי אם אתם רוצים ללמוד, אתם צריכים גם זמן להסתכל על מה שקורה. אם תפתחו עשרה דברים, תהיו עסוקים בלנהל אותם ולא בללמוד מהם.״","דוד הנהן.","אחר כך הגיעו לדבר על התחומים.","הבריאות הייתה בחירה כמעט טבעית.","כבר היו להם קשרים עם אלון ועם עידו, והיה ברור שיש שם חיבור מעניין בין מקצועות, מערכות וניסיון בינלאומי.","התחום השני עורר ויכוח. עמית הציע רשויות מקומיות.","מיכל חשבה דווקא על חירום אזרחי.","ערן רצה נושא שבו יהיה אפשר למדוד תוצאה במהירות.","מתן שאל למה הם בכלל חייבים לבחור תחום עכשיו.","ניר הסתכל על דוד.","״אתה מוביל. תחליט.״","דוד נרתע כמעט אינסטינקטיבית.","״למה אני?״","״כי צוות לא אומר שאין מנהיג.״","החדר שתק. ניר המשיך.","״אתה לא צריך לדעת יותר מכולם כדי לקבל החלטה. שמעת את כולם. עכשיו צריך כיוון.״","דוד הסתכל על הלוח. בריאות הייתה ברורה.","הוא חשב על החודשים האחרונים, על החירום, על מה שישראל ידעה לעשות תחת לחץ ועל מה שהיא התקשתה להפוך לשיטה.","״חירום אזרחי,״ אמר.","מיכל הנהנה. עמית לא אמר כלום. ערן שאל:","״למה?״","״כי שם יש לנו גם יתרון וגם חולשה. אנחנו יודעים להגיב מהר, לאלתר, לקחת אחריות. אבל הרבה פעמים אנחנו לא מספיק טובים בלשמור את מה שלמדנו ולהפוך אותו למערכת. אם אנחנו רוצים לבדוק את המודל שלנו, זה מקום טוב להתחיל ממנו.״","ניר כתב במחברת.","״אז יש לנו שני תחומים.״","בריאות. חירום אזרחי.","ופתאום זה התחיל להרגיש אמיתי.","באמצע הישיבה התפתח ויכוח ראשון.","ערן רצה להתחיל ממיפוי דיגיטלי של גופים וידע.","מיכל חשבה שזה מוקדם מדי.","עמית אמר שאף משרד לא ישתף מידע לפני שיהיה לו ברור מה יוצא לו מזה.","מתן טען שהם כבר מתחילים לדבר על מערכת במקום על בעיה.","דוד הקשיב.","לפני כמה חודשים היה מנסה לפתור את הוויכוח.","עכשיו ניסה משהו אחר.","״מה המטרה שלנו בשלושת החודשים הקרובים?״ שאל.","החדר השתתק. ניר חייך קלות. דוד המשיך.","״לא לבנות מערכת. לא לשכנע משרד. המטרה היא למצוא בעיה אחת אמיתית בכל תחום ולבנות סביבה צוות שיכול לנסות משהו. נכון?״","מיכל הנהנה. ערן נשען לאחור.","״אז המיפוי צריך לשרת את זה, לא להיות פרויקט בפני עצמו.״","״בדיוק.״","דוד הרגיש משהו קטן משתנה בו.","הוא לא נתן תשובה מקצועית.","הוא פשוט החזיר את האנשים לכיוון.","לקראת סוף הפגישה ניר סיכם.","״בריאות -דוד ועמית בודקים עם מי מתחילים. חירום -מיכל ואני ממפים שלוש בעיות אפשריות. ערן בודק איזה מידע כבר קיים ולא בונה כלום.״","ערן חייך.","״תודה על ההבהרה.״","״מתן-״","ניר הסתכל עליו.","״מה בדיוק אתה עושה?״","מתן נשען לאחור.","״אני עוד לא יודע.״","״מצוין. משימה ראשונה: תבין.״","כולם צחקו. מתן הסתכל על דוד.","״אתה בטוח שאנחנו צריכים אותו?״","״לגמרי.״","כשהישיבה הסתיימה הם נשארו עוד כמה דקות בחדר.","דוד הסתכל על האנשים שאספו את הדברים.","הוא ידע שאף אחד מהם לא היה בוחר בדיוק את החזון שהוא עצמו דמיין בתחילת הדרך.","מתן היה חותך ממנו חצי.","עמית היה מוציא ממנו כל דבר שלא יכול לשרוד ממשלה.","מיכל הייתה בודקת אם הוא בכלל עובד בשטח.","ערן היה שואל איפה הנתונים.","ניר היה הופך כל משפט לרשימת אחריות ותאריך.","וזה היה בדיוק העניין.","אם הוא היה בוחר חמישה אנשים שחושבים כמוהו, כנראה היה לו נעים יותר.","אבל לא היה לו צוות.","בדרך החוצה עמית הלך לידו.","״איך אתה מרגיש?״","״טוב.״","״רק טוב?״","דוד חשב.","״קצת פחות בשליטה.״","עמית חייך.","״מצוין.״","״אתה ממש אוהב את המילה הזאת.״","״כי עכשיו אנשים אחרים מחזיקים חלק מהדבר. אתה כבר לא יכול לקום בבוקר ולשנות הכול לבד.״","דוד הנהן.","״זה מפחיד קצת.״","״זו שותפות.״","הם הגיעו לחניה.","״אבל תזכור,״ אמר עמית, ״צוות טוב לא פוטר אותך מהתפקיד שלך.״","״איזה?״","״להגיד לאן הולכים.״","״גם אם אני לא יודע איך מגיעים?״","״בעיקר אז.״","בבית דוד פתח קבוצת וואטסאפ חדשה.","הוא הגיע לשדה של שם הקבוצה.","כתב:","צוות ירושלים","הסתכל. מחק. כתב:","ישראל 2048","מחק גם את זה. אחרי כמה שניות כתב:","צוות עבודה","הוסיף את כולם.","כעבור פחות מדקה הגיעה ההודעה הראשונה.","מתן:","איזה שם מעורר השראה.","ערן הוסיף:","צריך לוגו.","ניר:","לא צריך לוגו.","מיכל:","אני כבר אוהבת את ניר.","דוד חייך מול המסך. יעל עברה מאחוריו.","״מה אתה מחייך?״","״יש לי צוות.״","היא עצרה.","״באמת?״","דוד הסתכל שוב על השמות.","״נראה לי שכן.״","יעל הציצה במסך.","״'צוות עבודה'?״","״אל תתחילי.״","היא חייכה והמשיכה.","דוד נשאר עוד רגע עם הטלפון ביד.","הוא חשב על המשפט שכתב בפרק הקודם במחברת.","התפקיד שלו אינו לדעת את כל הדרך.","אולי חזון הוא משהו אחר.","לדעת מספיק בבירור לאן רוצים להגיע, כדי שאנשים טובים יוכלו למצוא יחד את הדרך.","ועכשיו, לראשונה, הוא לא היה צריך לרוץ אל העתיד לבד.","היה לו מישהו לרוץ איתו."],"chars":10306},{"id":"ch15","title":"פרק 15 -שני צעדים קדימה","parts":["הישיבה הראשונה של “צוות עבודה” נפתחה באיחור של שבע דקות.","לא בגלל החלטה עקרונית, אלא מפני שניר התעקש לחכות למיכל שהייתה בדרך מפגישה ברשות, ועמית אמר שאם הם רוצים ללמוד לעבוד עם המערכת הציבורית, כדאי שיתרגלו לכך שאנשים מגיעים מחיים אמיתיים ולא מתוך לוח זמנים סטרילי.","דוד דווקא אהב את זה.","לפני כמה חודשים הוא עוד היה מגיע לפגישות כאלה עם תחושה שכל דבר צריך להיראות נכון כדי להיות רציני. עכשיו הוא כבר ידע שהדברים הרציניים באמת נראים לעיתים קרובות הרבה פחות מרשימים.","על הלוח היו שלושה נושאים:","נוער.   בריאות.   חירום אזרחי.","הראשון כבר היה מאחוריהם, לפחות בשלב הראשון.","השניים האחרים עוד היו כמעט ריקים.","ניר עמד מול הלוח.","״אני רוצה שנתחיל ממשהו לא מלהיב,״ אמר.","מתן הסתכל עליו.","״אתה באמת האיש המתאים לצוות הזה.״","ניר התעלם.","״לכל אחד משני התחומים אנחנו צריכים בעיה אחת. לא תחום גדול, לא חזון, לא כותרת. בעיה. משהו שאפשר להצביע עליו ולהגיד: כאן אנחנו מאבדים משהו.״","דוד הנהן.","״בבריאות יש לי כיוון.״","״מה?״","״מעבר מבית חולים לקהילה.״","עמית הסתכל עליו.","״רחב מדי.״","״מטופלים מורכבים שמשתחררים מבית חולים, אבל הרצף בין בית החולים, הקופה, השיקום והמשפחה לא תמיד עובד.״","ניר כתב.","״יותר טוב.״","ערן שאל:","״יש נתונים?״","מתן חייך.","״הגענו לדקה שלוש.״","ערן הסתכל עליו.","״מה?״","״ידעתי שתשאל.״","״בשביל זה אני פה.״","״וגם אני.״","דוד הרים יד.","״רגע. לפני נתונים, אני רוצה להבין את הבעיה. אלון אמר לי שיש מטופלים שיוצאים מבית החולים אחרי אירוע משמעותי, ובית החולים מבחינתו סיים את החלק שלו. מבחינה רפואית אולי הכול ברור, אבל המשפחה מגיעה הביתה ופתאום אין לה מושג מי אחראי על מה.״","מיכל הנהנה.","״זה לא רק בריאות. זה כמעט כל מערכת. ברגע שאדם עובר בין גופים -שם הוא נופל.״","עמית הסתכל על דוד.","״וזה דווקא מעניין אותנו.״","״למה?״","״כי אנחנו לא מחפשים בעיה רפואית. אנחנו מחפשים בעיה של חיבור.״","דוד חייך.","״בדיוק.״","ניר כתב על הלוח:","בריאות -רצף אחרי שחרור.","ואז עבר לשורה השנייה.","״חירום?״","מיכל נשענה קדימה.","״שם הבעיה ברורה מדי.״","״זה משפט חשוד,״ אמר מתן.","״אני רצינית. באירוע חירום כולם עובדים. כולם יודעים לעשות דברים. אנשים מאלתרים. פותחים חמ״ל, מגייסים מתנדבים, מוצאים ציוד, מחברים קבוצות ווטסאפ. הבעיה מתחילה אחרי.״","ערן שאל:","״אחרי מה?״","״אחרי שהאירוע נרגע.״","מיכל דיברה מתוך ניסיון, ודוד ראה את זה. הקצב שלה השתנה.","״בזמן האירוע מישהו ממציא פתרון מעולה להסעות, מישהו אחר בונה דרך לחלק ציוד, מישהו מגייס מאה מתנדבים תוך שעה. שבוע אחר כך כולם חוזרים לעבודה. חודש אחר כך אף אחד לא זוכר בדיוק איך זה קרה. ובאירוע הבא ממציאים הכול מחדש.״","דוד הסתכל על הלוח.","״אז הבעיה היא זיכרון. שוב.״","״זיכרון ותרגום,״ אמר עמית. ״כי גם אם אתה זוכר, לא בטוח שאתה יודע להפוך אלתור של אדם מסוים לדבר שאחרים יכולים להשתמש בו.״","ניר כתב:","חירום -להפוך אלתור מוצלח לידע שנשמר.","מתן קרא את המשפט.","״זה כבר נשמע כמו משהו ששווה לבדוק.״","הבריאות הייתה הראשונה לזוז.","אלון חיבר אותם למחלקה בבית חולים גדול. לא למחקר, לא לוועדה ולא ל״מרכז מצוינות״. למחלקה פנימית אחת שבה השתחררו מדי חודש עשרות מטופלים מבוגרים ומורכבים.","חלקם יצאו מבית החולים עם רשימת תרופות חדשה, הפניות, בדיקות, המלצות לשיקום, צורך במעקב ומספר טלפונים.","על הנייר הכול היה מסודר.","במציאות, התמונה הייתה אחרת.","הם פגשו את רחל, בת שבעים ושתיים, שהתאוששה מאירוע מוחי קל.","בבית החולים היה ברור מה צריך לקרות.","פיזיותרפיה. מעקב נוירולוגי. איזון תרופות. בדיקת רופא משפחה. התייחסות ללחץ דם. המשך תרגול בבית.","הבת שלה, דנה, ישבה מול דוד ואמרה:","״אני קיבלתי דף עם ארבעה מספרים ושש משימות. לא ידעתי מה קודם.״","״לא הסבירו?״","״הסבירו. בחדר. ביום השחרור. אחרי שבוע וחצי שלא ישנתי. אני בטוחה שהאחות הייתה מצוינת. אני פשוט לא זוכרת חצי ממה שהיא אמרה.״","״ומה קרה אחר כך?״","״התקשרתי לקופת חולים. אמרו לי לקבוע תור. התקשרתי לפיזיותרפיה. התור היה בעוד שלושה שבועות. רופא המשפחה לא ראה עדיין את סיכום האשפוז במערכת. אחרי יומיים אמא שלי הייתה חלשה מאוד ולא ידעתי אם זה בגלל התרופות או שזה משהו חדש.״","״למי התקשרת?״","דנה צחקה.","״לכולם.״","״ומי ענה?״","״בסוף? מוקד של בית החולים אמר לי ללכת למיון.״","רחל חזרה למיון. לא בגלל אירוע חדש. בגלל בלבול סביב התרופות.","דוד שמע כבר סיפורים דומים בעבר, אבל הפעם הוא לא ניסה להבין מי אשם.","זו כבר הייתה התקדמות. הוא שאל:","״מי ראה את כל התמונה?״","דנה הסתכלה עליו.","״אני.״","זו הייתה תשובה חזקה מדי.","המערכת הייתה מלאה באנשי מקצוע, וכל אחד מהם ידע יותר מדנה בתחום שלו.","אבל האדם היחיד שראה את כל המעבר היה דווקא בן המשפחה.","הם אספו עוד כמה מקרים.","לא כולם היו דרמטיים. וזה היה חשוב. מטופל אחד פספס ביקורת.","אישה אחרת לא הבינה שהחליפו לה תרופה.","משפחה שלישית קיבלה שתי הנחיות שנראו סותרות משני גופים שונים.","בכל פעם דוד ראה את אותו דפוס.","בית החולים לא היה גרוע.","הקופה לא הייתה גרועה. השיקום לא היה גרוע. האנשים היו טובים. הבעיה הייתה בין הדברים.","אלון ישב איתם בפגישה הראשונה.","״יש פה סכנה,״ אמר.","״איזו?״ שאל דוד.","״שתבנו עכשיו תפקיד חדש. 'מתאם מעבר'.״","ניר חייך.","״חשבנו על זה.״","״ברור שחשבתם. כולם חושבים על זה. ואז צריך תקנים. ואז צריך להחליט מי משלם. ואז כל גוף אומר שזה לא בתחום האחריות שלו.״","ערן שאל:","״אז מה האלטרנטיבה?״","אלון משך בכתפיו.","״לא יודע. בשביל זה אתם פה.״","מתן הסתכל על דוד.","״איזה כיף, סוף סוף מישהו אחר אומר לך את זה.״","אנה מהולנד הצטרפה בזום לפגישה השנייה.","הפעם דוד כבר לא הציג אותה כמי שבאה ללמד אותם.","הוא אמר רק:","״אנה עבדה אצלם על בעיה דומה. אני רוצה שנשמע מה הם ניסו ומה לא עבד.״","אנה סיפרה על מערכת שבה אדם אחד נשאר בקשר עם המטופל בשבועות הראשונים אחרי השחרור.","מיכל שאלה:","״עובד של בית החולים?״","״לפעמים.״","״קופה?״","״לפעמים.״","״אז מי?״","אנה חייכה.","״זו הייתה בדיוק הבעיה שלנו. בהתחלה ניסינו להחליט מי בעל התפקיד הנכון. אחר כך הבנו שהשאלה החשובה היא לא איפה הוא עובד, אלא אם למטופל ברור מי האדם שהוא מתקשר אליו.״","דוד הרים את הראש. זה נשמע מוכר. נועם. איתי. המבוגר שמחזיק רצף.","עכשיו אותו רעיון הופיע במקום אחר לגמרי.","אבל מתן, שישב לידו, לחש:","״אל תתחיל.״","דוד הסתכל עליו.","״מה?״","״אני רואה את הפנים שלך. לא גילית חוק טבע.״","דוד חייך.","״לא אמרתי כלום.״","״בדיוק. אני מונע.״","הניסוי שהם בנו היה קטן בכוונה.","חמישים מטופלים מורכבים. במשך חודשיים.","במקום לנסות לשנות את כל מערכת השחרור, הם עשו דבר פשוט יחסית.","לפני השחרור, המטופל והמשפחה קיבלו דף אחד בלבד.","לא עשרה. בדף היה כתוב:","מה צריך לקרות בשבוע הקרוב.","מי אחראי על כל שלב.","ובעיקר -שם אחד ומספר אחד של אדם שאמור לוודא שהמעבר אכן קורה.","לא בהכרח רופא. לא בהכרח אחות. לעיתים אחות קשר. לעיתים מתאמת מטעם הקופה.","אבל אדם אחד שהמשפחה יודעת לפנות אליו.","ערן בנה מערכת קטנה שתאפשר לעקוב אחרי המשימות.","ניר אסר עליו לקרוא לה ״מערכת״.","״זה טופס עם התראות,״ אמר.","״זה יותר מזה.״","״כרגע זה טופס עם התראות. אם בעוד חצי שנה הוא יהיה משהו אחר, נדבר.״","ערן התלונן. אבל הוא בנה אותו.","אחרי חודשיים לא הייתה מהפכה.","שני מטופלים עדיין חזרו למיון.","חלק מהמשפחות לא ענו לטלפונים.","במקרה אחד האדם שהיה אמור להחזיק את הרצף יצא לחופשה והמערכת כמעט שוב נפלה בין הכיסאות.","אבל היו גם תוצאות אחרות.","יותר ביקורות נקבעו בזמן.","פחות משפחות התקשרו למספרים שונים בלי לדעת למי לפנות.","ובכמה מקרים זוהו בעיות תרופתיות לפני שהפכו לאירוע.","דוד לא ידע אם זו הצלחה.","ערן רצה נתונים גדולים יותר.","ניר אמר שהם עדיין קטנים מדי בשביל מסקנות.","אלון אמר שהדבר הכי חשוב מבחינתו הוא שמשפחות הפסיקו להגיד ״אני לא יודע למי להתקשר״.","אנה אמרה:","״עכשיו תשנו שוב.״","דוד חייך.","פעם היה מצפה ממנה לומר ״כל הכבוד״.","עכשיו דווקא המשפט הזה נשמע לו יותר נכון.","בחירום הדברים היו שונים לגמרי.","שם לא היה מטופל אחד, ולא הייתה שרשרת מסודרת.","הכול היה מהיר. מבולגן. חי.","הרשות שמיכל עבדה איתה קיימה תרגיל חירום גדול.","תרחיש של פגיעה בתשתיות, שכונות מנותקות לזמן מוגבל, צורך בפינוי אוכלוסייה, פתיחת מרכזי קליטה וחלוקת ציוד.","דוד הגיע בבוקר עם ניר וערן.","כבר אחרי עשרים דקות הוא הרגיש בבית.","הקצב. הטלפונים. ההחלטות.","אנשים שקמו בלי שיבקשו מהם.","מתנדב אחד גילה שהמשאיות שתוכננו להעברת ציוד לא יכולות להגיע לאחד האזורים, ובתוך רבע שעה חיבר שלושה בעלי רכבי שטח מקומיים.","רכזת קהילה הבינה שהרשימה של קשישים שזקוקים לסיוע לא מעודכנת, ובמקום לחכות למאגר מסודר פתחה קבוצה עם ועד הבית, בית הכנסת ומועדון הגמלאים ותוך פחות משעה הייתה לה רשימה טובה יותר.","אדם אחר בנה לוח מאולתר על קיר עם מדבקות צבעוניות כדי לעקוב אחרי משפחות שפונו.","ערן הסתכל.","״כל מה שהם עושים פה אפשר היה לבנות מראש.״","מיכל עמדה לידו.","״נכון.״","״אז למה לא בנו?״","״כי עד הבוקר לא ידענו שאנחנו צריכים בדיוק את הדברים האלה.״","״אבל עכשיו יודעים.״","״בדיוק.״","דוד הסתכל עליהם. זה היה הדבר.","האלתור לא היה כשל של המערכת.","לפעמים הוא היה הדרך שבה המערכת גילתה מה היא צריכה.","בסוף התרגיל כולם התכנסו לתחקיר.","אנשים היו עייפים. חלק רצו ללכת הביתה.","הקצין שניהל את התרגיל עבר לפי סעיפים.","מה עבד. מה לא עבד. פערים. משימות להמשך. דוד הקשיב. הכול היה נכון. אבל משהו הפריע לו. הוא הרים יד.","״אפשר לשאול משהו?״","״בטח.״","״מה יקרה עם שלושת האלתורים הכי טובים שראינו היום?״","האחראי הסתכל עליו.","״נכניס אותם ללקחים.״","״ואז?״","״נטמיע.״","דוד חייך.","״איך?״","האיש שתק. מיכל הסתכלה על דוד.","היא כבר ידעה לאן הוא הולך.","״אני רציני,״ המשיך. ״הרשימה של הקשישים שנבנתה דרך הקהילה. רכבי השטח. הלוח המאולתר. האם באירוע הבא מישהו במקום אחר יידע שזה עבד?״","מישהו מאחור אמר:","״זה יהיה בסיכום.״","דוד הסתובב.","״כמה סיכומי תרגילים של רשויות אחרות קראתם לפני התרגיל הזה?״","אף אחד לא ענה. החדר צחק מעט. לא בזלזול. בהבנה. אחרי התרגיל הצוות נשאר. דוד כתב על הלוח:","איך שומרים אלתור בלי להרוג אותו?","מתן קרא.","״זה דווקא טוב.״","״תודה.״","״אל תתרגש.״","ניר אמר:","״הבעיה היא שאנחנו תמיד רוצים להפוך הצלחה לנוהל.״","ערן שאל:","״ומה רע בזה?״","״כי חלק מההצלחה הייתה תלויה באדם, בזמן, במקום ובנסיבות. אם נכתוב נוהל של ארבעה עמודים, יכול להיות שבאירוע הבא הוא רק יפריע.״","מיכל הוסיפה:","״אבל אם לא נכתוב כלום, אנחנו מתחילים שוב מאפס.״","דוד נשען על הכיסא.","״אז אולי לא צריך לשמור את הפתרון.״","״מה כן?״ שאל ערן.","״את העיקרון.״","כולם הסתכלו עליו.","״למשל רכבי השטח. לא צריך לכתוב 'בכל אירוע יש להזמין שלושה ג'יפים'. צריך לשמור את ההבנה שאם ציר מרכזי נחסם, צריך מראש לדעת מי בקהילה מחזיק כלי רכב שיכולים לנוע בתנאים אחרים.״","מיכל הנהנה.","״והרשימה של הקשישים?״","״לא 'פותחים קבוצת ווטסאפ עם בית הכנסת'. אלא להבין שמידע קהילתי חי לפעמים אצל אנשים ולא במאגר הרשמי.״","ערן כתב משהו.","״אז אנחנו בונים ספריית עקרונות?״","ניר הסתכל עליו.","״אמרנו שלא בונים עדיין.״","״אני רק שואל.״","מתן חייך.","״ערן הוא כמו דוד לפני חצי שנה. הוא חייב לתת שם לכל דבר.״","דוד צחק.","הם החליטו על ניסוי פשוט.","אחרי כל אירוע או תרגיל משמעותי, לא לכתוב רק ״לקחים״.","לבחור שלושה דברים שקרו טוב באופן לא מתוכנן.","לכל אחד מהם לענות על ארבע שאלות:","מה הייתה הבעיה? מה עשינו? למה זה עבד?","איזה עיקרון אפשר לקחת למקום אחר?","זה הכול.","לא דוח של שלושים עמודים.","לא נוהל חדש. ארבע שאלות.","אחרי חודש הצטברו עשרות מקרים.","חלק היו חסרי ערך.","חלק היו כל כך תלויי מקום שלא היה אפשר לעשות איתם דבר.","אבל כמה מהם עברו לרשויות אחרות.","באחת מהן אימצו מראש את הרעיון של מיפוי אנשים בקהילה שמחזיקים ציוד ויכולת תנועה.","ברשות אחרת שינו את הדרך שבה הם בונים תמונת מצב של אוכלוסיות פגיעות.","דוד הסתכל על זה והבין שהם לא
