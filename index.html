צוות שמע על הרעיון, ההתלהבות לא הייתה אחידה.","מיכל חשבה שזה בדיוק השלב הבא.","ערן שאל מיד איזה מידע צריך להכין.","ניר רצה לדעת מי מגיע, כמה זמן יש ומה אמור להיות התוצר.","מתן שאל שאלה אחת.","״למה אנחנו עושים כנס?״","״לא כנס,״ אמר דוד.","״איך קוראים לזה?״","״יום עבודה.״","״כמה אנשים?״","״בערך עשרים.״","״יש תגי שם?״","״כנראה.״","״אז זה כנס.״","דוד חייך.","״בסדר. כנס קטן.״","״ומה אמור לקרות בו?״","השאלה עצרה את החדר. ניר הסתכל על דוד.","דוד כבר הכיר את הרגע הזה. פעם היה מנסה לנסח משהו מרשים. עכשיו ניסה להיות מדויק.","״אני רוצה לבדוק איך אותה בעיה נראית במקומות שונים.״","״איזו בעיה?״ שאל מתן.","דוד חשב לרגע.","״מה קורה לקהילה בשעות הראשונות של אירוע חירום, לפני שכל המערכות הגדולות מספיקות להגיע או להתארגן.״","מיכל הנהנה.","״זה טוב.״","ערן שאל:","״ומה אנחנו רוצים ללמוד?״","״כמה אחריות קהילה יכולה לקחת על עצמה. איפה היא עוזרת למערכות, איפה היא מפריעה, ואיך זה משתנה ממדינה למדינה.״","מתן נשען לאחור.","״ככה אני מוכן להגיע.״","״תודה על האישור.״","״בשמחה.״","הם קיימו את היום בירושלים.","עמית הציע מלון. דוד התנגד.","בסוף מצאו מרכז ציבורי לא גדול, עם חדר ישיבות רחב, חצר פנימית וקירות אבן ירושלמיים שאף אחד לא תכנן במיוחד כדי להיראות ירושלמיים.","הגיעו עשרים ושלושה אנשים.","שלושה נציגים מארצות הברית, מתחומים שונים של ניהול חירום מקומי. שניים מהולנד. נציגים מגרמניה ומאיטליה. אישה מספרד שעבדה עם רשויות באזורים שנפגעו משיטפונות. איש מקצוע מאסיה שהיה מעורב בשיקום קהילות אחרי רעידות אדמה ואסונות טבע.","ומצד ישראל הגיעו מנהלי חירום ברשויות ובמועצות, ראשי צוותי חירום יישוביים, אנשי קהילה ומתנדבים, לצד נציגים מכבאות, משטרה ורווחה.","דוד התעקש כבר בהזמנה על דבר אחד:","הם לא באו לדבר על מלחמה.","על הלוח הוא כתב:","חירום אזרחי אינו רק אויב.","ומתחת:","רעידת אדמה   שיטפון   שריפה   קריסת מבנה   הפסקת חשמל ממושכת   קריסת תקשורת   משבר מים   אירוע תעשייתי   גל חום","אחד האמריקאים, מייק, הסתכל על הרשימה.","״אפשר להוסיף הוריקן.״","דוד הוסיף. האיטלקייה אמרה:","״ומפולת.״","ערן כתב גם אותה. מתן התקרב לדוד.","״בקצב הזה תיגמר לנו הלוח לפני שנתחיל.״","דוד חייך.","אבל זו בדיוק הייתה הנקודה.","אותה מילה -חירום -פתחה בפני כל אחד מהם מציאות אחרת.","מיכל פתחה בתיאור של מערכי החירום המקומיים בישראל.","לא כמודל מושלם ולא כהמצאה ישראלית שצריך לייצא.","כמערכת שהתפתחה במשך שנים מתוך צורך.","״ביישובים ובקהילות מסוימים יש אנשים שמכירים מראש את השטח ואת האוכלוסייה. מי מבוגר, מי זקוק לעזרה, מי מחזיק ציוד, מי מסוגל להפעיל מתנדבים, מי מכיר את המשפחות ואת הרחובות. בזמן אירוע הם לא מחכים שכל הידע יגיע מלמעלה.״","מייק שאל:","״מי נותן להם סמכות?״","מיכל חייכה.","״זו שאלה מאוד אמריקאית.״","החדר צחק.","״אני רציני,״ אמר.","״גם אני. בחלק מהמקומות הסמכות מוגדרת היטב. בחלק היא נובעת מהתפקיד המקומי. ולפעמים, בזמן אירוע, אנשים פשוט מתחילים לפעול כי מישהו צריך לפעול.״","מייק הסתכל עליה.","״וזה לא יוצר כאוס?״","״לפעמים כן.״","״אז למה זה טוב?״","״כי לפעמים האלטרנטיבה היא לחכות.״","אנה מהולנד התערבה.","״אצלנו מתנדב מקומי בדרך כלל פועל בתוך מסגרת מאוד ברורה.״","מיכל הנהנה.","״אצלנו לפעמים המסגרת נוצרת תוך כדי האירוע.״","״זה בדיוק מה שמפחיד אותי.״","״וזה בדיוק מה שמציל אותנו לפעמים.״","החדר השתתק לרגע. דוד הסתכל סביב.","הוא לא היה צריך לייצר את החיכוך.","הוא כבר היה בחדר.","אחר כך הציגו תרחיש של רעידת אדמה חזקה.","שכונה שלמה נפגעה. כבישים חסומים.","חלק מהרשת הסלולרית אינו עובד.","מערכי ההצלה מתוחים עד הקצה.","בתי החולים קולטים נפגעים.","אלפי תושבים אינם יודעים אם הבתים שלהם בטוחים.","השאלה הייתה פשוטה:","מה עושה הקהילה בשעתיים הראשונות?","ראש צוות חירום מיישוב ישראלי אמר:","״מחלקים אזורים. מי שיכול יוצא לבדוק שכנים. פותחים נקודת מידע. מזהים קשישים, אנשים עם מוגבלויות ומשפחות שצריכות עזרה. מי שיש לו רכב מתאים מתחיל לנוע.״","מייק התערב.","״לפני שהמבנים נבדקו?״","״אם מישהו צועק מתוך בניין, אני לא מחכה למהנדס.״","״אבל אתה עלול להכניס עוד אנשים לסיכון.״","״נכון.״","״אז?״","הישראלי הסתכל עליו.","״אז אני צריך להחליט.״","מייק נשען לאחור.","״אצלנו זו בדיוק החלטה שהיינו מנסים להשאיר לגורמי חירום מקצועיים.״","האיש מאסיה התערב.","״באירוע גדול לא תמיד תהיה לך האפשרות הזאת.״","כולם הסתכלו אליו.","״אם נפגעו אלפי מבנים ויש מספר מוגבל של צוותים מקצועיים, הקהילה תפעל בין אם תכננת את זה ובין אם לא. השאלה אינה אם האזרחים יפעלו. השאלה היא אם הכנת אותם מספיק כדי שיעשו פחות טעויות.״","מייק הנהן לאט.","״זה הוגן.״","דוד כתב במחברת:","לא האם הקהילה תפעל. איך מכינים אותה לפעול טוב יותר.","בתרחיש של שיטפון התמונה השתנתה.","האישה מספרד סיפרה על אירוע שבו תושבים ניסו לפנות בעצמם שכונה לפני שהרשויות סגרו את הצירים.","״חלק מהיוזמה האזרחית עזרה מאוד,״ אמרה, ״וחלק יצרה לנו עוד בעיה. אנשים נכנסו למים עם רכבים, נתקעו, ואז צוותי החירום נאלצו להציל גם אותם.״","הישראלי שאל:","״אז מה עשיתם אחר כך?״","״בנינו רשימות של מתנדבים מוכרים והגדרנו נתיבי פעולה ברורים יותר.״","מיכל חייכה.","״כלומר הפכתם את האלתור לנוהל.״","״חלק ממנו.״","״ומה יקרה בשיטפון הבא אם התנאים יהיו אחרים?״","הספרדייה חייכה.","״נאלתר.״","החדר צחק. הפעם דוד רק הקשיב.","הוא כבר לא היה צריך לנסח לעצמו מחדש את הרעיון. הוא ראה אותו בפעולה.","בהפסקת הצהריים האנשים לא התפזרו.","מייק עמד עם ראש צוות החירום הישראלי ודיבר על מערכת היחסים עם המשטרה. אנה התווכחה עם מיכל על גבולות אחריות. האיש מאסיה הסביר לערן איך הם מעבירים מידע כשהתשתית הדיגיטלית עצמה קורסת.","דוד עמד בצד עם מתן.","״משהו פה מעניין אותי,״ אמר.","״רק משהו אחד?״","״כולם רוצים כמעט אותו דבר. להציל חיים, לשמור על קהילה, להחזיר תפקוד.״","״נכון.״","״אבל הם מתחילים ממקומות שונים לגמרי.״","מתן הנהן.","״כי המציאות שלהם שונה.״","״וגם התרבות. מידת האמון במדינה. היחסים עם המשטרה. השאלה כמה אחריות אזרח בכלל מצפה לקחת על עצמו.״","״כן.״","״אז אין שום היגיון לקחת את המודל שלנו ולנסות לשתול אותו במקום אחר.״","״יפה.״","״אבל גם אין היגיון להתעלם ממה שלמדנו כאן רק מפני שהמערכות שונות.״","מתן הסתכל עליו.","״אז מה כן?״","דוד הביט שוב בחצר.","״צריך למצוא את העקרונות שמתחת למודל.״","מתן חייך.","״זה כבר נשמע כמו משימה לשעה שאחרי האוכל.״","אחרי ההפסקה ניר שינה את סדר היום.","הוא חילק את המשתתפים לארבע קבוצות מעורבות. בכל קבוצה היו אנשים ממדינות שונות, וביקש מהם דבר אחד:","אל תנסו להסכים על מודל. נסו למצוא עקרונות שתוכלו לקחת לכל מקום ולהתאים למציאות המקומית.","הדיונים נמשכו כמעט שעה.","כשחזרו לחדר, ארבעת הדפים שנתלו על הקיר נראו בתחילה שונים לגמרי.","אבל ככל שקראו אותם, חזרו שוב ושוב אותם רעיונות.","מייק עמד ליד הלוח.","״אולי פשוט ננסה לנסח אותם יחד.״","ניר הנהן.","״בדיוק בשביל זה אנחנו פה.״","הם התחילו למחוק. לחבר. להתווכח על מילים.","האם לכתוב ״אחריות קהילתית״ או ״יכולת קהילתית״.","האם מתנדב צריך ״סמכות״ או ״מרחב פעולה״.","מה ההבדל בין גמישות לבין חוסר משמעת.","האם צריך לכתוב שהמערכת המרכזית ״מובילה״ את הקהילה או ״מתאמת״ איתה.","השיחה נעשתה איטית יותר. פחות מרשימה.","ולכן בעיני דוד -חשובה יותר.","בסוף היום היו על הלוח שישה עקרונות.","1. הקהילה היא חלק ממערך החירום","לא רק אוכלוסייה שממתינה לסיוע.","בכל מקום רמת האחריות והסמכות תהיה שונה, אבל תושבים, מנהיגות מקומית וקהילות מחזיקים ידע ויכולת שאי אפשר להחליף מבחוץ.","2. יכולת מקומית בונים לפני האירוע","לא בזמן רעידת האדמה מתחילים לברר מי מחזיק רכב שטח, מי מכיר את האוכלוסייה המבוגרת, איפה יש ציוד, מי מסוגל להוביל צוות ומי יכול לפתוח מקום לקליטת תושבים.","3. מבנה הפעולה צריך להיות ברור -אך גמיש","ברור מספיק כדי שאנשים יבינו אחריות, גבולות וקשר עם מערכות החירום.","גמיש מספיק כדי לאפשר פעולה כשהתרחיש האמיתי אינו דומה לתוכנית.","4. יוזמה אזרחית היא כוח שצריך להכין","לא לדכא אותה ולא להניח שהיא תמיד טובה.","להכשיר אנשים לקחת יוזמה תוך הבנת בטיחות, תיאום וגבולות פעולה.","5. אחרי אירוע לומדים גם מההצלחות הלא־מתוכננות","לא רק ״מה נכשל״. גם: מה הייתה הבעיה? מה עשינו? למה זה עבד?","ומה מתוך זה יכול להיות שימושי במקום אחר?","6. עקרונות יכולים לעבור בין מדינות. מודלים חייבים להשתנות","החוק שונה. התרבות שונה. היחסים עם המשטרה שונים. רמת האמון בממשלה שונה. מבנה הרשויות שונה.","ולכן אי אפשר להעתיק מערכת של מדינה אחת לאחרת.","אפשר ללמוד את העיקרון -ואז לבנות לו צורה מקומית.","מייק קרא שוב את הרשימה.","״על זה אני יכול לחתום.״","אנה חייכה.","״גם אני. וזה מפתיע בהתחשב בכמה שלא הסכמנו בבוקר.״","הישראלי שישב מולה אמר:","״אנחנו עדיין לא מסכימים.״","״נכון.״","״פשוט עכשיו אנחנו יודעים על מה.״","החדר צחק.","דוד הסתכל על ששת העקרונות.","זה לא היה מודל ישראלי.","זה גם לא היה מסמך שנכתב מראש והגיעו עשרים איש כדי לאשר.","הוא נוצר בחדר.","אבל ניר לא נתן להם לסיים שם.","״עקרונות בלי פעולה הם סיכום כנס,״ אמר.","מתן הצביע עליו.","״עכשיו אני מבין למה דוד היה צריך אותך.״","ניר התעלם.","״כל משלחת יוצאת מפה עם ניסוי אחד. קטן. לא תוכנית לאומית. דבר שאפשר לבדוק בחודשים הקרובים.״","האמריקאים בחרו לבחון הכשרה של מנהיגות קהילתית בתוך מבנה הסמכויות המקומי שלהם.","ההולנדים החליטו לבדוק כיצד ניתן לתת למתנדבים מקומיים מרחב פעולה גדול יותר בזמן אירוע בלי לאבד תיאום.","הספרדים לקחו את הרעיון של מיפוי יכולות קהילתיות עוד לפני אירוע -לא רק רשימת מתנדבים אלא אנשים, ציוד, ידע וקשרים.","והישראלים החליטו דווקא לקחת משהו מהביקורת שקיבלו במהלך היום: להגדיר טוב יותר מראש מהם גבולות היוזמה המקומית, כדי שהמהירות והאלתור לא יהפכו בעצמם לסיכון.","ערן צילם את הלוח.","״מתי בודקים מה קרה?״","הוא שאל את זה כאילו מדובר בשאלה טכנית.","אנה ענתה לפני דוד.","״עוד חצי שנה.״","מייק הסתכל עליה.","״כאן?״","היא משכה בכתפיה.","״למה לא?״","הספרדייה הוסיפה:","״אבל בפעם הבאה אני לא רוצה מצגות על מה שתכננו. רק מה עשינו ומה קרה.״","מיכל הנהנה.","״מסכימה.״","מייק הסתכל על דוד.","״אתה מארגן?״","דוד עמד לענות. ואז עצר. משהו בסיטואציה הצחיק אותו.","הוא לא הציע פגישת המשך.","הם ביקשו אותה.","״כן,״ אמר. ״נארגן.״","ניר כבר פתח יומן.","על הלוח נכתבה שורה נוספת:","מפגש המשך -בעוד שישה חודשים.","ומתחתיה ארבע משימות.","ארצות הברית -ניסוי במנהיגות קהילתית.","הולנד -גמישות מבוקרת למתנדבים.","ספרד -מיפוי יכולות קהילה.","ישראל -גבולות ברורים ליוזמה מקומית.","לאף אחד לא היה עדיין תקציב לפרויקט גדול.","לא הייתה מסגרת בינלאומית. לא היה משרד. לא היה מוסד.","רק ארבע קבוצות של אנשים שחזרו הביתה עם משהו שהם רצו לנסות -והסכמה לחזור ולספר זה לזה מה קרה.","דוד הסתכל על הלוח.","פעם היה מחפש ברגע כזה את המשפט הגדול.","היום הוא חיפש משהו אחר.","מי אחראי. מה עושים. מתי נפגשים שוב. הוא הסתכל על מתן.","״אתה יודע מה מוזר?״","״מה?״","״לא הייתי צריך לשכנע אותם להמשיך.״","מתן הביט באנשים שהחליפו פרטים ליד הדלת.","״אולי כי היה להם שימוש בזה.״","דוד הנהן. זה היה פשוט.","ואולי זו הייתה ההוכחה החשובה ביותר שקיבלו עד עכשיו.","אנשים לא רצו לחזור בגלל החזון של דוד.","הם רצו לחזור כי העבודה המשותפת עזרה להם לראות את הבעיה שלהם טוב יותר.","כשכולם יצאו, נשארו על הלוח ששת העקרונות, ארבעת הניסויים והתאריך בעוד חצי שנה.","דוד צילם אותו. לא בשביל מצגת. בשביל לזכור את הרגע.","עד עכשיו הוא והצוות דחפו את הדרך קדימה.","אספו אנשים. התקשרו. שכנעו. ארגנו.","הפעם קרה משהו מעט אחר.","אנשים מבחוץ הגיעו, עבדו, התווכחו -ובסוף ביקשו להמשיך.","הדרך עדיין הייתה קטנה.","אף אחד לא ידע לאן היא תגיע.","אבל היא כבר לא הייתה רק שלהם.","דוד הביט פעם אחרונה בלוח לפני שניר התחיל למחוק אותו.","שישה עקרונות. ארבעה ניסויים. פגישה נוספת.","אולי זו הייתה הפעם הראשונה שבה הוא הרגיש שהם כבר לא מנסים להוכיח שיש דרך.","הם התחילו ללכת בה."],"chars":11365},{"id":"ch17","title":"פרק 17 -מי בעל הבית?","parts":["הבעיה התחילה דווקא מזה שהדברים הצליחו.","לא הצליחו במובן הגדול.","לא הייתה מערכת לאומית, לא היה מרכז בירושלים, אף משרד ממשלתי לא אימץ תוכנית, ואף אחד לא הזמין את דוד לנאום על חזון חדש למדינת ישראל.","אבל היו כבר אנשים שרצו להמשיך.","מייק שלח הודעה מארצות הברית וביקש את הסיכום של ששת העקרונות.","אנה כתבה מהולנד שהם התחילו לבחון מודל חדש לעבודה עם מתנדבים מקומיים ורצתה לדעת אם אפשר לצרף לפגישה הבאה גם נציג מרשות נוספת.","הספרדים ביקשו פרטים על האופן שבו הישראלים ממפים יכולות בתוך קהילה.","מיכל אמרה ששתי מועצות נוספות בארץ שמעו על הניסוי ורוצות להבין מה בדיוק הם עושים.","ואז הגיע מייל שהיה הרבה פחות מרגש מכל השאר, אבל הרבה יותר משמעותי.","מי מממן את מפגש ההמשך?","דוד קרא אותו פעמיים.","עד עכשיו כמעט כל הדבר הזה התקיים על כוח רצון.","עמית פתח דלתות. ניר מצא חדרים.","אנשים השתתפו במסגרת התפקידים שלהם או על חשבון הזמן שלהם.","מישהו שילם על קפה. מישהו אחר דאג לתרגום.","ערן בנה דברים כמעט בלי לחשב שעות.","דוד עצמו כבר לא ידע כמה זמן השקיע.","כל עוד הם היו צוות קטן שעושה ניסויים, אפשר היה לחיות כך.","אבל עכשיו היו ארבע מדינות שרצו לחזור בעוד חצי שנה.","היה צריך מקום. טיסות. תרגום. תיאום. חומרים.","אנשים שיעבדו על זה בין המפגשים.","מישהו צריך היה להיות אחראי.","דוד פתח את קבוצת הוואטסאפ.","שאלה קטנה: מי בעל הבית על הדבר הזה?","מתן ענה ראשון.","ידעתי שזה יגיע.","ערן:","דוד.","דוד כתב:","ממש לא.","ניר:","אז צריך לדבר.","הם נפגשו יומיים אחר כך.","הפעם ניר הגיע עם טבלה.","מתן הסתכל עליה ואמר:","״זהו. נגמר החלק הכיפי.״","״הוא נגמר לפני כמה חודשים,״ אמר ניר.","על המסך הופיעו שורות של הוצאות.","מפגש המשך.","ניהול קשר עם השותפים בחו״ל.","תרגום. תיעוד. מדידה. הפעלת הניסויים. אדמיניסטרציה.","״כרגע אין לכם בעיית חזון,״ אמר ניר. ״יש לכם בעיית בעלות.״","דוד הסתכל עליו.","״בעלות על מה?״","״לא על הרעיון. על העבודה. מי אחראי לקום בבוקר ולוודא שהדברים קורים?״","מיכל אמרה:","״אנחנו.״","״מי זה אנחנו?״","החדר שתק. ניר חייך.","״בדיוק.״","עמית נשען לאחור.","״זו שאלה שאנחנו חייבים לפתור לפני שמגדילים.״","ערן הציע:","״אולי פשוט להיכנס תחת גוף קיים.״","״איזה?״ שאל דוד.","״עמותה שכבר עושה משהו דומה. מכון. גוף ציבורי.״","מתן שאל:","״ואז הרעיון הופך לפרויקט שלהם?״","״אולי.״","״זה לא בהכרח רע.״","דוד שתק.","הוא הרגיש התנגדות כמעט אינסטינקטיבית, ולא אהב אותה.","הרי רק בפרק הקודם הבין שהרעיון לא אמור להיות שלו.","אז למה המחשבה שמישהו אחר יחזיק אותו הפריעה לו?","עמית הבחין.","״זו אפשרות שצריך לבדוק.״","״ומה האפשרויות האחרות?״ שאל דוד.","ניר ספר על האצבעות.","״להישאר התארגנות לא רשמית. להיכנס תחת גוף קיים. להפוך לפרויקט ממשלתי. להקים גוף עצמאי.״","מתן הרים יד.","״ויש אפשרות חמישית.״","כולם הסתכלו עליו.","״להחליט שזה היה ניסוי נחמד וללכת הביתה.״","דוד חייך.","״אני מניח שאתה מציע אותה רק כדי לשמור על התפקיד שלך.״","״בדיוק.״","עמית חיבר אותם שבוע אחר כך לאישה בשם תמר, שכיהנה בתפקיד בכיר במשרד החוץ ועסקה בשיתופי פעולה בינלאומיים.","הפגישה הייתה בירושלים.","הפעם דוד הגיע עם ניר ועמית.","שלושה אנשים. מצגת של שבעה שקפים. דוד התעקש על שבעה. ניר רצה ארבעה. הם התפשרו על שישה.","מתן טען שהפשרה עצמה מוכיחה שהצוות כבר נהיה ממשלתי.","דוד לא לקח אותו לפגישה.","״אני נעלב,״ אמר.","״זה סימן שהחלטתי נכון.״","תמר הקשיבה כמעט בלי לעצור אותם.","דוד הציג בקצרה את הדרך.","הפיילוט עם בני הנוער.","הניסוי במעבר מבית חולים לקהילה.","הלמידה מחירום אזרחי. המפגש הבינלאומי. ששת העקרונות. ארבעת הניסויים.","מפגש ההמשך שנקבע כי המשתתפים עצמם ביקשו אותו.","הוא לא הזכיר את ישעיהו.","לא את הרצל.","לא את ירושלים כמרכז של מחלוקת.","לא מפני שוויתר עליהם.","אלא מפני שלמד שלכל חדר יש שפה אחרת.","בסוף המצגת תמר הסתכלה עליו.","״מעניין.״","דוד חיכה.","הוא כבר למד ש״מעניין״ יכולה להיות מחמאה או דרך מנומסת לסיים פגישה.","תמר המשיכה.","״אז מה אתם רוצים מאיתנו?״","דוד עצר. הוא ידע שהשאלה תגיע.","ובכל זאת, כשהגיעה, הבין שהתשובה שלו לא מספיק טובה.","״אנחנו רוצים שהמדינה תהיה שותפה.״","״שותפה איך?״","״בחיבורים. בהבאת מדינות. אולי גם במימון.״","תמר הנהנה.","״מי אתם?״","דוד חייך מעט.","״כרגע? צוות.״","״איזה גוף?״","״אין גוף.״","״חשבון בנק?״","״לא.״","״אפשרות לחתום על הסכם?״","״לא.״","״להעסיק עובד?״","״לא.״","תמר הסתכלה על עמית.","״אז כרגע אני יכולה לעזור לדוד אישית. לא לפרויקט.״","ניר הנהן.","״זו בדיוק הסיבה שאנחנו פה.״","תמר הסתכלה שוב על דוד.","״חשבתם שזה צריך להיות במשרד החוץ?״","״כן.״","״ואתה רוצה את זה?״","דוד לא ענה מיד.","״אני לא יודע.״","תמר חייכה.","״תשובה טובה. כי אני לא בטוחה שאתה רוצה.״","״למה?״","״אם זה יהיה פרויקט של משרד החוץ, יהיו לזה יתרונות עצומים. קשרים. לגיטימציה. יכולת לעבוד מול ממשלות. אבל מהרגע שזה שלנו, זה גם יהיה חלק ממדיניות החוץ של מדינת ישראל.״","״וזה לא מה שאנחנו רוצים?״","״לפעמים כן. אבל תחשוב על מי שאתה רוצה להביא לחדר בעתיד.״","דוד שתק.","״אם אתם באמת רוצים לבנות מקום שבו מדינות, רשויות, אנשי מקצוע וקהילות מגיעים כדי ללמוד יחד, לא תמיד נכון שממשלת ישראל תהיה בעלת הבית.״","עמית שאל:","״אבל בלי הממשלה הם יתקשו להגיע להרבה מהמדינות האלה.״","״נכון. לכן אני לא אומרת שהמדינה צריכה להיות בחוץ. להפך. אני אומרת שאולי היא צריכה להיות שותפה -לא הבעלים.״","דוד נשען קדימה.","״מה זה אומר בפועל?״","״גוף עצמאי. מקצועי. לא מפלגתי ככל שאפשר. כזה שיכול לעבוד עם הממשלה, לקבל תמיכה, לבנות שותפויות, אבל לא משתנה בכל פעם שמתחלף שר.״","ניר שאל:","״עמותה?״","תמר משכה בכתפיה.","״אולי.״","דוד חייך.","״כל פעם שאנחנו מגיעים למסקנה, מישהו אומר אולי.״","״כי עמותה היא רק צורה משפטית. היא לא תשובה.״","דוד הנהן.","הוא שמע את ניר עוד לפני שניר אמר משהו.","תמר המשיכה.","״אבל אם אתם הולכים לשם, תחשבו על הדבר הזה כפרויקט לאומי שעובד עם הממשלה -לא כעמותה שמגיעה פעם בשנה לבקש תמיכה ממשרד החוץ.״","המשפט נרשם במחברת של דוד מיד.","פרויקט לאומי שעובד עם הממשלה.","לא פרויקט של הממשלה. ולא פרויקט פרטי. משהו באמצע. תמר קמה והלכה ללוח.","״אם הייתי במקומכם, הייתי שומרת על שלושה דברים.״","היא כתבה.","עצמאות מקצועית.","״שלא כל שר חדש יוכל לשנות לכם את המטרה.״","מתחת:","שותפות ממשלתית.","״כי יש דלתות שרק מדינה יכולה לפתוח, ויש מערכות ציבוריות שלא יזוזו בלי שיתוף פעולה ממשלתי.״","והשלישי:","רוחב.","דוד שאל:","״מה זה אומר?״","״שלא תהפכו לכלי של משרד אחד. אם תעסקו בבריאות -משרד הבריאות. בחינוך -חינוך. בחירום -פנים, רשויות, גופי הצלה. בעולם -חוץ. אם באמת מדובר בשיטה שעוברת בין תחומים, היא לא יכולה להיות שייכת למשרד אחד.״","עמית חייך.","״זו בדיוק הבעיה שלנו.״","״וזה אולי גם היתרון שלכם.״","בסוף הפגישה תמר אמרה:","״אני יכולה לעשות שני דברים.״","דוד הרים את הראש.","״אחד, לחבר אתכם לשתי מדינות נוספות שמחפשות כרגע עבודה בתחום של חוסן וחירום אזרחי.״","ניר כתב.","״ושתיים?״","״אם תבנו גוף מסודר ותביאו תוכנית לשנה הקרובה, אני מוכנה לבדוק איך אנחנו משתלבים כשותף במפגש הבא.״","דוד השתדל לא להיראות נלהב מדי.","״שותף איך?״","״אל תרוץ. תבנו קודם משהו שאפשר להיות שותפים שלו.״","עמית חייך אליו.","״שמעת.״","בדרך חזרה ניר אמר:","״אז עמותה.״","דוד הסתכל עליו.","״אתה אמרת לא לקפוץ.״","״אני עדיין אומר.״","״אבל?״","״אבל כרגע זו האפשרות הכי הגיונית.״","״למה?״","״כי חברה פרטית תיצור בעיות אחרות. פרויקט ממשלתי יהיה תלוי יותר מדי במשרד ובתקציב שלו. להישאר לא רשמיים כבר לא מתאים להיקף. ואם ניכנס מתחת לעמותה אחרת, אנחנו צריכים למצוא גוף שהחזון שלו כמעט זהה לשלנו.״","״אז נקים.״","ניר הסתכל עליו.","״לא.״","דוד צחק.","״מה עכשיו?״","״עכשיו בודקים מה העמותה אמורה לעשות.״","״היא תחזיק את הפרויקט.״","״איזה פרויקט?״","דוד עצר. ניר המשיך.","״כמה עובדים? מה התקציב? מי מייסד? מי יושב בוועד? איך שומרים שלא תזוהה פוליטית? איך מכניסים שותפים מהאקדמיה, מהחברה האזרחית ומהממשלה? מי הבעלים של התוצרים? האם מדינה שמשתתפת יכולה להשתמש בידע?״","״אתה יודע להרוס רגעים.״","״בשביל זה הבאת אותי.״","״אתה ומתן מתחרים עכשיו?״","״אני יותר יעיל.״","בערב דוד סיפר ליעל.","״נראה לי שאנחנו מקימים עמותה.״","יעל הרימה אליו מבט.","״מי זה אנחנו?״","דוד עצר.","״הצוות.״","״הצוות החליט?״","״עוד לא.״","״אז אתם עדיין לא מקימים עמותה.״","דוד צחק.","״את וניר דיברתם?״","״לא צריך.״","״אבל הכיוון נראה נכון.״","״אז תביא אותו לצוות.״","״ברור.״","יעל המשיכה לאכול. אחרי כמה רגעים שאלה:","״ומה אתה רוצה שהעמותה תהיה?״","דוד חשב.","״בית לפרויקט.״","״מה זה אומר?״","״שתהיה יכולה להחזיק את האנשים, המפגשים, התקציב. לעבוד עם הממשלה, אבל לא להיות הממשלה.״","״ולמה זה חשוב?״","״כי אני רוצה שזה יהיה לאומי, אבל לא ממשלתי.״","יעל הנהנה.","״זה כבר ניסוח יותר מעניין.״","״מדינה שותפה, לא בעלת הבית.״","״ומי בעל הבית?״","דוד חייך.","״זה בדיוק הוויכוח.״","ישיבת הצוות הייתה ארוכה.","דוד הציג את ארבע האפשרויות.","להישאר לא רשמיים. להיכנס תחת גוף קיים. פרויקט ממשלתי.","עמותה עצמאית בשותפות עם הממשלה.","עמית תמך בכיוון האחרון.","״אני רוצה שזה יחזיק גם אחרי שממשלה תתחלף.״","מיכל הסכימה, אבל הסתייגה.","״אם לא תהיה ממשלה בפנים, אנחנו נהיה עוד עמותה שמסבירה למדינה מבחוץ מה היא צריכה לעשות. אני לא רוצה את זה.״","״גם אני לא,״ אמר דוד.","ערן שאל:","״ומי יממן?״","״ממשלה, פילנתרופיה, אולי שותפים בינלאומיים,״ אמר ניר. ״צריך תמהיל.״","מתן הקשיב הרבה זמן. בסוף שאל:","״למה עמותה?״","ניר התחיל לענות. מתן עצר אותו.","״לא משפטית. רעיונית. למה הדבר הזה צריך גוף?״","דוד הסתכל עליו.","״כי הוא כבר גדול מדי כדי להתקיים רק על קשרים אישיים.״","״עוד.״","״כי צריך מי שישמור את הידע. מי שיעקוב אחרי הניסויים. מי שיחבר בין אנשים. מי שיארגן מפגשים. מי שיחזיק צוות.״","״עוד.״","דוד חשב.","״כי אם אנחנו רוצים לבנות משהו לטווח ארוך, הוא לא יכול להיות תלוי בי.״","מתן חייך קלות.","״עכשיו אני בעד.״","החדר שתק. דוד הרגיש את המשפט.","עד עכשיו, גם כשהוא אמר שזה לא הפרויקט שלו, הרבה מהדבר באמת היה תלוי בו.","הטלפונים. האנרגיה. החיבורים. הדחיפה.","אבל חזון לאומי שבנוי סביב אדם אחד הוא לא חזון לאומי.","הוא מיזם אישי.","וזה לא מה שהוא רצה.","הם הגדירו ארבעה עקרונות לארגון החדש.","הראשון:","עצמאי -אבל עובד עם המדינה.","השני:","מקצועי -לא מפלגתי.","השלישי:","רב־תחומי -לא שייך למשרד או תחום אחד.","והרביעי:","רזה -לפחות בהתחלה.","לא בניין. לא עשרות עובדים. לא מחלקות.","צוות קטן שמחזיק ניסויים, ידע, קשרים ומפגשים.","ניר כתב על הלוח:","מה העמותה עושה בשנה הראשונה?","הם הגיעו לארבע משימות.","להחזיק את הניסויים הקיימים ולמדוד אותם.","לקיים את מפגש ההמשך הבינלאומי.","לפתוח שני תחומים חדשים.","ולבנות שותפות מסודרת עם הממשלה ועם גופים נוספים בישראל ובעולם.","״זה הכול,״ אמר ניר.","ערן הסתכל עליו.","״זה הכול?״","״אם נעשה את זה באמת, יהיה לנו מספיק מה לעשות.״","אחר כך הגיע החלק שאף אחד מהם לא התלהב ממנו.","מייסדים. ועד. תקנון. תקציב. שם. מתן אמר:","״אם נגיע לדיון בשם אני הולך.״","דוד חייך.","״עוד לא.״","״יופי.״","ניר התחיל לחלק משימות. הוא קרא:","״תקנון וייעוץ משפטי -אני ועמית.״","עמית הנהן.","״תקציב לשנה ראשונה -אני וערן.״","ערן כתב.","״שותפים ממשלתיים -דוד ועמית.״","״בסדר.״","״ועד מייסד -כולנו חושבים על שמות. לא רק חברים. צריך אנשים עם משקל, ניסיון, וגיוון אמיתי.״","מיכל שאלה:","״ומה דוד עושה?״","ניר הסתכל עליו.","״דוד מתחיל להבין שהתפקיד שלו נהיה יותר קשה.״","״מה התפקיד?״","דוד שאל בעצמו. ניר חשב רגע.","״לשמור שהעמותה לא תהפוך להיות המטרה.״","החדר שתק. דוד הסתכל עליו. זה היה מדויק. קל מאוד להתאהב בגוף. בשם. במשרד. בתקציב. בעובדים.","ופתאום הדבר שהוקם כדי לקדם חזון מתחיל לעבוד בעיקר כדי לשמור על עצמו.","״זה עליי,״ אמר דוד.","בסיום הישיבה ניר שלח בקבוצה רשימת משימות.","עמותה -הקמה:","תקנון.","ועד מייסד.","תקציב ראשוני.","תוכנית עבודה לשנה.","פגישה נוספת עם משרד החוץ.","מיפוי שותפים ממשלתיים.","מודל מימון.","דוד הסתכל על הרשימה.","לפני פחות משנה הייתה לו מחברת.","בתוכה משפטים.","שאלות.","פסוקים.","הרצל.","ירושלים.","רעיונות שאפילו הוא לא היה בטוח אם הוא מאמין בהם.","עכשיו הייתה לו רשימת משימות להקמת עמותה.","מתן כתב בקבוצה:","שאלה אחת לפני שנרשמים: מי בעל הבית?","ערן שלח אימוג׳י צוחק.","ניר כתב:","הוועד, משפטית.","מתן:","תודה ניר. זו בדיוק לא הייתה השאלה.","דוד הסתכל על המסך.","התחיל לכתוב:","אני.","מחק.","כתב:","אנחנו.","מחק גם את זה.","בסוף כתב:","אף אחד מאיתנו.","מתן:","אז מי?","דוד חשב רגע.","ואז כתב:","החזון. אנחנו רק מחזיקים אותו מספיק טוב כדי שיוכל להמשיך גם אחרינו.","כמה שניות לא הייתה תגובה.","ואז מתן כתב:","טוב. הפעם אני לא הורס.","דוד חייך.","אולי זו הייתה ההחלטה הארגונית החשובה הראשונה שלהם.","לא מי ינהל.","לא מי יחתום.","לא מי יגייס כסף.","אלא ההבנה שהגוף שהם עומדים להקים אינו אמור להפוך לבעל הבית על הרעיון.","הוא אמור לתת לו בית."],"chars":11122},{"id":"ch18","title":"פרק 18 -אז מה עושים ביום ראשון?","parts":["הרישום של העמותה הסתיים ביום שלישי בבוקר.","ניר שלח בקבוצה צילום מסך.","נרשמה.","ערן הגיב באימוג׳י של שמפניה.","מתן כתב:","זהו? עכשיו אנחנו ממסד?","מיכל:","חכה לחשבון הבנק. שם נגמרת המהפכה.","דוד חייך. הוא הביט שוב בצילום. שם. מספר. כתובת זמנית. ועד מייסד.","מסמך משפטי פשוט למדי, שבמבט ראשון לא היה בו שום דבר שדמה לישעיהו, להרצל, לירושלים של 2048 או לכל הדברים הגדולים שדוד כתב במחברות שלו בשנה האחרונה.","ובכל זאת, משהו בו ריגש אותו.","הרעיון קיבל מספר.","זה היה אולי הדבר הכי לא־רומנטי שיכול לקרות לחזון.","ואולי בדיוק בגלל זה -חשוב.","יעל עמדה במטבח כשדוד הראה לה.","״מזל טוב,״ אמרה.","״תודה.״","״איך אתה מרגיש?״","דוד חשב רגע.","״כאילו עשינו טעות.״","יעל חייכה.","״יופי.״","״למה יופי?״","״כי עד עכשיו כל פעם שהתקדמת, היית בטוח שאתה בדרך הנכונה. עכשיו זה נהיה מספיק אמיתי כדי לפחד.״","״מעודד מאוד.״","״זו הייתה המטרה, לא?״","דוד הסתכל שוב על המסמך.","״כן.״","״אז מה עושים עכשיו?״","הוא הרים אליה מבט. זו הייתה שאלה פשוטה.","אבל היא הייתה בדיוק השאלה.","בישיבת הצוות הראשונה אחרי הרישום ניר כתב על הלוח:","מה עושים ביום ראשון?","מתן נכנס שתי דקות אחרי הזמן, קרא את הכותרת והתיישב.","״סוף סוף שאלה שאני מבין.״","ניר המשיך.","״יש עמותה. משרד החוץ מוכן להשתתף במהלך ראשון. יש ארבע מדינות שכבר רוצות להמשיך ועוד שתי מדינות שתמר יכולה לחבר. אם לא נחליט עכשיו מה עושים, תוך חודש יהיה לנו אתר, לוגו, עמוד לינקדאין וכנס שנתי -ולא יהיה לנו מושג למה.״","ערן הסתכל עליו.","״אני מרגיש מותקף.״","״בצדק.״","דוד חייך. עמית שאל:","״אז מה ההצעה?״","ניר הסתכל על דוד. דוד כבר הכין משהו.","״תוכנית עבודה בינלאומית ראשונה.״","מתן הרים גבה.","״שם קטן וצנוע.״","״אין לה עדיין שם.״","״מצוין. תמשיך.״","דוד נעמד ליד הלוח.","״לא כנס. לא עוד יום עבודה. מסגרת של חצי שנה. שש מדינות. כולן עובדות על חירום אזרחי, אבל כל אחת מגיעה עם בעיה אמיתית שלה.״","ערן שאל:","״כולן אותה בעיה?״","״לא.״","״אז איך עובדים יחד?״","״דרך אותם עקרונות.״","דוד הצביע על הרשימה שכבר הכירו היטב. רחבת בלי לעקוף את מערכי החירום הרשמיים.","ההולנדים התמקדו בשיטפונות ובשאלה כמה חופש פעולה נותנים למתנדבים מקומיים.","הספרדים רצו לבנות מראש תמונת יכולות קהילתית -אנשים, ציוד, מבנים וידע מקומי -במקום להתחיל לאסוף אותה בזמן האירוע.","המדינה האסייתית הביאה בעיה של רעידות אדמה וקריסת תקשורת.","ישראל בחרה דווקא את אחת החולשות שעלו במפגש הקודם:","איך שומרים על היוזמה והאלתור הישראלי, אבל מגדירים מראש גבולות שמונעים מיוזמה להפוך לסיכון.","דוד הסתכל על רשימת המקרים.","פעם הוא היה מחפש את המשותף.","עכשיו הוא כבר ידע שהמשותף לא חייב להיות האירוע.","המשותף היה הדרך. נשארה שאלה אחת. איפה בירושלים? היו הצעות למלונות. לאוניברסיטה. למרכז כנסים.","אפילו להצטרף לאחד מגופי החדשנות שכבר פעלו בעיר.","בסוף ניר מצא שלושה חדרים להשכרה בתוך מתחם עבודה ציבורי לא רחוק מקריית הממשלה.","שלושה חדרים. מטבחון. שירותים במסדרון.","חדר ישיבות אחד עם שולחן לעשרים איש אם אף אחד לא זז יותר מדי.","דוד הגיע לראות. ניר פתח את הדלת.","״ברוך הבא להיכל השלום.״","דוד צחק. הקירות היו לבנים.","באחת הפינות עמד מזגן שהשמיע רעש מעט חשוד.","השולחן בחדר הישיבות היה מורכב משלושה שולחנות שחוברו יחד.","על אחד הקירות נשאר סימן מרובע מתמונה שהייתה תלויה שם פעם.","״קצת פחות היכל ממה שהרצל דמיין,״ אמר דוד.","ניר הניח את המפתחות על השולחן.","״מצוין. יש פחות לנקות.״","דוד עמד במרכז החדר.","הוא ניסה לדמיין אותו מלא.","אנגלית. עברית. מבטאים שונים. אנשים מתווכחים. על הלוח מקרים אמיתיים.","לא עוד שיחה על חזון.","עבודה.","מתן נכנס כמה דקות אחר כך.","הסתכל סביב.","״זהו?״","״זהו.״","״בשביל זה דיברת איתי שנה על ירושלים?״","״תן לזה זמן.״","מתן חייך.","״זה דווקא מוצא חן בעיניי.״","״למה?״","״כי קשה מאוד להפוך שלושה חדרים לאוטופיה.״","הידיעה הראשונה על העמותה התפרסמה שבוע לפני פתיחת התוכנית.","לא כתבת שער.","אתר חדשות קטן פרסם ידיעה:","עמותה חדשה בשיתוף משרד החוץ תשיק בירושלים תוכנית בינלאומית לחירום אזרחי.","תוך כמה שעות הופיעו תגובות.","עוד עמותה שמקבלת כסף ציבורי.","קודם שילמדו לנהל את החירום אצלנו.","מי אנחנו שנלמד את העולם?","ומצד אחר:","למה משרד החוץ מעביר פעילות לגוף פרטי?","אחר כתב:","עוד מכון בירושלים שיזמין אנשים לדבר ויגיש קפ אום ישנו אחד ליד השני. מישהו שהיה הפוך ממך פוליטית שמר לך על הגב. אנשים עשו דברים שלא חשבו שהם מסוגלים לעשות.״","הוא עצר.","״והייתה תחושה שאי אפשר פשוט לחזור אחר כך לאותו דבר.״","נתן הנהן.","״וחזרנו.״","אורי חייך בלי שמחה.","״בערך.״","״יותר גרוע,״ אמר נתן.","מתן לא אמר כלום. דוד גם לא. אורי המשיך:","״זה מה שיושב לי. לא ציפיתי שנהיה פתאום עם אחד, מאוחד, כולם מתחבקים. אני לא ילד. אבל כן הייתה לי תחושה שמשהו שעברנו יחד חייב להשאיר אחריו משהו.״","נתן הסתכל עליו.","״אתה יודע שאני לא אוהב את המשפטים האלה.״","״איזה?״","״'המלחמה חייבת להשאיר משהו'. לא. היא לא חייבת. היא הייתה מלחמה. אנשים נהרגו. אנשים נפצעו. אסור לקחת את זה ולהפוך את זה לחומר גלם לרעיונות יפים.״","אורי הנהן.","״מסכים.״","דוד הסתכל על נתן.","זו הייתה אותה רגישות שהייתה בו גם אז.","והיא עדיין הייתה נכונה.","״גם אני,״ אמר דוד.","נתן הסתכל אליו.","״אבל אני יודע שיש לך אבל.״","״יש.״","״נו.״","דוד נשען קדימה.","״אני לא חושב שהמלחמה קרתה בשביל שנפיק ממנה חזון. זה יהיה נורא להגיד. אבל אנחנו כן יכולים לבחור מה אנחנו עושים עם מה שהיא חשפה לנו.״","נתן לא ענה.","״היא הראתה לנו משהו על עצמנו,״ המשיך דוד. ״לא רק דברים טובים. גם דברים קשים. אבל היא כן הראתה לנו שבמצבים מסוימים החברה הזאת יודעת להיות אחרת.״","אורי הנהן.","״בדיוק.״","דוד המשיך.","״לקחת אחריות. לא לחכות שמישהו יפתור. להסתדר עם אנשים שלא בחרת. לאלתר. לשנות תוכנית. להמשיך גם כשאין לך מושג איך זה ייגמר.״","נתן אמר:","״כן. ואז בבית אנחנו חוזרים לריב על חניה.״","״נכון.״","״אז מה זה מוכיח?״","דוד חייך קלות.","״שום דבר.״","נתן חיכה.","״אבל זה כן מראה שיש בנו יכולות שאנחנו לא יודעים להפעיל טוב בחיים הרגילים.״","אורי נשען אחורה.","״אני אגיד לך יותר מזה. אני לא רוצה שנצטרך עוד מלחמה כדי להיות האנשים שהיינו שם.״","אף אחד לא צחק. דוד הסתכל אליו.","״זה בדיוק העניין.״","נתן הרים גבה.","״מה?״","״שאולי לא צריך להמציא חברה חדשה לגמרי. אולי ראינו ממנה חתיכות ברגעים הכי קשים שלנו.״","מתן הסתכל עליו.","״רק תיזהר לא להפוך את המילואים למודל אידיאלי לחברה.״","״ברור שלא.״","״כי צבא זה לא מדינה. פקודה זה לא דיון ציבורי. משימה זה לא דמוקרטיה.״","״נכון. אני לא אומר להעתיק את הצבא. אני מדבר על תכונות.״","״איזה?״","דוד חשב רגע.","״תעוזה. אלתור. אומץ. אחריות. יכולת להתחיל לפעול גם כשאין ודאות.״","אורי אמר:","״חוצפה.״","״גם.״","נתן חייך.","״סוף סוף משהו אמיתי.״","דוד המשיך:","״אבל מה שחסר לפעמים בחיים האזרחיים הוא הצד השני.״","״איזה צד?״ שאל אורי.","״ענווה. צניעות. היכולת להבין שלא כל מה שאנחנו עושים נכון רק כי הוא שלנו. היכולת לעצור, ללמוד, להקשיב, לתקן.״","מתן הנהן.","״עכשיו זה כבר יותר מעניין.״","דוד הסתכל עליהם.","״אולי אלה כלי הבניין. לא החזון עצמו.״","נתן שאל:","״ומה החזון?״","דוד שתק רגע.","זו הייתה אותה שאלה של פעם.","אבל כבר לא הייתה לו תשובה של משפט אחד.","״כיוון,״ אמר.","נתן עשה פרצוף.","״כיוון זה לא חזון.״","״דווקא כן.״","״תסביר.״","דוד הסתכל עליו.","״אני לא חושב שחזון צריך להיות תמונה של מדינה מושלמת. אני לא יודע איך מדינת ישראל צריכה להיראות בעוד חמישים שנה. אף אחד לא יודע. אבל אפשר לדעת לאיזה כיוון רוצים ללכת.״","אורי אמר:","״כמו שאמרתי אז.״","דוד חייך.","״כן. בדיוק כמו שאמרת אז.״","נתן הסתכל על אורי.","״מה אמרת?״","״שאני לא צריך מדינה מושלמת. אני רוצה להרגיש שאנחנו הולכים לאנשהו.״","מתן חייך.","״כל הספר הזה כדי לגלות שאורי צדק בפרק שבע.״","דוד צחק.","״בערך.״","אורי הרים את הכוס.","״אני מבקש אחוזים.״","נתן חזר לדוד.","״טוב. אז לאן?״","דוד חשב.","״לחברה שלומדת.״","נתן מיד שאל:","״זהו?״","״לא.״","״יופי.״","״לחברה שיודעת לברר. שיודעת להחזיק מחלוקת בלי שכל ויכוח הופך לשאלה מי נשאר ומי הולך. שיודעת לקחת ניסיון ולהפוך אותו לידע. ידע למעשה. ומעשה לעוד למידה.״","מתן אמר:","״זה כבר מה שאתם עושים בפרויקט.״","״בדיוק. אבל הפרויקט הוא רק דוגמה.״","דוד המשיך.","״אם החברה באמת רואה את עצמה ככה, זה מתחיל להשפיע על המערכות. לא כי מישהו מוציא פקודה. כי יש כיוון.״","נתן שאל:","״איך כיוון משנה מערכת?״","״תחשוב על זה. אם אנחנו באמת אומרים שאנחנו חברה לומדת, אז כישלון ממשלתי לא אמור להיעלם עם ועדת בדיקה. צריך לצאת ממנו ידע. אם אנחנו חברה שמבררת, מערכת חינוך צריכה לדעת ללמד ילדים להתווכח בלי לשנוא. אם אנחנו חברה שמאמינה בענווה, אנחנו צריכים לדעת ללמוד גם ממדינות שאנחנו רגילים לחשוב שהן צריכות ללמוד מאיתנו.״","אורי אמר:","״ואם אנחנו חברה שמאלתרת?״","״אז לא להרוג את האלתור. ללמוד ממנו.״","נתן הנהן.","״זה לפחות משהו שכבר ראיתם שעובד.״","״כן.״","השיחה זזה שוב לצבא.","אורי סיפר על פתרון קטן שהיה להם באחד הסבבים.","משהו לוגיסטי פשוט. לא פטנט. לא טכנולוגיה.","סידור אחר של משימות שפתר בעיה שהטריפה את כולם במשך ימים.","״ותוך יומיים זה כבר עבד,״ אמר.","״ומה קרה אחרי הסבב?״ שאל דוד.","אורי חייך.","״כלום.״","״עבר ליחידה הבאה?״","״לא יודע.״","״נכתב?״","״אולי.״","נתן אמר:","״אז אתה רוצה להפוך את המדינה כולה לתחקיר צבאי?״","דוד צחק.","״לא. אבל יש משהו ברעיון של תחקיר. לא במובן של לחפש מי אשם. במובן של לשאול: מה קרה? למה? מה למדנו? מה עושים אחרת בפעם הבאה?״","מתן אמר:","״בתנאי שלא עושים את התחקיר רק כדי לסמן וי.״","״בדיוק.״","דוד הסתכל על אורי.","״האלתור שלך היה טוב. אבל אם הוא מת איתך, הוא נשאר אלתור. אם מישהו אחר לומד ממנו ומשפר אותו, הוא כבר נהיה ידע.״","נתן שתק כמה רגעים.","״אני עדיין לא אוהב את המילה 'חברת מופת'.״","דוד הסתכל עליו.","״למה?״","״כי היא נשמעת כאילו אנחנו שוב רוצים לתת לעצמנו ציון.״","״מסכים.״","״אז למה בכלל להשתמש בה?״","דוד הסתכל החוצה.","״כי אולי אפשר להבין אותה אחרת.״","״איך?״","״לא כחברה שאומרת 'תראו כמה אנחנו טובים'. אלא כחברה שיש לה דרך.״","נתן חיכה.","״חברה שלא מפסיקה לבדוק את עצמה. שלא חושבת שהיא גמרה. שיש לה אומץ לנסות וענווה להודות כשזה לא עובד. שיודעת להשתמש במחלוקת כדי להשתפר במקום רק כדי להכריע.״","אורי אמר:","״זה עדיין נשמע מאוד יפה.״","״ברור. זה חזון.״","נתן חייך.","״לפחות אתה מודה.״","דוד המשיך.","״אבל חשוב לי הסדר. אני לא רוצה שנהיה 'חברת מופת' ואז העולם יבוא לראות כמה אנחנו מדהימים. זה בדיוק הפוך.״","״מה הפוך?״","״אנחנו נבחר דרך. ננסה לחיות לפיה. נבנה מערכות שמתאימות לה. ניכשל ונשנה. ואם אחרי עשרים, שלושים, חמישים שנה נהיה חברה טובה יותר בגלל זה -אז אולי בדיעבד מישהו יקרא לזה חברת מופת.״","מתן הנהן.","״כלומר מופת כתוצאה. לא כתואר.״","״בדיוק.״","נתן הסתכל עליו.","״ואז הם יבואו.״","דוד חייך.","״אולי.״","״הנה. חזרנו להתחלה.״","״כן.״","״אז מה השתנה?״","דוד נשען אחורה.","״היום אני לא רוצה שהם יבואו בגלל שאנחנו מושלמים. אני רוצה שהם יבואו בגלל שיש כאן תהליך ששווה להשתתף בו.״","אורי שאל:","״מה כל כך מיוחד בתהליך?״","דוד חשב.","הוא לא רצה לחזור על כל מה שכבר אמר להם בעבר.","אז אמר רק:","״שהוא לא נעצר בדיבור.״","אורי חיכה.","״אנשים מגיעים עם בעיה. מביאים ניסיון. מתווכחים. בודקים. מנסים משהו בעולם האמיתי. חוזרים עם תוצאות. מתקנים. ואז עוד פעם.״","נתן אמר:","״יש מקומות בעולם שעושים דברים כאלה.״","״ברור.״","״אז מה מיוחד בירושלים?״","״אולי עצם החיבור. לא רק מחקר. לא רק מדיניות. לא רק חדשנות. מקום שמארגן את כל זה סביב בעיות אמיתיות ומכריח את הידע לעבור למעשה.״","מתן הוסיף:","״ומכריח אנשים שונים להישאר באותו חדר גם כשהם לא מסכימים.״","דוד חייך.","״גם.״","אורי הביט בדוד.","״אז עכשיו אתה כבר מוכן לדבר על ישעיהו?״","נתן הניח את הראש בידיים.","״ידעתי שזה יגיע.״","מתן צחק. דוד לא מיהר.","״דווקא לא צריך הרבה.״","״נס.״","״פעם קראתי את הנבואה וחשבתי על הסוף. עמים באים לירושלים. שלום. תמונה גדולה.״","מתן הנהן.","״והיום?״","״היום אני חושב יותר על הדרך שבין הדברים. על אנשים שבאים כי יש פה משהו שהם רוצים להיות חלק ממנו. על בירור. על למידה. על דבר שיוצא מהמקום הזה והופך למעשה.״","נתן שאל:","״ואתה אומר שזה הפירוש של ישעיהו?״","״לא.״","דוד ענה מיד.","״אני אומר שזה הכיוון שאני יודע לקחת ממנו.״","מתן חייך.","״השתפרת.״","דוד המשיך.","״והרצל עוזר לי בצד השני. הוא מזכיר לי שחזון שלא מקבל צורה נשאר מילים.״","אורי אמר:","״אז ישעיהו אומר לאן והרצל אומר לבנות?״","דוד חייך.","״בגרסה מאוד גסה, כן.״","מתן נאנח.","״אני מבקש שלא תצטט אותו.״","נתן שיחק עם הכוס הריקה.","״אני רוצה לחזור למלחמה.״","דוד הסתכל עליו.","״דווקא עכשיו?״","״כן. כי בסוף משם התחלת.״","דוד הנהן. נתן המשיך.","״אתה לא חושש שכל הדבר הזה הוא פשוט ניסיון שלך לתת משמעות למשהו שלא הייתה לו משמעות?״","השאלה נשארה על השולחן. דוד לא ענה מיד.","״כן,״ אמר בסוף.","נתן הרים אליו מבט.","״כן מה?״","״כן. אני חושש מזה.״","אורי הקשיב.","״אני לא רוצה להגיד שהמלחמה הייתה בשביל משהו. אני גם לא רוצה להגיד שמי שנהרג בה ציווה עליי לבנות את החזון הזה. זה לא שלי להגיד.״","נתן הנהן. דוד המשיך.","״אבל אני כן חושב שאחרי מה שעברנו, יש לנו אחריות לבחור מה אנחנו עושים עכשיו.״","״זה כבר משהו אחר,״ אמר נתן.","״אני לא יכול לשנות למה המלחמה קרתה. אני כן יכול לבחור אם , איתרו כמה תושבים מבוגרים והתחילו לפעול עוד לפני שכל המערכות הרשמיות התייצבו.","באירוע אחר זה כמעט יצר בלגן.","שני צוותים מקומיים קיבלו החלטות שונות לגבי אותה דרך.","אחד סגר. השני השאיר פתוח. אנה עמדה ליד הלוח.","״הצלחנו להגדיל עצמאות,״ אמרה. ״לא בנינו מספיק טוב את התיאום.״","מיכל שאלה:","״אז אתם חוזרים אחורה?״","״לא.״","״למה?״","״כי המהירות השתפרה. עכשיו אנחנו מנסים לשמור את המהירות ולתקן את התיאום.״","דוד הסתכל על הלוח.","פעם היה שומע “זה עבד” ונרגע.","עכשיו דווקא המקומות שבהם משהו נשבר עניינו אותו יותר.","בספרד הציגו את מיפוי היכולות הקהילתיות שבנו.","רכבים. מתנדבים. מבנים. ציוד. בעלי מקצוע. אנשים שזקוקים לסיוע. הכול היה מסודר.","ואז הגיע אירוע אמיתי, קטן יחסית, והתברר שכמעט שליש מהמידע באחת השכונות כבר אינו נכון.","אדם שהיה רשום כבעל רכב מסחרי עבר.","מרכז שהיה אמור לשמש נקודת כינוס היה בשיפוץ.","מתנדבים החליפו כתובת. הספרדייה חייכה.","״בנינו מפה מצוינת של העבר.״","ערן שאל:","״אז מה אתם עושים?״","״מפסיקים לחשוב על מאגר. מתחילים לחשוב על מידע חי.״","ניר כתב על הלוח:","מידע חי, לא מסמך.","האמריקאים הציגו תוצאות מעורבות.","באזור אחד נוצרה רשת שכונתית חזקה יותר.","באזור אחר כמעט אף אחד לא הגיע להכשרה השנייה.","ליאת שאלה:","״למה?״","מייק משך בכתפיים.","״חשבנו שאנשים רוצים לקחת יותר אחריות.״","אחד הישראלים חייך.","״והם לא?״","״חלק כן. אבל הרבה אנשים רוצים שמערכת החירום תעבוד. הם לא רוצים להפוך בעצמם לחלק ממנה.״","מתן אמר:","״כלומר ניסיתם לייבא ישראלים.״","החדר צחק. מייק הנהן.","״בערך. וזה לא עבד.״","הצוות האסייתי הביא את הכישלון הכי ברור.","הם בנו מערכת תקשורת חלופית למקרה של קריסת סלולר.","ציוד חולק. תפקידים הוגדרו. אנשים עברו הדרכה.","בתרגיל הראשון, כמעט חצי מהמשתתפים פשוט חזרו לטלפונים שלהם.","אחרים לא זכרו את ערוץ הקשר.","שתי נקודות דיווח נפתחו במקום הלא נכון.","בסוף עצרו את התרגיל. החדר היה שקט. ליאת שאלה:","״אז מה למדתם?״","האיש שהציג חייך.","״שבנינו מערכת שהייתה ברורה למתכננים ולא לאנשים.״","״ומה עכשיו?״","״אנחנו זורקים חצי ממנה.״","ערן שאל:","״חצי?״","״אולי יותר.״","הוא משך בכתפיים.","״אבל עכשיו אנחנו יודעים מה לא לבנות.״","מייק אמר:","״זה אולי הדבר הכי שימושי ששמענו היום.״","אף אחד לא התווכח. ישראל הציגה אחרונה.","במהלך החודשים היה אירוע אזרחי אמיתי באחת הרשויות שהשתתפו בתהליך -שריפה שהתפשטה בשטח פתוח סמוך לכמה שכונות.","לא אסון לאומי.","אבל מספיק כדי לבדוק מה נשאר מהתיאוריה כשיש עשן, טלפונים וחוסר ודאות.","מיכל הציגה.","״ניסינו לא להגדיר לאנשים בדיוק מה לעשות בכל מצב. הגדרנו שלושה דברים: מי מחזיק את התמונה, מה צוות מקומי יכול להחליט לבד, ובאיזה שלב חייבים לעצור ולהעביר החלטה לגורם מקצועי.״","על המסך הופיע ציר הזמן.","תוך עשרים דקות התחילו צוותים מקומיים לבדוק אוכלוסייה מבוגרת.","מתנדבים פתחו נקודת מידע.","רכבים מקומיים סייעו בפינוי ציוד.","באחד המקומות, קבוצה רצתה לפתוח נתיב שלא אושר.","הפעם היא עצרה. בדקה. חיכתה.","״זה עיכב אותם בשלוש דקות,״ אמרה מיכל, ״אבל מנע מהם להיכנס לאזור שכבר הוגדר מסוכן.״","אנה שאלה:","״אז מצאתם את האיזון?״","מיכל צחקה.","״לא. מצאנו דרך טובה יותר לחפש אותו.״","אחרי ארוחת הצהריים ליאת חילקה דף.","בראשו הייתה שאלה אחת:","מה למדנו על הדרך -לא על החירום?","הקבוצות התפזרו. כעבור שעה הקיר התמלא. לא להתחיל מפתרון. להגדיר בעיה אמיתית.","להביא לחדר אנשים שרואים חלקים שונים שלה.","לא לפחד מהתנגשות. להפוך רעיון לניסוי.","להחליט מראש מה רוצים לדעת.","למדוד גם כישלון. לתעד. לשנות. לחזור.","האישה מספרד עמדה מול הקיר.","״זה כבר לא מסמך על חירום.״","ערן חייך.","״לא.״","״אצלנו יש בעיה מאוד דומה במעבר מבית חולים לקהילה.״","אנה אמרה:","״גם אצלנו.״","האיש מאסיה הוסיף:","״אני חושב על חינוך.״","מייק הסתכל על דוד.","״אז למה לעצור כאן?״","ערן חייך אליו.","״עכשיו מותר לדבר על מרכז?״","״לא,״ אמר דוד.","מתן הרים יד.","״אני רוצה לציין לפרוטוקול שהאיש הזה באמת השתנה.״","דוד ניגש ללוח.","״אני כן חושב שאפשר להמשיך. אבל קטן.״","הוא כתב:","חירום וחוסן","בריאות","חינוך","״שלושה מסלולים. לא יותר.״","מיכל הסתכלה על הרשימה. ואז אמרה:","״רגע.״","דוד הסתובב.","״מה?״","״יש פה משהו שחסר.״","״מה?״","היא הצביעה על האנשים בחדר.","״יש לנו הולנד. ספרד. ארצות הברית. אסיה. משרד החוץ. איפה ישראל?״","דוד חייך.","״ישראל פה.״","״לא לזה אני מתכוונת.״","החדר שקט. מיכל קמה.","״אני לא שואלת איפה הממשלה. אני שואלת איפה האנשים. איפה קריית שמונה? איפה שדרות? איפה באר שבע? איפה רהט? איפה רשות קטנה בצפון שאין לה מחלקת חדשנות, אבל יש בה אנשים שעשו דברים מדהימים כי לא הייתה להם ברירה?״","עמית הנהן. מיכל המשיכה:","״אם הידע שיצטבר פה יגיע תמיד מאותם בתי חולים גדולים, מאותן רשויות חזקות ומאותם אנשים שיודעים להגיע לירושלים -לא בנינו פרויקט לאומי. בנינו מועדון.״","דוד הסתכל על הלוח. היא צדקה. ניר לקח טוש.","״אז מוסיפים עיקרון.״","הוא כתב בצד:","כל מסלול חייב להתחיל גם מהשטח הישראלי.","מיכל עצרה אותו.","״לא 'גם'.״","״אז מה?״","״מהשטח.״","היא לקחה ממנו את הטוש.","כל מסלול מתחיל בבעיות אמיתיות מתוך החברה הישראלית.","מתחת כתבה:","צפון. דרום. ערים. מועצות. יהודים. ערבים. מרכז. פריפריה.","ערן שאל:","״זה לא נהיה מורכב מדי?״","״כן,״ אמרה.","״אז?״","״החברה מורכבת.״","מתן חייך.","״טיעון שקשה להתווכח איתו.״","פתאום שלושת המסלולים נראו אחרת.","חינוך לא התחיל ב״מערכת החינוך הישראלית״.","הוא התחיל במנהל בית ספר בקריית שמונה שניסה לבנות מחדש קהילה אחרי תקופה ארוכה שבה תלמידים ומשפחות נעקרו מהשגרה.","בריאות לא התחילה רק בבית חולים גדול במרכז.","היא התחילה גם ברופאה בדרום שניסתה להחזיק רצף טיפול עבור חולים שנסעו מרחקים ארוכים בין שירותים שונים.","חירום לא התחיל רק במועצה חזקה עם צוות מקצועי.","מיכל הציעה לצרף גם יישוב בדואי שבו המבנה הקהילתי שונה לחלוטין, ולכן גם פתרון שנראה מובן מאליו במקום אחד עלול לא להתאים בכלל במקום אחר.","דוד הביט בשמות שעלו.","פתאום הבין את הטעות שהייתה יכולה לקרות להם כמעט בלי לשים לב.","הם רצו להביא את העולם לירושלים.","אבל אם רק קבוצה קטנה של ישראל הייתה מגיעה איתו לשולחן, הם היו מפספסים חצי מהחזון.","דוד נשען אחורה.","משהו ישן עלה לו בראש.","לא ישעיהו הפעם. פסוק אחר.","״ירושלים הבנויה כעיר שחוברה לה יחדיו.״","מתן הסתכל אליו.","״בדקת הפעם?״","החדר צחק. דוד חייך.","״כן.״","״יפה. תמשיך.״","״יש דרשה בירושלמי. רבי יהושע בן לוי אומר עליה -'עיר שהיא עושה כל ישראל לחברים'.״","מיכל הסתכלה עליו. דוד הרים יד.","״אני יודע. ההקשר המקורי אחר. אני לא אומר שזה פירוש לתוכנית שלנו.״","מתן הנהן באישור.","״אפשר להמשיך.״","״אבל יש בדימוי הזה משהו. אולי ירושלים בסיפור הזה לא אמורה להיות המקום שמלמד את ישראל.״","דוד הסתכל על הרשימה function route(){const k=decodeURIComponent(location.hash.slice(1));if(k.startsWith('read/')){const id=k.split('/')[1];if(BOOK_DATA.some(c=>c.id===id)){renderRead(id);return}}renderHome()}
function go(id){closePop();location.hash='read/'+id;if(current===id){renderRead(id)}}
function renderHome(){current=null;document.getElementById('barTitle').textContent='אין זו אגדה. מה הלאה?';document.getElementById('progress').classList.add('hide');let last=BOOK_DATA.find(c=>c.id===state.last)||BOOK_DATA[0];app.innerHTML=`<div class="home"><div class="home-shell"><div class="hero"><div class="cover-card" aria-label="כריכת הספר"><img src="${COVER_IMAGE}" alt="כריכת הספר אין זו אגדה. מה הלאה?"></div><div class="intro-card"><div class="eyebrow">ספר דיגיטלי · קריאה חופשית · מותאם לנייד</div><h1>ספר שמתחיל בסיפור — ונמשך בשאלה.</h1><p class="lead">"אין זו אגדה. מה הלאה?" הוא מסע ספרותי ורעיוני על החברה הישראלית, על האחריות שאחרי המלחמה, ועל החזון שאפשר לכתוב יחד.</p><div class="actions"><button class="primary" onclick="go('intro')">מתחילים לקרוא ←</button><button class="pill" onclick="go('${esc(last.id)}')">המשך קריאה: ${esc(entryLabel(last))}</button></div><div class="info-pills"><span class="chip">ללא הרשמה</span><span class="chip">כל הספר פתוח בחינם</span><span class="chip">מחשבות נשמרות אנונימית במכשיר</span></div><div class="home-panels"><div class="quick-panel"><h3>תוכן העניינים</h3><p>גישה ישירה לכל פרק, מ"פתח דבר" ועד האפילוג ו"על המחבר".</p></div><div class="quick-panel"><h3>ממשיכים את השיחה</h3><p>בסיום פרקים נבחרים מחכה שאלה פתוחה אחת — בלי להפריע לקריאה עצמה.</p></div></div></div></div><div class="visual-band"><img src="${VISION_IMAGE}" alt="איור קווי של ירושלים ואנשים בדרך לעיר"><div class="visual-overlay"><div class="quote-card"><strong>לא רק איך שומרים על מה שקיים — אלא מה בונים מכאן והלאה.</strong><span>הספר מבקש לפתוח מרחב של מחשבה: אישי, לאומי ואזרחי. לכן הגרסה הדיגיטלית בנויה כחוויית קריאה שקטה, ורק אחר כך כשיחה.</span></div></div></div><h2 class="section-title" id="toc">תוכן העניינים</h2><div class="chapter-grid">${BOOK_DATA.map(c=>`<button class="chapter-btn" onclick="go('${c.id}')"><small>${c.id==='intro'?'לפני שמתחילים':c.id==='epilogue'?'סיום הסיפור':c.id==='about'?'מידע נוסף':'מסע בעקבות חזון'}</small>${esc(entryLabel(c))}</button>`).join('')}</div><div class="home-note">הספר מוצג כאן בגרסה דיגיטלית המבוססת על טיוטה 1. אין להפיץ או להעתיק את הטקסט ללא אישור המחבר. © שמעון כהן.</div></div></div>`;window.scrollTo(0,0)}

function renderRead(id){current=id;const i=BOOK_DATA.findIndex(c=>c.id===id),c=BOOK_DATA[i];state.last=id;document.getElementById('barTitle').textContent=entryLabel(c);document.getElementById('progress').classList.remove('hide');const parts=c.parts.map(p=>/^\*\s*\*\s*\*$/.test(p)?'<p class="scene" aria-label="מעבר סצנה">* * *</p>':'<p>'+esc(p)+'</p>').join('');let q=QUESTIONS[id]?`<section class="question"><div class="eyebrow">רגע למחשבה · לבחירה חופשית</div><h2>לאן ממשיכים מכאן?</h2><p>${esc(QUESTIONS[id])}</p><textarea id="reflection" placeholder="אפשר לכתוב לעצמך מחשבה..."></textarea><p class="muted">בגרסה הזו הטקסט נשמר במכשיר שלך בלבד ואינו נשלח לאיש. מנגנון שליחה אנונימית ומאושרת לפרסום יפותח בשלב הבא.</p><button class="pill" id="saveReflection">שמור מחשבה במכשיר</button> <button class="smalllink" id="copyReflection">העתק תשובה</button></section>`:'';const prev=i>0?'<button class="pill" id="prevChapter">→ לפרק הקודם</button>':'<span></span>';const next=i+1<BOOK_DATA.length?'<button class="primary" id="nextChapter">לפרק הבא ←</button>':'<button class="pill" id="endHome">חזרה לעמוד הבית</button>';app.innerHTML=`<article class="reader"><div class="readerhead"><div class="eyebrow" style="text-align:center">אין זו אגדה. מה הלאה?</div><h1>${esc(entryLabel(c))}</h1><div class="orn">✦</div></div><div class="booktext">${parts}</div>${q}<footer class="readerfoot"><div class="muted">© שמעון כהן · כל הזכויות שמורות</div><div class="navline">${prev}${next}</div></footer></article>`;const prevBtn=document.getElementById('prevChapter');if(prevBtn)prevBtn.onclick=()=>go(BOOK_DATA[i-1].id);const nextBtn=document.getElementById('nextChapter');if(nextBtn)nextBtn.onclick=()=>go(BOOK_DATA[i+1].id);const endBtn=document.getElementById('endHome');if(endBtn)endBtn.onclick=()=>{location.hash='';renderHome()};if(q){const a=document.getElementById('reflection');a.value=state.drafts[id]||'';document.getElementById('saveReflection').onclick=()=>{state.drafts[id]=a.value;save();t('המחשבה נשמרה במכשיר שלך')};document.getElementById('copyReflection').onclick=async()=>{try{await navigator.clipboard.writeText(a.value);t('המחשבה הועתקה')}catch{a.select();t('ניתן להעתיק את הטקסט המסומן')}}}if(state.last===id&&window.__restorePosition===id){window.scrollTo(0,state.position||0)}else{window.scrollTo(0,0)}window.__restorePosition=null;updateProgress()}
function updateProgress(){if(!current)return;const max=Math.max(1,document.documentElement.scrollHeight-innerHeight),p=Math.min(100,Math.max(0,scrollY/max*100));document.getElementById('progressFill').style.width=p+'%'}let scrollTimeout;addEventListener('scroll',()=>{updateProgress();if(current){clearTimeout(scrollTimeout);scrollTimeout=setTimeout(()=>{state.position=scrollY;save()},240)}},{passive:true});addEventListener('pagehide',()=>{if(current){state.position=scrollY;save()}});window.__restorePosition=state.last;
addEventListener('hashchange',()=>{state.position=0;save();route()});document.getElementById('homeButton').onclick=()=>{closePop();location.hash='';renderHome()};document.getElementById('settingsButton').onclick=()=>{document.getElementById('menu').classList.add('hide');document.getElementById('settings').classList.toggle('hide')};document.getElementById('menuButton').onclick=()=>{document.getElementById('settings').classList.add('hide');document.getElementById('menu').classList.toggle('hide')};document.getElementById('menuList').innerHTML=BOOK_DATA.map(c=>`<button onclick="go('${c.id}')">${esc(entryLabel(c))}</button>`).join('');document.getElementById('increase').onclick=()=>{state.size=Math.min(30,state.size+2);apply();save()};document.getElementById('decrease').onclick=()=>{state.size=Math.max(16,state.size-2);apply();save()};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;apply();save()});document.getElementById('share').onclick=async()=>{const u=location.href;try{if(navigator.share)await navigator.share({title:'אין זו אגדה. מה הלאה?',url:u});else{await navigator.clipboard.writeText(u);t('הקישור הועתק')}}catch{}};route();</script><script defer src="/_vercel/insights/script.js"></script></body></html>
